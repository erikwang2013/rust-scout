[package]
name = "rust-scout"
version = "0.8.0"
edition = "2021"
description = "Scout-style full-text search engine abstraction for Rust"
license = "MIT"
repository = "https://github.com/erikwang2013/rust-scout"
# 内部 AI 协作配置，不属于发布产物。docs/ 不能排除：README 直接引用
# docs/svg 的图表与 docs/coin 的打赏二维码，crates.io 上要能渲染出来。
exclude = ["CLAUDE.md"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "json"], optional = true }
tokio = { version = "1", features = ["net", "io-util", "sync", "time"], optional = true }

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "rustls-tls"]
optional = true

[features]
default = []
elasticsearch = ["dep:reqwest"]
xunsearch = ["dep:tokio"]
# meilisearch / algolia 的写入是「任务制」：POST 只入队，成败要看 /tasks/{uid}。
# 驱动会轮询到任务结束（否则写入失败会被静默吞掉），所以这两个特性需要 tokio 的
# 异步定时器 —— 不能在 async 里 `thread::sleep`，那会占死一个运行时工作线程。
meilisearch = ["dep:reqwest", "dep:tokio"]
typesense = ["dep:reqwest"]
algolia = ["dep:reqwest", "dep:tokio"]
database = ["dep:sqlx"]
null = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
