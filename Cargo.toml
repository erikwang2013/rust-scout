[package]
name = "rust-scout"
version = "0.1.0"
edition = "2021"
description = "Scout-style full-text search engine abstraction for Rust"
license = "MIT"
repository = "https://github.com/erikwang2013/rust-scout"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["json", "rustls-tls", "blocking"]
optional = true

[features]
default = []
elasticsearch = ["dep:reqwest"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
