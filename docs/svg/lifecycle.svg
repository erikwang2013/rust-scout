<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 13px; fill: #64748b; }
      .node  { fill: #ffffff; stroke: #2563eb; stroke-width: 1.6; rx: 10; }
      .node-alt { stroke: #f59e0b; }
      .step  { font-size: 12px; font-weight: 600; fill: #2563eb; }
      .name  { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .desc  { font-size: 10.5px; fill: #475569; }
      .hdr   { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .hdr-a { fill: #2563eb; }
      .hdr-b { fill: #10b981; }
      .cell  { font-size: 11.5px; fill: #334155; }
      .lbl   { font-size: 12px; fill: #64748b; font-weight: 600; }
    </style>
  </defs>

  <text x="550" y="42" text-anchor="middle" class="title">索引与文档生命周期</text>
  <text x="550" y="66" text-anchor="middle" class="sub">六个阶段覆盖索引从创建到销毁的完整旅程 — 驱动无关，语义统一</text>

  <!-- 节点 1 -->
  <rect x="30" y="100" width="160" height="120" class="node"/>
  <text x="110" y="124" text-anchor="middle" class="step">① 创建</text>
  <text x="110" y="148" text-anchor="middle" class="name">create_index</text>
  <text x="110" y="170" text-anchor="middle" class="desc">预建索引并传入</text>
  <text x="110" y="186" text-anchor="middle" class="desc">settings（ES 映射等）</text>
  <text x="110" y="202" text-anchor="middle" class="desc">索引名校验 + 转义</text>
  <line x1="190" y1="160" x2="220" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 节点 2 -->
  <rect x="220" y="100" width="160" height="120" class="node"/>
  <text x="300" y="124" text-anchor="middle" class="step">② 写入</text>
  <text x="300" y="148" text-anchor="middle" class="name">update</text>
  <text x="300" y="170" text-anchor="middle" class="desc">批量索引文档，按</text>
  <text x="300" y="186" text-anchor="middle" class="desc">doc.index 路由（默认</text>
  <text x="300" y="202" text-anchor="middle" class="desc">"default"），同 id 覆盖</text>
  <line x1="380" y1="160" x2="410" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 节点 3 -->
  <rect x="410" y="100" width="160" height="120" class="node node-alt"/>
  <text x="490" y="124" text-anchor="middle" class="step">③ 刷新</text>
  <text x="490" y="148" text-anchor="middle" class="name">flush</text>
  <text x="490" y="170" text-anchor="middle" class="desc">内存驱动 no-op；</text>
  <text x="490" y="186" text-anchor="middle" class="desc">ES 驱动 _refresh</text>
  <text x="490" y="202" text-anchor="middle" class="desc">（保证可见性）</text>
  <line x1="570" y1="160" x2="600" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 节点 4 -->
  <rect x="600" y="100" width="160" height="120" class="node"/>
  <text x="680" y="124" text-anchor="middle" class="step">④ 查询</text>
  <text x="680" y="148" text-anchor="middle" class="name">search / paginate</text>
  <text x="680" y="170" text-anchor="middle" class="desc">query + 过滤 + 排序</text>
  <text x="680" y="186" text-anchor="middle" class="desc">+ 分页，返回</text>
  <text x="680" y="202" text-anchor="middle" class="desc">SearchResult</text>
  <line x1="760" y1="160" x2="790" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 节点 5 -->
  <rect x="790" y="100" width="160" height="120" class="node"/>
  <text x="870" y="124" text-anchor="middle" class="step">⑤ 删除</text>
  <text x="870" y="148" text-anchor="middle" class="name">delete</text>
  <text x="870" y="170" text-anchor="middle" class="desc">按 id 移除文档，</text>
  <text x="870" y="186" text-anchor="middle" class="desc">内存驱动跨索引清理，</text>
  <text x="870" y="202" text-anchor="middle" class="desc">ES 驱动按 id 删</text>
  <line x1="950" y1="160" x2="980" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 节点 6 -->
  <rect x="980" y="100" width="100" height="120" class="node node-alt"/>
  <text x="1030" y="124" text-anchor="middle" class="step">⑥ 销毁</text>
  <text x="1030" y="148" text-anchor="middle" class="name">delete_index</text>
  <text x="1030" y="170" text-anchor="middle" class="desc">彻底删除</text>
  <text x="1030" y="186" text-anchor="middle" class="desc">索引及数据</text>

  <!-- 对照表 -->
  <text x="550" y="260" text-anchor="middle" class="lbl">两驱动行为对照</text>
  <rect x="60" y="272" width="490" height="30" rx="6" class="hdr hdr-a"/>
  <rect x="550" y="272" width="490" height="30" rx="6" class="hdr hdr-b"/>
  <text x="305" y="292" text-anchor="middle" class="hdr">CollectionEngine（默认 · 内存）</text>
  <text x="795" y="292" text-anchor="middle" class="hdr">ElasticsearchEngine（feature）</text>

  <rect x="60" y="302" width="490" height="26" rx="4" fill="#eff6ff"/>
  <rect x="550" y="302" width="490" height="26" rx="4" fill="#ecfdf5"/>
  <text x="75" y="320" class="cell">存储：进程内 HashMap&lt;index, docs&gt;，Mutex 保护</text>
  <text x="565" y="320" class="cell">存储：ES / OpenSearch 集群，REST + JSON</text>

  <rect x="60" y="328" width="490" height="26" rx="4" fill="#ffffff"/>
  <rect x="550" y="328" width="490" height="26" rx="4" fill="#ffffff"/>
  <text x="75" y="346" class="cell">全文：字段序列化子串匹配（不区分大小写）</text>
  <text x="565" y="346" class="cell">全文：query_string 语法（字段名:值 等）</text>

  <rect x="60" y="354" width="490" height="26" rx="4" fill="#eff6ff"/>
  <rect x="550" y="354" width="490" height="26" rx="4" fill="#ecfdf5"/>
  <text x="75" y="372" class="cell">过滤/排序：内存执行 matches() + sort_hits()</text>
  <text x="565" y="372" class="cell">过滤/排序：term/terms/must_not + sort 数组</text>

  <rect x="60" y="380" width="490" height="26" rx="4" fill="#ffffff"/>
  <rect x="550" y="380" width="490" height="26" rx="4" fill="#ffffff"/>
  <text x="75" y="398" class="cell">flush：no-op（写入即时可见）</text>
  <text x="565" y="398" class="cell">flush：POST _refresh（写入刷新到可搜）</text>

  <rect x="60" y="406" width="490" height="26" rx="4" fill="#eff6ff"/>
  <rect x="550" y="406" width="490" height="26" rx="4" fill="#ecfdf5"/>
  <text x="75" y="424" class="cell">分页默认取全部；排序默认按 id</text>
  <text x="565" y="424" class="cell">分页默认 size 10；排序默认 _score</text>

  <rect x="60" y="432" width="490" height="26" rx="4" fill="#ffffff"/>
  <rect x="550" y="432" width="490" height="26" rx="4" fill="#ffffff"/>
  <text x="75" y="450" class="cell">错误：仅内存/JSON 层（poison 防护）</text>
  <text x="565" y="450" class="cell">错误：HTTP / 后端错误原样透传</text>

  <!-- 错误路径 -->
  <text x="550" y="500" text-anchor="middle" class="lbl">错误路径（统一 ScoutError）</text>
  <text x="550" y="522" text-anchor="middle" class="cell">InvalidIndexName · InvalidResult · Unsupported · Json · Http · Backend — 全部收敛为 crate::Result&lt;T&gt;</text>
</svg>
