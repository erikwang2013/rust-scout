<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="lifeTitle">
  <title id="lifeTitle">Жизненный цикл индекса и документов: создание / запись / сброс / поиск / удаление / пересборка / уничтожение</title>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 13px; fill: #64748b; }
      .node  { fill: #ffffff; stroke: #2563eb; stroke-width: 1.6; }
      .node-alt { stroke: #f59e0b; }
      .step  { font-size: 11.5px; font-weight: 600; fill: #2563eb; }
      .name  { font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .desc  { font-size: 10px; fill: #475569; }
      .hdr   { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
      .cell  { font-size: 10.5px; fill: #334155; }
      .rowlb { font-size: 11px; font-weight: 600; fill: #0f172a; }
      .lbl   { font-size: 12px; fill: #64748b; font-weight: 600; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <text x="590" y="42" text-anchor="middle" class="title">Жизненный цикл индекса и документов</text>
  <text x="590" y="66" text-anchor="middle" class="sub">Семь этапов — весь путь индекса от создания до уничтожения: драйвер не важен, семантика едина</text>

  <!-- ==================== поток жизненного цикла ==================== -->
  <rect x="38" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="110" y="124" text-anchor="middle" class="step">① Создание</text>
  <text x="110" y="148" text-anchor="middle" class="name">create_index</text>
  <text x="110" y="172" text-anchor="middle" class="desc">Создаём индекс</text>
  <text x="110" y="188" text-anchor="middle" class="desc">с settings (маппинг ES)</text>
  <text x="110" y="204" text-anchor="middle" class="desc">проверка + escape</text>
  <line x1="183" y1="166" x2="198" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="198" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="270" y="124" text-anchor="middle" class="step">② Запись</text>
  <text x="270" y="148" text-anchor="middle" class="name">update</text>
  <text x="270" y="172" text-anchor="middle" class="desc">маршрут по doc.index</text>
  <text x="270" y="188" text-anchor="middle" class="desc">(иначе "default")</text>
  <text x="270" y="204" text-anchor="middle" class="desc">id перезапишет;</text>
  <text x="270" y="220" text-anchor="middle" class="desc mono">update_bulk</text>
  <line x1="343" y1="166" x2="358" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="358" y="100" width="145" height="132" rx="10" class="node node-alt"/>
  <text x="430" y="124" text-anchor="middle" class="step">③ Сброс</text>
  <text x="430" y="148" text-anchor="middle" class="name">flush</text>
  <text x="430" y="172" text-anchor="middle" class="desc">память / SQLite: no-op</text>
  <text x="430" y="188" text-anchor="middle" class="desc">HTTP: _refresh</text>
  <text x="430" y="204" text-anchor="middle" class="desc">запись видна</text>
  <line x1="503" y1="166" x2="518" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="518" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="590" y="124" text-anchor="middle" class="step">④ Поиск</text>
  <text x="590" y="148" text-anchor="middle" class="name">search / paginate</text>
  <text x="590" y="172" text-anchor="middle" class="desc">query + фильтр + сорт</text>
  <text x="590" y="188" text-anchor="middle" class="desc">и пагинация,</text>
  <text x="590" y="204" text-anchor="middle" class="desc">SearchResult</text>
  <line x1="663" y1="166" x2="678" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="678" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="750" y="124" text-anchor="middle" class="step">⑤ Удаление</text>
  <text x="750" y="148" text-anchor="middle" class="name">delete · delete_in</text>
  <text x="750" y="172" text-anchor="middle" class="desc">по id; delete_in —</text>
  <text x="750" y="188" text-anchor="middle" class="desc">один индекс.</text>
  <text x="750" y="204" text-anchor="middle" class="desc mono">soft_delete: таблица</text>
  <line x1="823" y1="166" x2="838" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="838" y="100" width="145" height="132" rx="10" class="node node-alt"/>
  <text x="910" y="124" text-anchor="middle" class="step">⑥ Пересборка</text>
  <text x="910" y="148" text-anchor="middle" class="name">reindex</text>
  <text x="910" y="172" text-anchor="middle" class="desc">копия from → to.</text>
  <text x="910" y="188" text-anchor="middle" class="desc">память: замена</text>
  <text x="910" y="204" text-anchor="middle" class="desc">ES: слияние _reindex</text>
  <line x1="983" y1="166" x2="998" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="998" y="100" width="145" height="132" rx="10" class="node node-alt"/>
  <text x="1070" y="124" text-anchor="middle" class="step">⑦ Стирание</text>
  <text x="1070" y="148" text-anchor="middle" class="name">delete_index</text>
  <text x="1070" y="172" text-anchor="middle" class="desc">индекс удалён</text>
  <text x="1070" y="188" text-anchor="middle" class="desc">и его данные</text>

  <!-- ==================== таблица сравнения драйверов ==================== -->
  <text x="590" y="278" text-anchor="middle" class="lbl">Различия четырёх семейств драйверов по этапам</text>

  <rect x="60" y="292" width="130" height="32" rx="6" fill="#f1f5f9"/>
  <rect x="195" y="292" width="218" height="32" rx="6" fill="#10b981"/>
  <rect x="413" y="292" width="218" height="32" rx="6" fill="#2563eb"/>
  <rect x="631" y="292" width="218" height="32" rx="6" fill="#d97706"/>
  <rect x="849" y="292" width="218" height="32" rx="6" fill="#94a3b8"/>
  <text x="74" y="313" class="lbl">Этап</text>
  <text x="304" y="313" text-anchor="middle" class="hdr">CollectionEngine</text>
  <text x="522" y="313" text-anchor="middle" class="hdr">HTTP-драйверы (ES, Meili, …)</text>
  <text x="740" y="313" text-anchor="middle" class="hdr">DatabaseEngine</text>
  <text x="958" y="313" text-anchor="middle" class="hdr">NullEngine</text>

  <!-- строка 1: носитель -->
  <rect x="60" y="328" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="347" class="rowlb">Носитель</text>
  <text x="207" y="347" class="cell">HashMap в процессе</text>
  <text x="425" y="347" class="cell">удалённый кластер</text>
  <text x="643" y="347" class="cell">файл SQLite</text>
  <text x="861" y="347" class="cell">нигде не хранится</text>

  <!-- строка 2: полный текст -->
  <rect x="60" y="358" width="1007" height="30" rx="4" fill="#f8fafc"/>
  <text x="74" y="377" class="rowlb">Полный текст</text>
  <text x="207" y="377" class="cell">подстрока по JSON</text>
  <text x="425" y="377" class="cell">синтаксис бэкенда</text>
  <text x="643" y="377" class="cell">LIKE + отбор в памяти</text>
  <text x="861" y="377" class="cell">всегда пусто</text>

  <!-- строка 3: фильтр и сортировка -->
  <rect x="60" y="388" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="407" class="rowlb">Фильтр / сорт</text>
  <text x="207" y="407" class="cell">память: matches + sort_hits</text>
  <text x="425" y="407" class="cell">пушдаун term / terms / sort</text>
  <text x="643" y="407" class="cell">память (total из SQL)</text>
  <text x="861" y="407" class="cell">нет</text>

  <!-- строка 4: flush -->
  <rect x="60" y="418" width="1007" height="30" rx="4" fill="#f8fafc"/>
  <text x="74" y="437" class="rowlb">flush</text>
  <text x="207" y="437" class="cell">no-op (запись видна)</text>
  <text x="425" y="437" class="cell">_refresh (доступно поиску)</text>
  <text x="643" y="437" class="cell">no-op</text>
  <text x="861" y="437" class="cell">no-op</text>

  <!-- строка 5: пагинация по умолчанию -->
  <rect x="60" y="448" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="467" class="rowlb">Пагинация</text>
  <text x="207" y="467" class="cell">все, сортировка по id</text>
  <text x="425" y="467" class="cell">size 10, по _score</text>
  <text x="643" y="467" class="cell">ориентир — hits</text>
  <text x="861" y="467" class="cell">пусто</text>

  <!-- строка 6: семантика delete -->
  <rect x="60" y="478" width="1007" height="30" rx="4" fill="#f8fafc"/>
  <text x="74" y="497" class="rowlb">Удаление</text>
  <text x="207" y="497" class="cell">по всем индексам</text>
  <text x="425" y="497" class="cell">только default (через delete_in)</text>
  <text x="643" y="497" class="cell">по id, по всем индексам</text>
  <text x="861" y="497" class="cell">no-op</text>

  <!-- строка 7: мягкое удаление -->
  <rect x="60" y="508" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="527" class="rowlb">soft_delete</text>
  <text x="207" y="527" class="cell">да (ставит метку)</text>
  <text x="425" y="527" class="cell">да (ставит метку)</text>
  <text x="643" y="527" class="cell">да (три режима)</text>
  <text x="861" y="527" class="cell">нет</text>

  <!-- ==================== путь ошибок ==================== -->
  <rect x="60" y="562" width="1007" height="58" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="74" y="584" class="lbl">Путь ошибок — всё сводится к crate::Result&lt;T&gt;</text>
  <text x="74" y="606" class="cell mono">InvalidIndexName · InvalidResult · Unsupported · Json · Http · Sqlx · Backend · XunSearch · XunSearchIo</text>
</svg>
