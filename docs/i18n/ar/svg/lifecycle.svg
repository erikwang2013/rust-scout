<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="lifeTitle">
  <title id="lifeTitle">دورة حياة الفهرس والمستند: إنشاء / كتابة / تحديث / استعلام / حذف / إعادة بناء / إتلاف</title>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 13px; fill: #64748b; }
      .node  { fill: #ffffff; stroke: #2563eb; stroke-width: 1.6; }
      .node-alt { stroke: #f59e0b; }
      .step  { font-size: 11.5px; font-weight: 600; fill: #2563eb; }
      .name  { font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .desc  { font-size: 10px; fill: #475569; }
      .hdr   { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
      .cell  { font-size: 10.5px; fill: #334155; }
      .rowlb { font-size: 11px; font-weight: 600; fill: #0f172a; }
      .lbl   { font-size: 12px; fill: #64748b; font-weight: 600; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <text x="590" y="42" text-anchor="middle" class="title">دورة حياة الفهرس والمستند</text>
  <text x="590" y="66" text-anchor="middle" class="sub">سبع مراحل تغطي رحلة الفهرس من الإنشاء إلى الإتلاف — مستقلة عن المحرك، بدلالة موحّدة</text>

  <!-- ==================== مسار دورة الحياة ==================== -->
  <rect x="38" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="110" y="124" text-anchor="middle" class="step">① الإنشاء</text>
  <text x="110" y="148" text-anchor="middle" class="name">create_index</text>
  <text x="110" y="172" text-anchor="middle" class="desc">أنشئ الفهرس مسبقًا،</text>
  <text x="110" y="188" text-anchor="middle" class="desc">وتمرير settings (خرائط ES)</text>
  <text x="110" y="204" text-anchor="middle" class="desc">تحقق من الاسم + تهريب</text>
  <line x1="183" y1="166" x2="198" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="198" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="270" y="124" text-anchor="middle" class="step">② الكتابة</text>
  <text x="270" y="148" text-anchor="middle" class="name">update</text>
  <text x="270" y="172" text-anchor="middle" class="desc">التوجيه حسب doc.index</text>
  <text x="270" y="188" text-anchor="middle" class="desc">("default" الافتراضي)</text>
  <text x="270" y="204" text-anchor="middle" class="desc">نفس id يُستبدل؛ وللكميّات</text>
  <text x="270" y="220" text-anchor="middle" class="desc mono">update_bulk</text>
  <line x1="343" y1="166" x2="358" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="358" y="100" width="145" height="132" rx="10" class="node node-alt"/>
  <text x="430" y="124" text-anchor="middle" class="step">③ التحديث</text>
  <text x="430" y="148" text-anchor="middle" class="name">flush</text>
  <text x="430" y="172" text-anchor="middle" class="desc">no-op：collection/SQLite</text>
  <text x="430" y="188" text-anchor="middle" class="desc">no-op：Meili/TS/Algolia</text>
  <text x="430" y="204" text-anchor="middle" class="desc">_refresh：ES</text>
  <line x1="503" y1="166" x2="518" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="518" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="590" y="124" text-anchor="middle" class="step">④ الاستعلام</text>
  <text x="590" y="148" text-anchor="middle" class="name">search / paginate</text>
  <text x="590" y="172" text-anchor="middle" class="desc">استعلام + تصفية + فرز</text>
  <text x="590" y="188" text-anchor="middle" class="desc">+ ترقيم، ويعيد</text>
  <text x="590" y="204" text-anchor="middle" class="desc">SearchResult</text>
  <line x1="663" y1="166" x2="678" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="678" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="750" y="124" text-anchor="middle" class="step">⑤ حذف المستندات</text>
  <text x="750" y="148" text-anchor="middle" class="name">delete · delete_in</text>
  <text x="750" y="172" text-anchor="middle" class="desc">الحذف حسب id؛ و delete_in</text>
  <text x="750" y="188" text-anchor="middle" class="desc">محصور بفهرس واحد.</text>
  <text x="750" y="204" text-anchor="middle" class="desc mono">soft_delete_in</text>
  <line x1="823" y1="166" x2="838" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="838" y="100" width="145" height="132" rx="10" class="node node-alt"/>
  <text x="910" y="124" text-anchor="middle" class="step">⑥ إعادة البناء</text>
  <text x="910" y="148" text-anchor="middle" class="name">reindex</text>
  <text x="910" y="172" text-anchor="middle" class="desc">نسخ الفهرس من from إلى to.</text>
  <text x="910" y="188" text-anchor="middle" class="desc">الذاكرة: استبدال الهدف</text>
  <text x="910" y="204" text-anchor="middle" class="desc">الدمج عبر _reindex في ES</text>
  <line x1="983" y1="166" x2="998" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="998" y="100" width="145" height="132" rx="10" class="node node-alt"/>
  <text x="1070" y="124" text-anchor="middle" class="step">⑦ الإتلاف</text>
  <text x="1070" y="148" text-anchor="middle" class="name">delete_index</text>
  <text x="1070" y="172" text-anchor="middle" class="desc">حذف الفهرس نهائيًا</text>
  <text x="1070" y="188" text-anchor="middle" class="desc">وكل بياناته</text>

  <!-- ==================== جدول مقارنة عائلات المحركات ==================== -->
  <text x="590" y="278" text-anchor="middle" class="lbl">كيف تختلف عائلات المحركات الأربع في كل مرحلة</text>

  <rect x="60" y="292" width="130" height="32" rx="6" fill="#f1f5f9"/>
  <rect x="195" y="292" width="218" height="32" rx="6" fill="#10b981"/>
  <rect x="413" y="292" width="218" height="32" rx="6" fill="#2563eb"/>
  <rect x="631" y="292" width="218" height="32" rx="6" fill="#d97706"/>
  <rect x="849" y="292" width="218" height="32" rx="6" fill="#94a3b8"/>
  <text x="74" y="313" class="lbl">المرحلة / السلوك</text>
  <text x="304" y="313" text-anchor="middle" class="hdr">CollectionEngine</text>
  <text x="522" y="313" text-anchor="middle" class="hdr">خلفيات HTTP (ES, Meili, …)</text>
  <text x="740" y="313" text-anchor="middle" class="hdr">DatabaseEngine</text>
  <text x="958" y="313" text-anchor="middle" class="hdr">NullEngine</text>

  <!-- الصف 1: التخزين -->
  <rect x="60" y="328" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="347" class="rowlb">وسيط التخزين</text>
  <text x="207" y="347" class="cell">HashMap في الذاكرة</text>
  <text x="425" y="347" class="cell">عنقود بعيد / سحابة مُدارة</text>
  <text x="643" y="347" class="cell">ملف SQLite</text>
  <text x="861" y="347" class="cell">بلا أي تخزين</text>

  <!-- الصف 2: النص الكامل -->
  <rect x="60" y="358" width="1007" height="30" rx="4" fill="#f8fafc"/>
  <text x="74" y="377" class="rowlb">النص الكامل</text>
  <text x="207" y="377" class="cell">مطابقة سلاسل بعد التسلسل</text>
  <text x="425" y="377" class="cell">صيغة الخلفية الأصلية</text>
  <text x="643" y="377" class="cell">تصفية LIKE أولية + تدقيق في الذاكرة</text>
  <text x="861" y="377" class="cell">تعيد نتائج فارغة دائمًا</text>

  <!-- الصف 3: التصفية والفرز -->
  <rect x="60" y="388" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="407" class="rowlb">تصفية / فرز</text>
  <text x="207" y="407" class="cell">في الذاكرة matches + sort_hits</text>
  <text x="425" y="407" class="cell">تمرير term / terms / sort</text>
  <text x="643" y="407" class="cell">total = hits.len()</text>
  <text x="861" y="407" class="cell">لا شيء</text>

  <!-- الصف 4: flush -->
  <rect x="60" y="418" width="1007" height="30" rx="4" fill="#f8fafc"/>
  <text x="74" y="437" class="rowlb">flush</text>
  <text x="207" y="437" class="cell">no-op (الكتابة ظاهرة فورًا)</text>
  <text x="425" y="437" class="cell">ES: _refresh / others: no-op</text>
  <text x="643" y="437" class="cell">no-op</text>
  <text x="861" y="437" class="cell">no-op</text>

  <!-- الصف 5: الترقيم الافتراضي -->
  <rect x="60" y="448" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="467" class="rowlb">ترقيم افتراضي</text>
  <text x="207" y="467" class="cell">الكل، مرتّبة حسب id</text>
  <text x="425" y="467" class="cell">size 10، حسب _score</text>
  <text x="643" y="467" class="cell">hits هي المرجع</text>
  <text x="861" y="467" class="cell">فارغ</text>

  <!-- الصف 6: دلالة delete -->
  <rect x="60" y="478" width="1007" height="30" rx="4" fill="#f8fafc"/>
  <text x="74" y="497" class="rowlb">دلالة delete</text>
  <text x="207" y="497" class="cell">يحذف عبر كل الفهارس</text>
  <text x="425" y="497" class="cell">فهرس default فقط (استخدم delete_in)</text>
  <text x="643" y="497" class="cell">حسب id، عبر كل الفهارس</text>
  <text x="861" y="497" class="cell">no-op</text>

  <!-- الصف 7: الحذف الناعم -->
  <rect x="60" y="508" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="527" class="rowlb">soft_delete</text>
  <text x="207" y="527" class="cell">نعم (يضع علامة)</text>
  <text x="425" y="527" class="cell">نعم (يضع علامة)</text>
  <text x="643" y="527" class="cell">نعم (تصفية ثلاثية)</text>
  <text x="861" y="527" class="cell">لا</text>

  <!-- ==================== مسار الأخطاء ==================== -->
  <rect x="60" y="562" width="1007" height="58" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="74" y="584" class="lbl">مسار الأخطاء — كلها تتقارب في crate::Result&lt;T&gt;</text>
  <text x="74" y="606" class="cell mono">InvalidIndexName · InvalidResult · Unsupported · Json · Http · Sqlx · Backend · XunSearch · XunSearchIo</text>
</svg>
