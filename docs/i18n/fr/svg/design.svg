<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 13px; fill: #64748b; }
      .card  { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 10; }
      .num   { font-size: 20px; font-weight: 700; fill: #2563eb; }
      .name  { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .desc  { font-size: 12px; fill: #475569; }
      .code  { font-size: 11px; fill: #334155; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .rule  { fill: #dbeafe; }
    </style>
  </defs>

  <text x="550" y="42" text-anchor="middle" class="title">Philosophie de conception</text>
  <text x="550" y="66" text-anchor="middle" class="sub">Cinq principes de conception — chacun correspond à une décision concrète dans le code</text>

  <!-- 1 -->
  <rect x="40" y="90" width="1020" height="92" class="card"/>
  <rect x="60" y="106" width="40" height="40" rx="20" class="rule"/>
  <text x="80" y="132" text-anchor="middle" class="num">1</text>
  <text x="118" y="122" class="name">API chaînée façon Scout</text>
  <text x="118" y="142" class="desc">Reprend le modèle mental de Laravel Scout : construire la requête, puis l'exécuter une fois. Séparer requête et exécution facilite la réutilisation et les tests.</text>
  <text x="118" y="162" class="code">let b = SearchBuilder::new(q).within(i).where_field(f, v).order_by(k, true).take(10);</text>

  <!-- 2 -->
  <rect x="40" y="194" width="1020" height="92" class="card"/>
  <rect x="60" y="210" width="40" height="40" rx="20" class="rule"/>
  <text x="80" y="236" text-anchor="middle" class="num">2</text>
  <text x="118" y="226" class="name">Abstraction des pilotes — le trait Engine est la seule couture</text>
  <text x="118" y="246" class="desc">8 méthodes requises + 5 par défaut (13 au total), asynchrones via EngineFuture. Huit backends, un contrat — changer de backend = changer la config.</text>
  <text x="118" y="266" class="code">EngineManager::new(ScoutConfig::meilisearch(host, key)).engine()?;  // ou collection() / database() / ..</text>

  <!-- 3 -->
  <rect x="40" y="298" width="1020" height="92" class="card"/>
  <rect x="60" y="314" width="40" height="40" rx="20" class="rule"/>
  <text x="80" y="340" text-anchor="middle" class="num">3</text>
  <text x="118" y="330" class="name">Contrat de données d'abord — serde JSON</text>
  <text x="118" y="350" class="desc">Écritures, requêtes et résultats sont des données JSON structurées, indépendantes du pilote. Searchable fait le pont entre modèles métier et documents.</text>
  <text x="118" y="370" class="code">SearchDocument { id, index?, fields(flatten) } ⇄ SearchBuilder ⇄ SearchResult { hits, total, facets? }</text>

  <!-- 4 -->
  <rect x="40" y="402" width="1020" height="92" class="card"/>
  <rect x="60" y="418" width="40" height="40" rx="20" class="rule"/>
  <text x="80" y="444" text-anchor="middle" class="num">4</text>
  <text x="118" y="434" class="name">Simplicité d'abord — zéro dépendance par défaut</text>
  <text x="118" y="454" class="desc">Pilote mémoire par défaut, le cœur ne dépend que de serde / thiserror. Chaque backend est derrière sa feature — l'inutilisé ne se compile pas.</text>
  <text x="118" y="474" class="code">[features] default = [] · elasticsearch = ["dep:reqwest"] · database = ["dep:sqlx"] · xunsearch = ["dep:tokio"]</text>

  <!-- 5 -->
  <rect x="40" y="506" width="1020" height="92" class="card"/>
  <rect x="60" y="522" width="40" height="40" rx="20" class="rule"/>
  <text x="80" y="548" text-anchor="middle" class="num">5</text>
  <text x="118" y="538" class="name">Limite de sécurité — validation d'entrée + échappement de sortie</text>
  <text x="118" y="558" class="desc">Les noms d'index passent validate_index_name (refuse espaces, slashs, points initiaux) ; les pilotes HTTP encodent ensuite index et id en pourcent RFC 3986.</text>
  <text x="118" y="578" class="code">validate_index_name(index)?;  →  percent_encode(index) + percent_encode(id)</text>
</svg>
