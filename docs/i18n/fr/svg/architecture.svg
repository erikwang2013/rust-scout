<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 840" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="archTitle">
  <title id="archTitle">rust-scout architecture : application / contrat de données / cœur / pilotes / stockage</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 13px; fill: #64748b; }
      .layer { fill: #e2e8f0; opacity: 0.35; }
      .box   { fill: #ffffff; stroke: #2563eb; stroke-width: 1.5; }
      .box-core { stroke: #2563eb; }
      .box-mem  { stroke: #10b981; }
      .box-http { stroke: #2563eb; }
      .box-db   { stroke: #d97706; }
      .box-tcp  { stroke: #8b5cf6; }
      .box-null { stroke: #94a3b8; }
      .box-data { stroke: #f59e0b; }
      .name  { font-size: 14px; font-weight: 600; fill: #0f172a; }
      .name-s{ font-size: 12.5px; font-weight: 600; fill: #0f172a; }
      .desc  { font-size: 11px; fill: #475569; }
      .desc-s{ font-size: 10.5px; fill: #64748b; }
      .lbl   { font-size: 12px; fill: #64748b; font-weight: 600; }
      .ctag  { font-size: 10.5px; font-weight: 700; }
      .mem   { fill: #10b981; }
      .http  { fill: #2563eb; }
      .db    { fill: #d97706; }
      .tcp   { fill: #8b5cf6; }
      .null  { fill: #64748b; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <text x="550" y="42" text-anchor="middle" class="title">Architecture rust-scout</text>
  <text x="550" y="66" text-anchor="middle" class="sub">Abstraction de recherche plein texte façon Scout — un trait Engine, huit pilotes, le code métier ignore le backend</text>

  <!-- ==================== couche applicative ==================== -->
  <rect x="40" y="95" width="1020" height="70" rx="10" class="layer"/>
  <text x="60" y="118" class="lbl">Couche applicative</text>
  <rect x="60" y="126" width="470" height="26" rx="6" class="box"/>
  <text x="295" y="143" text-anchor="middle" class="name">Code appelant (async / await)</text>
  <rect x="560" y="126" width="480" height="26" rx="6" class="box"/>
  <text x="800" y="143" text-anchor="middle" class="name">Les modèles métier implémentent Searchable / SearchableStore</text>

  <!-- ==================== couche contrat de données ==================== -->
  <rect x="40" y="185" width="1020" height="70" rx="10" class="layer"/>
  <text x="60" y="208" class="lbl">Contrat de données (serde JSON) — indépendant du pilote</text>
  <rect x="60" y="216" width="300" height="26" rx="6" class="box"/>
  <text x="210" y="233" text-anchor="middle" class="name">SearchBuilder (requête chaînée)</text>
  <rect x="390" y="216" width="300" height="26" rx="6" class="box"/>
  <text x="540" y="233" text-anchor="middle" class="name">SearchDocument (écriture)</text>
  <rect x="720" y="216" width="300" height="26" rx="6" class="box"/>
  <text x="870" y="233" text-anchor="middle" class="name">SearchResult / SearchHit (lecture)</text>

  <!-- ==================== couche cœur ==================== -->
  <rect x="40" y="275" width="1020" height="150" rx="10" class="layer"/>
  <text x="60" y="298" class="lbl">Couche cœur</text>
  <rect x="60" y="306" width="300" height="104" rx="8" class="box box-core"/>
  <text x="210" y="330" text-anchor="middle" class="name">EngineManager (façade)</text>
  <text x="210" y="350" text-anchor="middle" class="desc">Dispatch + cache selon ScoutConfig.driver</text>
  <text x="210" y="368" text-anchor="middle" class="desc">Démarrage à froid : construit une fois (Mutex)</text>
  <text x="210" y="390" text-anchor="middle" class="desc mono">engine() -&gt; Arc&lt;dyn Engine&gt;</text>

  <rect x="390" y="306" width="650" height="104" rx="8" class="box box-core"/>
  <text x="715" y="330" text-anchor="middle" class="name">trait Engine — la seule couture</text>
  <text x="715" y="350" text-anchor="middle" class="desc">8 requis : update · delete · search · paginate · map_ids · flush · create_index · delete_index</text>
  <text x="715" y="368" text-anchor="middle" class="desc">5 par défaut : delete_in · update_bulk · delete_bulk · soft_delete · reindex</text>
  <text x="715" y="390" text-anchor="middle" class="desc mono">async via EngineFuture&lt;T&gt;, Send + Sync</text>

  <line x1="210" y1="306" x2="210" y2="275" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="358" x2="390" y2="358" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="715" y1="410" x2="715" y2="440" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ==================== couche pilotes (quatre groupes par transport) ==================== -->
  <rect x="40" y="440" width="1020" height="210" rx="10" class="layer"/>
  <text x="60" y="462" class="lbl">Couche pilotes — groupés par transport, derrière feature</text>

  <!-- groupe A : en processus -->
  <text x="60" y="484" class="ctag mem">A · En processus (défaut, zéro dép.)</text>
  <rect x="60" y="492" width="230" height="150" rx="8" class="box box-mem"/>
  <text x="76" y="516" class="name">CollectionEngine</text>
  <text x="76" y="538" class="desc">HashMap&lt;index, docs&gt;</text>
  <text x="76" y="556" class="desc">correspondance de sous-chaînes</text>
  <text x="76" y="574" class="desc">matches() / sort_hits() en mémoire</text>
  <text x="76" y="592" class="desc">flush no-op ; écritures visibles</text>
  <text x="76" y="616" class="desc-s mono">ScoutConfig::collection()</text>
  <text x="76" y="634" class="desc-s">feature : intégrée</text>

  <!-- groupe B : HTTP REST -->
  <text x="310" y="484" class="ctag http">B · HTTP REST (reqwest)</text>
  <rect x="310" y="492" width="230" height="33" rx="7" class="box box-http"/>
  <text x="324" y="513" class="name-s">ElasticsearchEngine</text>
  <text x="528" y="513" text-anchor="end" class="desc-s">ES / OS</text>
  <rect x="310" y="531" width="230" height="33" rx="7" class="box box-http"/>
  <text x="324" y="552" class="name-s">MeilisearchEngine</text>
  <text x="528" y="552" text-anchor="end" class="desc-s">:7700</text>
  <rect x="310" y="570" width="230" height="33" rx="7" class="box box-http"/>
  <text x="324" y="591" class="name-s">TypesenseEngine</text>
  <text x="528" y="591" text-anchor="end" class="desc-s">:8108</text>
  <rect x="310" y="609" width="230" height="33" rx="7" class="box box-http"/>
  <text x="324" y="630" class="name-s">AlgoliaEngine</text>
  <text x="528" y="630" text-anchor="end" class="desc-s">cloud hébergé</text>

  <!-- groupe C : fichier local -->
  <text x="560" y="484" class="ctag db">C · Fichier local</text>
  <rect x="560" y="492" width="230" height="150" rx="8" class="box box-db"/>
  <text x="576" y="516" class="name">DatabaseEngine</text>
  <text x="576" y="538" class="desc">Table SQLite scout_documents</text>
  <text x="576" y="556" class="desc">préfiltre LIKE + affinage mémoire</text>
  <text x="576" y="574" class="desc">total = comptage SQL</text>
  <text x="576" y="592" class="desc">pagination selon les hits</text>
  <text x="576" y="616" class="desc-s mono">ScoutConfig::database(..)</text>
  <text x="576" y="634" class="desc-s">feature : database</text>

  <!-- groupe D : TCP natif / implémentation vide -->
  <text x="810" y="484" class="ctag tcp">D · TCP natif / vide</text>
  <rect x="810" y="492" width="230" height="72" rx="8" class="box box-tcp"/>
  <text x="826" y="516" class="name">XunSearchEngine</text>
  <text x="826" y="536" class="desc">protocole binaire xunsearchd</text>
  <text x="826" y="553" class="desc">une connexion courte par op.</text>
  <rect x="810" y="572" width="230" height="70" rx="8" class="box box-null"/>
  <text x="826" y="596" class="name">NullEngine</text>
  <text x="826" y="616" class="desc">ignore les écritures, toujours vide</text>
  <text x="826" y="633" class="desc">tests / recherche désactivée</text>

  <!-- ==================== couche stockage ==================== -->
  <rect x="40" y="672" width="1020" height="140" rx="10" class="layer"/>
  <text x="60" y="694" class="lbl">Stockage / Transport</text>

  <rect x="60" y="706" width="230" height="88" rx="8" class="box box-data"/>
  <text x="175" y="732" text-anchor="middle" class="name">En processus</text>
  <text x="175" y="754" text-anchor="middle" class="desc">HashMap&lt;index, Vec&lt;doc&gt;&gt;</text>
  <text x="175" y="772" text-anchor="middle" class="desc">protégé par Mutex, perdu à la sortie</text>

  <rect x="310" y="706" width="230" height="88" rx="8" class="box box-data"/>
  <text x="425" y="732" text-anchor="middle" class="name">Cluster de recherche</text>
  <text x="425" y="754" text-anchor="middle" class="desc">ES / OpenSearch · Meilisearch</text>
  <text x="425" y="772" text-anchor="middle" class="desc">Typesense · cloud Algolia</text>

  <rect x="560" y="706" width="230" height="88" rx="8" class="box box-data"/>
  <text x="675" y="732" text-anchor="middle" class="name">Fichier SQLite</text>
  <text x="675" y="754" text-anchor="middle" class="desc">fichier .db local, près de la base</text>
  <text x="675" y="772" text-anchor="middle" class="desc">sqlx + runtime-tokio</text>

  <rect x="810" y="706" width="230" height="88" rx="8" class="box box-data"/>
  <text x="925" y="732" text-anchor="middle" class="name">processus xunsearchd</text>
  <text x="925" y="754" text-anchor="middle" class="desc">8383 index / 8384 recherche</text>
  <text x="925" y="772" text-anchor="middle" class="desc">NullEngine : aucun stockage</text>

  <!-- connecteurs groupe -> stockage -->
  <line x1="175" y1="642" x2="175" y2="706" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="425" y1="642" x2="425" y2="706" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="675" y1="642" x2="675" y2="706" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="925" y1="642" x2="925" y2="706" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- couche applicative -> couche contrat -->
  <line x1="295" y1="152" x2="295" y2="185" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
