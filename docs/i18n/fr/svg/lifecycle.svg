<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="lifeTitle">
  <title id="lifeTitle">Cycle de vie des index et documents : création / écriture / flush / recherche / suppression / reconstruction / destruction</title>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 13px; fill: #64748b; }
      .node  { fill: #ffffff; stroke: #2563eb; stroke-width: 1.6; }
      .node-alt { stroke: #f59e0b; }
      .step  { font-size: 11.5px; font-weight: 600; fill: #2563eb; }
      .name  { font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .desc  { font-size: 10px; fill: #475569; }
      .hdr   { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
      .cell  { font-size: 10.5px; fill: #334155; }
      .rowlb { font-size: 11px; font-weight: 600; fill: #0f172a; }
      .lbl   { font-size: 12px; fill: #64748b; font-weight: 600; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <text x="590" y="42" text-anchor="middle" class="title">Cycle de vie des index et documents</text>
  <text x="590" y="66" text-anchor="middle" class="sub">Sept étapes couvrent le parcours d'un index, de la création à la destruction — indépendant du pilote, sémantique unifiée</text>

  <!-- ==================== déroulé du cycle de vie ==================== -->
  <rect x="38" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="110" y="124" text-anchor="middle" class="step">① Création</text>
  <text x="110" y="148" text-anchor="middle" class="name">create_index</text>
  <text x="110" y="172" text-anchor="middle" class="desc">Pré-créer l'index et passer</text>
  <text x="110" y="188" text-anchor="middle" class="desc">les settings (mappings ES)</text>
  <text x="110" y="204" text-anchor="middle" class="desc">valider + échapper le nom</text>
  <line x1="183" y1="166" x2="198" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="198" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="270" y="124" text-anchor="middle" class="step">② Écriture</text>
  <text x="270" y="148" text-anchor="middle" class="name">update</text>
  <text x="270" y="172" text-anchor="middle" class="desc">routé par doc.index</text>
  <text x="270" y="188" text-anchor="middle" class="desc">(défaut "default")</text>
  <text x="270" y="204" text-anchor="middle" class="desc">même id écrase ;</text>
  <text x="270" y="220" text-anchor="middle" class="desc mono">update_bulk</text>
  <line x1="343" y1="166" x2="358" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="358" y="100" width="145" height="132" rx="10" class="node node-alt"/>
  <text x="430" y="124" text-anchor="middle" class="step">③ Flush</text>
  <text x="430" y="148" text-anchor="middle" class="name">flush</text>
  <text x="430" y="172" text-anchor="middle" class="desc">no-op: collection/SQLite</text>
  <text x="430" y="188" text-anchor="middle" class="desc">no-op: Meili/TS/Algolia</text>
  <text x="430" y="204" text-anchor="middle" class="desc">_refresh: ES</text>
  <text x="430" y="220" text-anchor="middle" class="desc">CMD_INDEX_COMMIT: XunSearch</text>
  <line x1="503" y1="166" x2="518" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="518" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="590" y="124" text-anchor="middle" class="step">④ Recherche</text>
  <text x="590" y="148" text-anchor="middle" class="name">search / paginate</text>
  <text x="590" y="172" text-anchor="middle" class="desc">requête + filtres + tri</text>
  <text x="590" y="188" text-anchor="middle" class="desc">+ pagination, renvoie</text>
  <text x="590" y="204" text-anchor="middle" class="desc">SearchResult</text>
  <line x1="663" y1="166" x2="678" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="678" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="750" y="124" text-anchor="middle" class="step">⑤ Suppr. docs</text>
  <text x="750" y="148" text-anchor="middle" class="name">delete · delete_in</text>
  <text x="750" y="172" text-anchor="middle" class="desc">retrait par id ; delete_in</text>
  <text x="750" y="188" text-anchor="middle" class="desc">limité à un index.</text>
  <text x="750" y="204" text-anchor="middle" class="desc mono">soft_delete_in</text>
  <line x1="823" y1="166" x2="838" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="838" y="100" width="145" height="132" rx="10" class="node node-alt"/>
  <text x="910" y="124" text-anchor="middle" class="step">⑥ Réindexation</text>
  <text x="910" y="148" text-anchor="middle" class="name">reindex</text>
  <text x="910" y="172" text-anchor="middle" class="desc">copie de from vers to.</text>
  <text x="910" y="188" text-anchor="middle" class="desc">mémoire : remplace la cible</text>
  <text x="910" y="204" text-anchor="middle" class="desc">ES : fusion via _reindex</text>
  <line x1="983" y1="166" x2="998" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="998" y="100" width="145" height="132" rx="10" class="node node-alt"/>
  <text x="1070" y="124" text-anchor="middle" class="step">⑦ Destruction</text>
  <text x="1070" y="148" text-anchor="middle" class="name">delete_index</text>
  <text x="1070" y="172" text-anchor="middle" class="desc">supprime l'index et</text>
  <text x="1070" y="188" text-anchor="middle" class="desc">toutes ses données</text>

  <!-- ==================== tableau comparatif des familles de pilotes ==================== -->
  <text x="590" y="278" text-anchor="middle" class="lbl">Comment les quatre familles de pilotes diffèrent selon l'étape</text>

  <rect x="60" y="292" width="130" height="32" rx="6" fill="#f1f5f9"/>
  <rect x="195" y="292" width="218" height="32" rx="6" fill="#10b981"/>
  <rect x="413" y="292" width="218" height="32" rx="6" fill="#2563eb"/>
  <rect x="631" y="292" width="218" height="32" rx="6" fill="#d97706"/>
  <rect x="849" y="292" width="218" height="32" rx="6" fill="#94a3b8"/>
  <text x="74" y="313" class="lbl">Étape / Comport.</text>
  <text x="304" y="313" text-anchor="middle" class="hdr">CollectionEngine</text>
  <text x="522" y="313" text-anchor="middle" class="hdr">Backends HTTP (ES, Meili, …)</text>
  <text x="740" y="313" text-anchor="middle" class="hdr">DatabaseEngine</text>
  <text x="958" y="313" text-anchor="middle" class="hdr">NullEngine</text>

  <!-- ligne 1 stockage -->
  <rect x="60" y="328" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="347" class="rowlb">Stockage</text>
  <text x="207" y="347" class="cell">HashMap en processus</text>
  <text x="425" y="347" class="cell">cluster distant / cloud hébergé</text>
  <text x="643" y="347" class="cell">fichier SQLite</text>
  <text x="861" y="347" class="cell">aucun stockage</text>

  <!-- ligne 2 plein texte -->
  <rect x="60" y="358" width="1007" height="30" rx="4" fill="#f8fafc"/>
  <text x="74" y="377" class="rowlb">Plein texte</text>
  <text x="207" y="377" class="cell">sous-chaîne sérialisée</text>
  <text x="425" y="377" class="cell">syntaxe native du backend</text>
  <text x="643" y="377" class="cell">préfiltre LIKE + affinage</text>
  <text x="861" y="377" class="cell">toujours vide</text>

  <!-- ligne 3 filtre / tri -->
  <rect x="60" y="388" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="407" class="rowlb">Filtre / tri</text>
  <text x="207" y="407" class="cell">matches + sort_hits en mémoire</text>
  <text x="425" y="407" class="cell">pousse term / terms / sort</text>
  <text x="643" y="407" class="cell">total = hits.len()</text>
  <text x="861" y="407" class="cell">aucun</text>

  <!-- ligne 4 flush -->
  <rect x="60" y="418" width="1007" height="30" rx="4" fill="#f8fafc"/>
  <text x="74" y="437" class="rowlb">flush</text>
  <text x="207" y="437" class="cell">no-op (écrits visibles)</text>
  <text x="425" y="437" class="cell">ES: _refresh / others: no-op</text>
  <text x="643" y="437" class="cell">no-op</text>
  <text x="861" y="437" class="cell">no-op</text>

  <!-- ligne 5 pagination par défaut -->
  <rect x="60" y="448" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="467" class="rowlb">Pag. défaut</text>
  <text x="207" y="467" class="cell">tous, triés par id</text>
  <text x="425" y="467" class="cell">size 10, triés par _score</text>
  <text x="643" y="467" class="cell">tous, triés par id</text>
  <text x="861" y="467" class="cell">aucun</text>

  <!-- ligne 6 sémantique de delete -->
  <rect x="60" y="478" width="1007" height="30" rx="4" fill="#f8fafc"/>
  <text x="74" y="497" class="rowlb">Sém. delete</text>
  <text x="207" y="497" class="cell">supprime dans tous les index</text>
  <text x="425" y="497" class="cell">index default seul (delete_in)</text>
  <text x="643" y="497" class="cell">par id, tous index</text>
  <text x="861" y="497" class="cell">no-op</text>

  <!-- ligne 7 suppression logique -->
  <rect x="60" y="508" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="527" class="rowlb">soft_delete</text>
  <text x="207" y="527" class="cell">oui (pose un marqueur)</text>
  <text x="425" y="527" class="cell">oui (soft_delete_in)</text>
  <text x="643" y="527" class="cell">oui (filtre 3 états)</text>
  <text x="861" y="527" class="cell">non</text>

  <!-- ==================== chemin d'erreur ==================== -->
  <text x="60" y="554" class="desc">XunSearch ne fait pas partie des quatre familles : son flush est CMD_INDEX_COMMIT (commit sur disque), pas un no-op.</text>
  <rect x="60" y="562" width="1007" height="58" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="74" y="584" class="lbl">Chemin d'erreur — tout converge vers crate::Result&lt;T&gt;</text>
  <text x="74" y="606" class="cell mono">InvalidIndexName · InvalidResult · Unsupported · Json · Http · Sqlx · Backend · XunSearch · XunSearchIo</text>
</svg>
