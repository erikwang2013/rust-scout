<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="lifeTitle">
  <title id="lifeTitle">Index- und Dokument-Lebenszyklus: Anlegen / Schreiben / Flush / Suche / Löschen / Neuaufbau / Zerstören</title>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 13px; fill: #64748b; }
      .node  { fill: #ffffff; stroke: #2563eb; stroke-width: 1.6; }
      .node-alt { stroke: #f59e0b; }
      .step  { font-size: 11.5px; font-weight: 600; fill: #2563eb; }
      .name  { font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .desc  { font-size: 10px; fill: #475569; }
      .hdr   { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
      .cell  { font-size: 10.5px; fill: #334155; }
      .rowlb { font-size: 11px; font-weight: 600; fill: #0f172a; }
      .lbl   { font-size: 12px; fill: #64748b; font-weight: 600; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <text x="590" y="42" text-anchor="middle" class="title">Index- und Dokument-Lebenszyklus</text>
  <text x="590" y="66" text-anchor="middle" class="sub">Sieben Phasen von der Anlage bis zur Zerstörung eines Index — treiberunabhängig, einheitliche Semantik</text>

  <!-- ==================== Lebenszyklus-Ablauf ==================== -->
  <rect x="38" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="110" y="124" text-anchor="middle" class="step">① Anlegen</text>
  <text x="110" y="148" text-anchor="middle" class="name">create_index</text>
  <text x="110" y="172" text-anchor="middle" class="desc">Index vorab anlegen,</text>
  <text x="110" y="188" text-anchor="middle" class="desc">Settings (ES-Mappings)</text>
  <text x="110" y="204" text-anchor="middle" class="desc">Name prüfen + escapen</text>
  <line x1="183" y1="166" x2="198" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="198" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="270" y="124" text-anchor="middle" class="step">② Schreiben</text>
  <text x="270" y="148" text-anchor="middle" class="name">update</text>
  <text x="270" y="172" text-anchor="middle" class="desc">Routing via doc.index</text>
  <text x="270" y="188" text-anchor="middle" class="desc">(Default "default")</text>
  <text x="270" y="204" text-anchor="middle" class="desc">gleiche id überschreibt;</text>
  <text x="270" y="220" text-anchor="middle" class="desc mono">Bulk: update_bulk</text>
  <line x1="343" y1="166" x2="358" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="358" y="100" width="145" height="132" rx="10" class="node node-alt"/>
  <text x="430" y="124" text-anchor="middle" class="step">③ Flush</text>
  <text x="430" y="148" text-anchor="middle" class="name">flush</text>
  <text x="430" y="172" text-anchor="middle" class="desc">no-op：collection/SQLite</text>
  <text x="430" y="188" text-anchor="middle" class="desc">no-op：Meili/TS/Algolia</text>
  <text x="430" y="204" text-anchor="middle" class="desc">_refresh：ES</text>
  <line x1="503" y1="166" x2="518" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="518" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="590" y="124" text-anchor="middle" class="step">④ Suche</text>
  <text x="590" y="148" text-anchor="middle" class="name">search / paginate</text>
  <text x="590" y="172" text-anchor="middle" class="desc">Suche + Filter + Sort</text>
  <text x="590" y="188" text-anchor="middle" class="desc">+ Paging, liefert</text>
  <text x="590" y="204" text-anchor="middle" class="desc">SearchResult</text>
  <line x1="663" y1="166" x2="678" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="678" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="750" y="124" text-anchor="middle" class="step">⑤ Löschen</text>
  <text x="750" y="148" text-anchor="middle" class="name">delete / delete_in</text>
  <text x="750" y="172" text-anchor="middle" class="desc">per id entfernen; delete_in</text>
  <text x="750" y="188" text-anchor="middle" class="desc">auf einen Index begrenzt.</text>
  <text x="750" y="204" text-anchor="middle" class="desc mono">soft_delete_in</text>
  <line x1="823" y1="166" x2="838" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="838" y="100" width="145" height="132" rx="10" class="node node-alt"/>
  <text x="910" y="124" text-anchor="middle" class="step">⑥ Neuaufbau</text>
  <text x="910" y="148" text-anchor="middle" class="name">reindex</text>
  <text x="910" y="172" text-anchor="middle" class="desc">kopiert Index von → nach.</text>
  <text x="910" y="188" text-anchor="middle" class="desc">RAM: Ziel tauschen</text>
  <text x="910" y="204" text-anchor="middle" class="desc">ES: Merge via _reindex</text>
  <line x1="983" y1="166" x2="998" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="998" y="100" width="145" height="132" rx="10" class="node node-alt"/>
  <text x="1070" y="124" text-anchor="middle" class="step">⑦ Zerstören</text>
  <text x="1070" y="148" text-anchor="middle" class="name">delete_index</text>
  <text x="1070" y="172" text-anchor="middle" class="desc">löscht den Index und</text>
  <text x="1070" y="188" text-anchor="middle" class="desc">alle seine Daten</text>

  <!-- ==================== Vergleich der Treiberfamilien ==================== -->
  <text x="590" y="278" text-anchor="middle" class="lbl">So unterscheiden sich die vier Treiberfamilien je Phase</text>

  <rect x="60" y="292" width="130" height="32" rx="6" fill="#f1f5f9"/>
  <rect x="195" y="292" width="218" height="32" rx="6" fill="#10b981"/>
  <rect x="413" y="292" width="218" height="32" rx="6" fill="#2563eb"/>
  <rect x="631" y="292" width="218" height="32" rx="6" fill="#d97706"/>
  <rect x="849" y="292" width="218" height="32" rx="6" fill="#94a3b8"/>
  <text x="74" y="313" class="lbl">Phase / Verhalten</text>
  <text x="304" y="313" text-anchor="middle" class="hdr">CollectionEngine</text>
  <text x="522" y="313" text-anchor="middle" class="hdr">HTTP-Backends (ES, Meili, …)</text>
  <text x="740" y="313" text-anchor="middle" class="hdr">DatabaseEngine</text>
  <text x="958" y="313" text-anchor="middle" class="hdr">NullEngine</text>

  <!-- Zeile 1 Speicher -->
  <rect x="60" y="328" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="347" class="rowlb">Speicher</text>
  <text x="207" y="347" class="cell">HashMap im Prozess</text>
  <text x="425" y="347" class="cell">Remote-Cluster / Managed Cloud</text>
  <text x="643" y="347" class="cell">SQLite-Datei</text>
  <text x="861" y="347" class="cell">gar kein Speicher</text>

  <!-- Zeile 2 Volltext -->
  <rect x="60" y="358" width="1007" height="30" rx="4" fill="#f8fafc"/>
  <text x="74" y="377" class="rowlb">Volltext</text>
  <text x="207" y="377" class="cell">serialisierter Substring</text>
  <text x="425" y="377" class="cell">Backend-eigene Syntax</text>
  <text x="643" y="377" class="cell">LIKE-Vorfilter + RAM-Feinsuche</text>
  <text x="861" y="377" class="cell">liefert immer leer</text>

  <!-- Zeile 3 Filter / Sort -->
  <rect x="60" y="388" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="407" class="rowlb">Filter / Sort</text>
  <text x="207" y="407" class="cell">im RAM: matches + sort_hits</text>
  <text x="425" y="407" class="cell">Pushdown: term / terms / sort</text>
  <text x="643" y="407" class="cell">total = hits.len()</text>
  <text x="861" y="407" class="cell">keins</text>

  <!-- Zeile 4 flush -->
  <rect x="60" y="418" width="1007" height="30" rx="4" fill="#f8fafc"/>
  <text x="74" y="437" class="rowlb">flush</text>
  <text x="207" y="437" class="cell">No-op (Writes sofort sichtbar)</text>
  <text x="425" y="437" class="cell">ES: _refresh / others: no-op</text>
  <text x="643" y="437" class="cell">no-op</text>
  <text x="861" y="437" class="cell">no-op</text>

  <!-- Zeile 5 Paging-Default -->
  <rect x="60" y="448" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="467" class="rowlb">Paging-Default</text>
  <text x="207" y="467" class="cell">alle Zeilen, nach id</text>
  <text x="425" y="467" class="cell">size 10, sortiert nach _score</text>
  <text x="643" y="467" class="cell">hits entscheiden</text>
  <text x="861" y="467" class="cell">keins</text>

  <!-- Zeile 6 delete-Semantik -->
  <rect x="60" y="478" width="1007" height="30" rx="4" fill="#f8fafc"/>
  <text x="74" y="497" class="rowlb">delete-Semantik</text>
  <text x="207" y="497" class="cell">löscht über alle Indizes</text>
  <text x="425" y="497" class="cell">nur default-Index (delete_in)</text>
  <text x="643" y="497" class="cell">per id, über Indizes</text>
  <text x="861" y="497" class="cell">no-op</text>

  <!-- Zeile 7 soft_delete -->
  <rect x="60" y="508" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="527" class="rowlb">soft_delete</text>
  <text x="207" y="527" class="cell">ja (setzt Flag)</text>
  <text x="425" y="527" class="cell">ja (setzt Flag)</text>
  <text x="643" y="527" class="cell">ja (3-Zustands-Filter)</text>
  <text x="861" y="527" class="cell">nein</text>

  <!-- ==================== Fehlerpfad ==================== -->
  <rect x="60" y="562" width="1007" height="58" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="74" y="584" class="lbl">Fehlerpfad — alle laufen in crate::Result&lt;T&gt; zusammen</text>
  <text x="74" y="606" class="cell mono">InvalidIndexName · InvalidResult · Unsupported · Json · Http · Sqlx · Backend · XunSearch · XunSearchIo</text>
</svg>
