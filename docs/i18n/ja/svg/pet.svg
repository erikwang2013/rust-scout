<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="petTitle petDesc">
  <title id="petTitle">rust-scout プロジェクトのペット：嗅探猟犬 Scout</title>
  <desc id="petDesc">青いスカウトスカーフを巻いた猟犬が、前方の書類の山を鼻で嗅いでいる。書類の上には虫眼鏡が浮かび、ヒットした一行がハイライトされ、後ろには足跡が続く。</desc>

  <defs>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 12.5px; fill: #64748b; }
      .card  { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .line  { fill: #e2e8f0; }
      .line-hi { fill: #f59e0b; }
      .head  { fill: #cbd5e1; }
      /* 猟犬の配色：アンバー系（アーキテクチャ図の data 層の色を再利用）、サイト全体のパレットと同源を保つ */
      .fur   { fill: #f7c873; }
      .fur-m { fill: #eaa94f; }
      .fur-d { fill: #d18b33; }
      .muzzle{ fill: #fde9c9; }
      .ink   { fill: #0f172a; }
      .scarf { fill: #2563eb; }
      .scarf-d { fill: #1d4ed8; }
      .glass { fill: #dbeafe; fill-opacity: 0.45; }
      .rim   { fill: none; stroke: #2563eb; stroke-width: 11; }
      .handle{ stroke: #2563eb; stroke-width: 15; stroke-linecap: round; }
      .paw   { fill: currentColor; }
      .badge { fill: #10b981; }
      /* ストローク族：塗りクラスと組み合わせて使う */
      .s     { stroke: #b06f22; stroke-width: 3; }
      .s2    { stroke: #b06f22; stroke-width: 2.2; }
      .brow  { fill: none; stroke: #d18b33; stroke-width: 4; stroke-linecap: round; }
      .tail  { fill: none; stroke: #eaa94f; stroke-width: 15; stroke-linecap: round; }
      .sniff { fill: none; stroke: #94a3b8; stroke-width: 2.5; stroke-linecap: round; }
      .name  { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .role  { font-size: 11.5px; fill: #64748b; }
    </style>

    <!-- 足跡：ひとつの図形を4回再利用、色は <use> の color で決まる -->
    <g id="pawMark">
      <ellipse cx="0" cy="5" rx="7.5" ry="6" class="paw"/>
      <ellipse cx="-8.5" cy="-5" rx="3.4" ry="4" class="paw"/>
      <ellipse cx="-2.8" cy="-9.5" rx="3.4" ry="4" class="paw"/>
      <ellipse cx="3.4" cy="-9.5" rx="3.4" ry="4" class="paw"/>
      <ellipse cx="9" cy="-5" rx="3.4" ry="4" class="paw"/>
    </g>
  </defs>

  <text x="280" y="40" text-anchor="middle" class="title">rust-scout プロジェクトのペット</text>
  <text x="280" y="63" text-anchor="middle" class="sub">嗅探猟犬 Scout · 書類を嗅ぎ、索引を追う —— クエリのあるところに必ずいる</text>

  <!-- ============ 足跡の小径：画面左下から猟犬の足元まで ============ -->
  <use href="#pawMark" transform="translate(150,388) rotate(-18)" color="#d18b33" opacity="0.75"/>
  <use href="#pawMark" transform="translate(108,404) rotate(-8)"  color="#eaa94f" opacity="0.55"/>
  <use href="#pawMark" transform="translate(64,412)  rotate(6)"   color="#f0c37f" opacity="0.4"/>
  <use href="#pawMark" transform="translate(24,406)  rotate(14)"  color="#f7d9a8" opacity="0.28"/>

  <!-- ============ 猟犬本体（ローカル座標：頭の中心が原点） ============ -->
  <g transform="translate(198,190)">

    <!-- しっぽ（背後；垂れ耳を避けて体の左下を通る。そうしないと耳に完全に隠れる） -->
    <path class="tail" d="M -48,92 C -94,90 -116,70 -106,44"/>

    <!-- 長い垂れ耳（頭の後ろ、左右対称；耳の付け根より外へ広げ、両耳とも見えるようにする） -->
    <path class="fur-d s" d="M -28,-50 C -78,-64 -112,-20 -94,30 C -84,56 -58,58 -46,34 C -38,14 -40,-20 -28,-50 Z"/>
    <path class="fur-d s" d="M  28,-50 C  78,-64  112,-20  94,30 C  84,56  58,58  46,34 C  38,14  40,-20  28,-50 Z"/>

    <!-- 頭頂部のアホ毛（頭より前面、根元は頭に隠れる） -->
    <path class="fur-m" d="M -17,-47 Q -10,-73 0,-50 Q 8,-71 18,-45 Z"/>

    <!-- 胴体 -->
    <ellipse cx="0" cy="92" rx="52" ry="50" class="fur s"/>

    <!-- 四肢 + 足裏 -->
    <rect x="-31" y="116" width="20" height="48" rx="10" class="fur s"/>
    <rect x="11"  y="116" width="20" height="48" rx="10" class="fur s"/>
    <ellipse cx="-21" cy="160" rx="13" ry="7" class="fur-m s2"/>
    <ellipse cx="21"  cy="160" rx="13" ry="7" class="fur-m s2"/>

    <!-- 頭 -->
    <ellipse cx="0" cy="0" rx="58" ry="54" class="fur s"/>

    <!-- 口吻（やや小さめ、右耳を食わないように） -->
    <ellipse cx="32" cy="28" rx="32" ry="25" class="muzzle s2"/>
    <ellipse cx="56" cy="17" rx="13" ry="10.5" class="ink"/>
    <ellipse cx="51" cy="13" rx="3.8" ry="2.5" fill="#ffffff" opacity="0.55"/>
    <path d="M 47,38 Q 57,47 67,37" fill="none" stroke="#b06f22" stroke-width="2.2" stroke-linecap="round"/>

    <!-- 目 + ハイライト -->
    <circle cx="-20" cy="-16" r="12" class="ink"/>
    <circle cx="18"  cy="-20" r="12" class="ink"/>
    <circle cx="-16" cy="-20" r="4.5" fill="#ffffff" opacity="0.92"/>
    <circle cx="22"  cy="-24" r="4.5" fill="#ffffff" opacity="0.92"/>

    <!-- 眉 -->
    <path class="brow" d="M -34,-38 Q -22,-47 -10,-39"/>
    <path class="brow" d="M   4,-42 Q  16,-51  28,-43"/>

    <!-- スカウトスカーフ（頭の後に描き、首元に沿わせる） -->
    <path class="scarf"   d="M -46,44 Q 0,66 46,44 L 46,58 Q 0,80 -46,58 Z"/>
    <path class="scarf-d" d="M -13,66 L 13,66 L 4,106 L -4,106 Z"/>
    <path class="scarf"   d="M -13,62 L 13,62 L 0,82 Z"/>

    <!-- 嗅ぎ取りの波紋：右側の書類を指す -->
    <path class="sniff" opacity="0.75" d="M 78,-10 Q 88,-2 78,8"/>
    <path class="sniff" opacity="0.5"  d="M 88,-16 Q 102,-2 88,14"/>
    <path class="sniff" opacity="0.3"  d="M 98,-22 Q 116,-2 98,20"/>
  </g>

  <!-- ============ 嗅がれている書類の山 ============ -->
  <g transform="rotate(-3 430 312)">
    <rect x="352" y="262" width="155" height="100" rx="10" class="card" stroke="#e2e8f0"/>
  </g>
  <rect x="344" y="270" width="155" height="100" rx="10" class="card"/>
  <rect x="362" y="290" width="88"  height="9" rx="4" class="head"/>
  <rect x="362" y="308" width="120" height="6" rx="3" class="line"/>
  <rect x="362" y="322" width="120" height="6" rx="3" class="line"/>
  <rect x="362" y="336" width="76"  height="6" rx="3" class="line-hi"/>
  <rect x="362" y="350" width="104" height="6" rx="3" class="line"/>

  <!-- ヒットバッジ -->
  <circle cx="499" cy="268" r="16" class="badge"/>
  <path d="M 491,268 L 497,275 L 508,261" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ============ 虫眼鏡：書類の上に浮かぶ ============ -->
  <circle cx="420" cy="250" r="46" class="glass"/>
  <path class="handle" d="M 452,282 L 488,318"/>
  <circle cx="420" cy="250" r="46" class="rim"/>

  <!-- ============ 名札 ============ -->
  <rect x="146" y="404" width="196" height="42" rx="21" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="172" cy="425" r="11" class="fur"/>
  <circle cx="172" cy="425" r="11" fill="none" stroke="#b06f22" stroke-width="2"/>
  <ellipse cx="172" cy="429" rx="4" ry="3" class="ink"/>
  <text x="192" y="421" class="name">Scout</text>
  <text x="192" y="437" class="role">嗅探猟犬 · Search Hound</text>
</svg>
