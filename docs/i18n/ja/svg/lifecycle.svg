<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 13px; fill: #64748b; }
      .node  { fill: #ffffff; stroke: #2563eb; stroke-width: 1.6; rx: 10; }
      .node-alt { stroke: #f59e0b; }
      .step  { font-size: 12px; font-weight: 600; fill: #2563eb; }
      .name  { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .desc  { font-size: 10.5px; fill: #475569; }
      .hdr   { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .hdr-a { fill: #2563eb; }
      .hdr-b { fill: #10b981; }
      .cell  { font-size: 11.5px; fill: #334155; }
      .lbl   { font-size: 12px; fill: #64748b; font-weight: 600; }
    </style>
  </defs>

  <text x="550" y="42" text-anchor="middle" class="title">インデックスとドキュメントのライフサイクル</text>
  <text x="550" y="66" text-anchor="middle" class="sub">インデックスの作成から破棄までの全行程を 6 段階でカバー — ドライバ非依存、セマンティクスは統一</text>

  <!-- 节点 1 -->
  <rect x="30" y="100" width="160" height="120" class="node"/>
  <text x="110" y="124" text-anchor="middle" class="step">① 作成</text>
  <text x="110" y="148" text-anchor="middle" class="name">create_index</text>
  <text x="110" y="170" text-anchor="middle" class="desc">インデックスを事前作成して</text>
  <text x="110" y="186" text-anchor="middle" class="desc">settings を渡す（ES マッピング等）</text>
  <text x="110" y="202" text-anchor="middle" class="desc">インデックス名の検証 + エスケープ</text>
  <line x1="190" y1="160" x2="220" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 节点 2 -->
  <rect x="220" y="100" width="160" height="120" class="node"/>
  <text x="300" y="124" text-anchor="middle" class="step">② 書き込み</text>
  <text x="300" y="148" text-anchor="middle" class="name">update</text>
  <text x="300" y="170" text-anchor="middle" class="desc">ドキュメントを一括インデックスし、</text>
  <text x="300" y="186" text-anchor="middle" class="desc">doc.index でルーティング（デフォルト</text>
  <text x="300" y="202" text-anchor="middle" class="desc">"default"）、同じ id は上書き</text>
  <line x1="380" y1="160" x2="410" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 节点 3 -->
  <rect x="410" y="100" width="160" height="120" class="node node-alt"/>
  <text x="490" y="124" text-anchor="middle" class="step">③ フラッシュ</text>
  <text x="490" y="148" text-anchor="middle" class="name">flush</text>
  <text x="490" y="170" text-anchor="middle" class="desc">メモリドライバは no-op;</text>
  <text x="490" y="186" text-anchor="middle" class="desc">ES ドライバは _refresh</text>
  <text x="490" y="202" text-anchor="middle" class="desc">（可視性を保証）</text>
  <line x1="570" y1="160" x2="600" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 节点 4 -->
  <rect x="600" y="100" width="160" height="120" class="node"/>
  <text x="680" y="124" text-anchor="middle" class="step">④ クエリ</text>
  <text x="680" y="148" text-anchor="middle" class="name">search / paginate</text>
  <text x="680" y="170" text-anchor="middle" class="desc">query + フィルタ + ソート</text>
  <text x="680" y="186" text-anchor="middle" class="desc">+ ページネーション、返すのは</text>
  <text x="680" y="202" text-anchor="middle" class="desc">SearchResult</text>
  <line x1="760" y1="160" x2="790" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 节点 5 -->
  <rect x="790" y="100" width="160" height="120" class="node"/>
  <text x="870" y="124" text-anchor="middle" class="step">⑤ 削除</text>
  <text x="870" y="148" text-anchor="middle" class="name">delete</text>
  <text x="870" y="170" text-anchor="middle" class="desc">id でドキュメントを削除、</text>
  <text x="870" y="186" text-anchor="middle" class="desc">メモリドライバはインデックスを</text>
  <text x="870" y="202" text-anchor="middle" class="desc">またいで整理、ES は id で削除</text>
  <line x1="950" y1="160" x2="980" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 节点 6 -->
  <rect x="980" y="100" width="100" height="120" class="node node-alt"/>
  <text x="1030" y="124" text-anchor="middle" class="step">⑥ 破棄</text>
  <text x="1030" y="148" text-anchor="middle" class="name">delete_index</text>
  <text x="1030" y="170" text-anchor="middle" class="desc">完全に削除</text>
  <text x="1030" y="186" text-anchor="middle" class="desc">インデックスとデータ</text>

  <!-- 对照表 -->
  <text x="550" y="260" text-anchor="middle" class="lbl">2 つのドライバの動作比較</text>
  <rect x="60" y="272" width="490" height="30" rx="6" class="hdr hdr-a"/>
  <rect x="550" y="272" width="490" height="30" rx="6" class="hdr hdr-b"/>
  <text x="305" y="292" text-anchor="middle" class="hdr">CollectionEngine（デフォルト · メモリ）</text>
  <text x="795" y="292" text-anchor="middle" class="hdr">ElasticsearchEngine（feature）</text>

  <rect x="60" y="302" width="490" height="26" rx="4" fill="#eff6ff"/>
  <rect x="550" y="302" width="490" height="26" rx="4" fill="#ecfdf5"/>
  <text x="75" y="320" class="cell">ストレージ:プロセス内 HashMap&lt;index, docs&gt;、Mutex で保護</text>
  <text x="565" y="320" class="cell">ストレージ:ES / OpenSearch クラスター、REST + JSON</text>

  <rect x="60" y="328" width="490" height="26" rx="4" fill="#ffffff"/>
  <rect x="550" y="328" width="490" height="26" rx="4" fill="#ffffff"/>
  <text x="75" y="346" class="cell">全文:フィールドをシリアライズした部分文字列マッチ（大文字小文字を区別しない）</text>
  <text x="565" y="346" class="cell">全文:query_string 構文（フィールド名:値 など）</text>

  <rect x="60" y="354" width="490" height="26" rx="4" fill="#eff6ff"/>
  <rect x="550" y="354" width="490" height="26" rx="4" fill="#ecfdf5"/>
  <text x="75" y="372" class="cell">フィルタ/ソート:メモリ上で matches() + sort_hits() を実行</text>
  <text x="565" y="372" class="cell">フィルタ/ソート:term/terms/must_not + sort 配列</text>

  <rect x="60" y="380" width="490" height="26" rx="4" fill="#ffffff"/>
  <rect x="550" y="380" width="490" height="26" rx="4" fill="#ffffff"/>
  <text x="75" y="398" class="cell">flush:no-op（書き込みは即時反映）</text>
  <text x="565" y="398" class="cell">flush:POST _refresh（書き込みを検索可能に更新）</text>

  <rect x="60" y="406" width="490" height="26" rx="4" fill="#eff6ff"/>
  <rect x="550" y="406" width="490" height="26" rx="4" fill="#ecfdf5"/>
  <text x="75" y="424" class="cell">ページネーション:デフォルトで全件、ソート:デフォルトで id 順</text>
  <text x="565" y="424" class="cell">ページネーション:デフォルト size 10、ソート:デフォルト _score</text>

  <rect x="60" y="432" width="490" height="26" rx="4" fill="#ffffff"/>
  <rect x="550" y="432" width="490" height="26" rx="4" fill="#ffffff"/>
  <text x="75" y="450" class="cell">エラー:メモリ/JSON 層のみ（poison 対策）</text>
  <text x="565" y="450" class="cell">エラー:HTTP / バックエンドエラーをそのまま透過</text>

  <!-- 错误路径 -->
  <text x="550" y="500" text-anchor="middle" class="lbl">エラーパス（統一 ScoutError）</text>
  <text x="550" y="522" text-anchor="middle" class="cell">InvalidIndexName · InvalidResult · Unsupported · Json · Http · Backend — すべて crate::Result&lt;T&gt; に集約</text>
</svg>
