<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="lifeTitle">
  <title id="lifeTitle">索引とドキュメントのライフサイクル：作成 / 書き込み / 更新 / 検索 / 削除 / 再構築 / 破棄</title>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 13px; fill: #64748b; }
      .node  { fill: #ffffff; stroke: #2563eb; stroke-width: 1.6; }
      .node-alt { stroke: #f59e0b; }
      .step  { font-size: 11.5px; font-weight: 600; fill: #2563eb; }
      .name  { font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .desc  { font-size: 10px; fill: #475569; }
      .hdr   { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
      .cell  { font-size: 10.5px; fill: #334155; }
      .rowlb { font-size: 11px; font-weight: 600; fill: #0f172a; }
      .lbl   { font-size: 12px; fill: #64748b; font-weight: 600; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <text x="590" y="42" text-anchor="middle" class="title">索引とドキュメントのライフサイクル</text>
  <text x="590" y="66" text-anchor="middle" class="sub">7 つの段階が索引の作成から破棄までの旅を覆う —— ドライバ非依存、意味論は統一</text>

  <!-- ==================== ライフサイクルの流れ ==================== -->
  <rect x="38" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="110" y="124" text-anchor="middle" class="step">① 作成</text>
  <text x="110" y="148" text-anchor="middle" class="name">create_index</text>
  <text x="110" y="172" text-anchor="middle" class="desc">索引を事前作成し</text>
  <text x="110" y="188" text-anchor="middle" class="desc">settings（ES 定義等）</text>
  <text x="110" y="204" text-anchor="middle" class="desc">索引名を検証 + エスケープ</text>
  <line x1="183" y1="166" x2="198" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="198" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="270" y="124" text-anchor="middle" class="step">② 書き込み</text>
  <text x="270" y="148" text-anchor="middle" class="name">update</text>
  <text x="270" y="172" text-anchor="middle" class="desc">doc.index で振り分け</text>
  <text x="270" y="188" text-anchor="middle" class="desc">（既定 "default"）</text>
  <text x="270" y="204" text-anchor="middle" class="desc">同じ id は上書き、</text>
  <text x="270" y="220" text-anchor="middle" class="desc mono">update_bulk</text>
  <line x1="343" y1="166" x2="358" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="358" y="100" width="145" height="132" rx="10" class="node node-alt"/>
  <text x="430" y="124" text-anchor="middle" class="step">③ フラッシュ</text>
  <text x="430" y="148" text-anchor="middle" class="name">flush</text>
  <text x="430" y="172" text-anchor="middle" class="desc">no-op：collection/SQLite</text>
  <text x="430" y="188" text-anchor="middle" class="desc">no-op：Meili/TS/Algolia</text>
  <text x="430" y="204" text-anchor="middle" class="desc">_refresh：ES</text>
  <line x1="503" y1="166" x2="518" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="518" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="590" y="124" text-anchor="middle" class="step">④ 検索</text>
  <text x="590" y="148" text-anchor="middle" class="name">search / paginate</text>
  <text x="590" y="172" text-anchor="middle" class="desc">クエリ + 絞り込み + ソート</text>
  <text x="590" y="188" text-anchor="middle" class="desc">+ ページングで</text>
  <text x="590" y="204" text-anchor="middle" class="desc">SearchResult</text>
  <line x1="663" y1="166" x2="678" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="678" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="750" y="124" text-anchor="middle" class="step">⑤ 文書削除</text>
  <text x="750" y="148" text-anchor="middle" class="name">delete · delete_in</text>
  <text x="750" y="172" text-anchor="middle" class="desc">id で削除；delete_in</text>
  <text x="750" y="188" text-anchor="middle" class="desc">単一索引に限定。</text>
  <text x="750" y="204" text-anchor="middle" class="desc mono">soft_delete_in</text>
  <line x1="823" y1="166" x2="838" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="838" y="100" width="145" height="132" rx="10" class="node node-alt"/>
  <text x="910" y="124" text-anchor="middle" class="step">⑥ 再構築</text>
  <text x="910" y="148" text-anchor="middle" class="name">reindex</text>
  <text x="910" y="172" text-anchor="middle" class="desc">from から to へ複製。</text>
  <text x="910" y="188" text-anchor="middle" class="desc">メモリ：対象を置換</text>
  <text x="910" y="204" text-anchor="middle" class="desc">ES：_reindex で統合</text>
  <line x1="983" y1="166" x2="998" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="998" y="100" width="145" height="132" rx="10" class="node node-alt"/>
  <text x="1070" y="124" text-anchor="middle" class="step">⑦ 破棄</text>
  <text x="1070" y="148" text-anchor="middle" class="name">delete_index</text>
  <text x="1070" y="172" text-anchor="middle" class="desc">索引を完全に削除</text>
  <text x="1070" y="188" text-anchor="middle" class="desc">および全データ</text>

  <!-- ==================== ドライバ族の対照表 ==================== -->
  <text x="590" y="278" text-anchor="middle" class="lbl">4 類のドライバの段階ごとの挙動差</text>

  <rect x="60" y="292" width="130" height="32" rx="6" fill="#f1f5f9"/>
  <rect x="195" y="292" width="218" height="32" rx="6" fill="#10b981"/>
  <rect x="413" y="292" width="218" height="32" rx="6" fill="#2563eb"/>
  <rect x="631" y="292" width="218" height="32" rx="6" fill="#d97706"/>
  <rect x="849" y="292" width="218" height="32" rx="6" fill="#94a3b8"/>
  <text x="74" y="313" class="lbl">段階 / 挙動</text>
  <text x="304" y="313" text-anchor="middle" class="hdr">CollectionEngine</text>
  <text x="522" y="313" text-anchor="middle" class="hdr">HTTP バックエンド(ES など)</text>
  <text x="740" y="313" text-anchor="middle" class="hdr">DatabaseEngine</text>
  <text x="958" y="313" text-anchor="middle" class="hdr">NullEngine</text>

  <!-- 行 1 ストレージ -->
  <rect x="60" y="328" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="347" class="rowlb">保存媒体</text>
  <text x="207" y="347" class="cell">プロセス内 HashMap</text>
  <text x="425" y="347" class="cell">リモートクラスタ / マネージドクラウド</text>
  <text x="643" y="347" class="cell">SQLite ファイル</text>
  <text x="861" y="347" class="cell">ストレージに残さない</text>

  <!-- 行 2 全文 -->
  <rect x="60" y="358" width="1007" height="30" rx="4" fill="#f8fafc"/>
  <text x="74" y="377" class="rowlb">全文一致</text>
  <text x="207" y="377" class="cell">フィールドを直列化して部分一致</text>
  <text x="425" y="377" class="cell">バックエンドのネイティブ構文</text>
  <text x="643" y="377" class="cell">LIKE 粗ふるい + メモリで精査</text>
  <text x="861" y="377" class="cell">常に空の結果を返す</text>

  <!-- 行 3 絞り込みとソート -->
  <rect x="60" y="388" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="407" class="rowlb">絞り込み / ソート</text>
  <text x="207" y="407" class="cell">メモリ内 matches + sort_hits</text>
  <text x="425" y="407" class="cell">term / terms / sort をプッシュダウン</text>
  <text x="643" y="407" class="cell">total = hits.len()</text>
  <text x="861" y="407" class="cell">なし</text>

  <!-- 行 4 flush -->
  <rect x="60" y="418" width="1007" height="30" rx="4" fill="#f8fafc"/>
  <text x="74" y="437" class="rowlb">flush</text>
  <text x="207" y="437" class="cell">no-op（書き込みは即時可視）</text>
  <text x="425" y="437" class="cell">ES: _refresh / others: no-op</text>
  <text x="643" y="437" class="cell">no-op</text>
  <text x="861" y="437" class="cell">no-op</text>

  <!-- 行 5 ページング既定 -->
  <rect x="60" y="448" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="467" class="rowlb">ページング既定</text>
  <text x="207" y="467" class="cell">全件取得、id 順に並べる</text>
  <text x="425" y="467" class="cell">size 10、_score 順</text>
  <text x="643" y="467" class="cell">hits を基準に</text>
  <text x="861" y="467" class="cell">空</text>

  <!-- 行 6 delete の意味 -->
  <rect x="60" y="478" width="1007" height="30" rx="4" fill="#f8fafc"/>
  <text x="74" y="497" class="rowlb">delete の意味</text>
  <text x="207" y="497" class="cell">索引をまたいで削除</text>
  <text x="425" y="497" class="cell">default のみ（delete_in で精密に）</text>
  <text x="643" y="497" class="cell">id 単位、索引をまたげる</text>
  <text x="861" y="497" class="cell">no-op</text>

  <!-- 行 7 ソフト削除 -->
  <rect x="60" y="508" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="527" class="rowlb">soft_delete</text>
  <text x="207" y="527" class="cell">対応（フラグ付与）</text>
  <text x="425" y="527" class="cell">対応（フラグ付与）</text>
  <text x="643" y="527" class="cell">対応（三態フィルタ）</text>
  <text x="861" y="527" class="cell">非対応</text>

  <!-- ==================== エラー経路 ==================== -->
  <rect x="60" y="562" width="1007" height="58" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="74" y="584" class="lbl">エラー経路 —— すべて crate::Result&lt;T&gt; に収束</text>
  <text x="74" y="606" class="cell mono">InvalidIndexName · InvalidResult · Unsupported · Json · Http · Sqlx · Backend · XunSearch · XunSearchIo</text>
</svg>
