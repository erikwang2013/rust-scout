<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="featTitle">
  <title id="featTitle">Desain fitur rust-scout: 12 kemampuan, semua lewat trait Engine yang sama</title>
  <defs>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 13px; fill: #64748b; }
      .card  { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .name  { font-size: 14px; font-weight: 600; fill: #0f172a; }
      .desc  { font-size: 11px; fill: #475569; }
      .api   { font-size: 10px; fill: #2563eb; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .ico   { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.2; }
      .ico-t { font-size: 17px; font-weight: 700; fill: #2563eb; }
      .n     { font-size: 10px; font-weight: 700; fill: #94a3b8; }
    </style>
  </defs>

  <text x="550" y="42" text-anchor="middle" class="title">Desain Fitur</text>
  <text x="550" y="66" text-anchor="middle" class="sub">12 kemampuan — kueri, filter, urut, paginasi, siklus hidup, massal, multi-driver, batas keamanan, semua lewat trait Engine</text>

  <!-- ========== baris 1: membangun kueri ========== -->
  <rect x="40" y="100" width="240" height="142" rx="10" class="card"/>
  <rect x="58" y="116" width="36" height="36" rx="8" class="ico"/>
  <text x="76" y="140" text-anchor="middle" class="ico-t">Q</text>
  <text x="104" y="132" class="name">Kueri Berantai</text>
  <text x="104" y="150" class="desc">kueri dan eksekusi terpisah</text>
  <text x="58" y="182" class="desc">Susun SearchBuilder dulu,</text>
  <text x="58" y="198" class="desc">lalu satu eksekusi async.</text>
  <text x="58" y="226" class="api">SearchBuilder::new(q)</text>

  <rect x="300" y="100" width="240" height="142" rx="10" class="card"/>
  <rect x="318" y="116" width="36" height="36" rx="8" class="ico"/>
  <text x="336" y="140" text-anchor="middle" class="ico-t">T</text>
  <text x="364" y="132" class="name">Teks lengkap</text>
  <text x="364" y="150" class="desc">kosong = semua</text>
  <text x="318" y="182" class="desc">ES memakai query_string</text>
  <text x="318" y="198" class="desc">(field:nilai / fuzzy / AND)</text>
  <text x="318" y="226" class="api">query: "rust" · "title:rust"</text>

  <rect x="560" y="100" width="240" height="142" rx="10" class="card"/>
  <rect x="578" y="116" width="36" height="36" rx="8" class="ico"/>
  <text x="596" y="140" text-anchor="middle" class="ico-t">=</text>
  <text x="624" y="132" class="name">Filter Tepat</text>
  <text x="624" y="150" class="desc">pencocokan kesamaan</text>
  <text x="578" y="182" class="desc">angka / bool / string</text>
  <text x="578" y="198" class="desc">dibanding ketat per tipe JSON.</text>
  <text x="578" y="226" class="api">.where_field("status", "ok")</text>

  <rect x="820" y="100" width="240" height="142" rx="10" class="card"/>
  <rect x="838" y="116" width="36" height="36" rx="8" class="ico"/>
  <text x="856" y="140" text-anchor="middle" class="ico-t">∈</text>
  <text x="884" y="132" class="name">Filter Himpunan</text>
  <text x="884" y="150" class="desc">IN / NOT IN</text>
  <text x="838" y="182" class="desc">bisa ditumpuk; IN kosong</text>
  <text x="838" y="198" class="desc">tak cocok dokumen mana pun.</text>
  <text x="838" y="226" class="api">.where_in("tags", [..])</text>

  <!-- ========== baris 2: pengolahan hasil ========== -->
  <rect x="40" y="257" width="240" height="142" rx="10" class="card"/>
  <rect x="58" y="273" width="36" height="36" rx="8" class="ico"/>
  <text x="76" y="297" text-anchor="middle" class="ico-t">⇅</text>
  <text x="104" y="289" class="name">Urut Multi-field</text>
  <text x="104" y="307" class="desc">asc / desc dapat ditumpuk</text>
  <text x="58" y="339" class="desc">urutan pasti antar tipe;</text>
  <text x="58" y="355" class="desc">tanpa urut: stabil per id.</text>
  <text x="58" y="383" class="api">.order_by("created_at", true)</text>

  <rect x="300" y="257" width="240" height="142" rx="10" class="card"/>
  <rect x="318" y="273" width="36" height="36" rx="8" class="ico"/>
  <text x="336" y="297" text-anchor="middle" class="ico-t">P</text>
  <text x="364" y="289" class="name">Paginasi</text>
  <text x="364" y="307" class="desc">offset + nomor halaman</text>
  <text x="318" y="339" class="desc">take / skip untuk offset;</text>
  <text x="318" y="355" class="desc">paginate per halaman (mulai 1).</text>
  <text x="318" y="383" class="api">engine.paginate(&amp;b, page, per)</text>

  <rect x="560" y="257" width="240" height="142" rx="10" class="card"/>
  <rect x="578" y="273" width="36" height="36" rx="8" class="ico"/>
  <text x="596" y="297" text-anchor="middle" class="ico-t">I</text>
  <text x="624" y="289" class="name">Banyak Indeks</text>
  <text x="624" y="307" class="desc">perutean tingkat dokumen</text>
  <text x="578" y="339" class="desc">ditulis menurut doc.index,</text>
  <text x="578" y="355" class="desc">bawaan jatuh ke "default".</text>
  <text x="578" y="383" class="api">.within("books") · doc.index</text>

  <rect x="820" y="257" width="240" height="142" rx="10" class="card"/>
  <rect x="838" y="273" width="36" height="36" rx="8" class="ico"/>
  <text x="856" y="297" text-anchor="middle" class="ico-t">S</text>
  <text x="884" y="289" class="name">Hapus Lunak</text>
  <text x="884" y="307" class="desc">field __soft_deleted</text>
  <text x="838" y="339" class="desc">bawaan dikecualikan; kueri</text>
  <text x="838" y="355" class="desc">bisa sertakan atau hanya itu.</text>
  <text x="838" y="383" class="api">.with_trashed()/.only_trashed()</text>

  <!-- ========== baris 3: indeks dan driver ========== -->
  <rect x="40" y="414" width="240" height="142" rx="10" class="card"/>
  <rect x="58" y="430" width="36" height="36" rx="8" class="ico"/>
  <text x="76" y="454" text-anchor="middle" class="ico-t">L</text>
  <text x="104" y="446" class="name">Siklus Indeks</text>
  <text x="104" y="464" class="desc">buat / segarkan / hapus</text>
  <text x="58" y="496" class="desc">reindex beda antar mesin:</text>
  <text x="58" y="512" class="desc">memori ganti target, ES _reindex.</text>
  <text x="58" y="540" class="api">create_index · flush · reindex</text>

  <rect x="300" y="414" width="240" height="142" rx="10" class="card"/>
  <rect x="318" y="430" width="36" height="36" rx="8" class="ico"/>
  <text x="336" y="454" text-anchor="middle" class="ico-t">B</text>
  <text x="364" y="446" class="name">Massal dan Tepat</text>
  <text x="364" y="464" class="desc">kurangi pulang-pergi</text>
  <text x="318" y="496" class="desc">update_bulk / delete_bulk</text>
  <text x="318" y="512" class="desc">bawaan per item, bisa ditimpa.</text>
  <text x="318" y="540" class="api">delete_in(index, ids)</text>

  <rect x="560" y="414" width="240" height="142" rx="10" class="card"/>
  <rect x="578" y="430" width="36" height="36" rx="8" class="ico"/>
  <text x="596" y="454" text-anchor="middle" class="ico-t">D</text>
  <text x="624" y="446" class="name">Driver plug-in</text>
  <text x="624" y="464" class="desc">8 backend</text>
  <text x="578" y="496" class="desc">collection · elasticsearch ·</text>
  <text x="578" y="512" class="desc">meilisearch · typesense · algolia</text>
  <text x="578" y="540" class="api">ScoutConfig::meilisearch(..)</text>

  <rect x="820" y="414" width="240" height="142" rx="10" class="card"/>
  <rect x="838" y="430" width="36" height="36" rx="8" class="ico"/>
  <text x="856" y="454" text-anchor="middle" class="ico-t">#</text>
  <text x="884" y="446" class="name">Batas Keamanan</text>
  <text x="884" y="464" class="desc">validasi + escape</text>
  <text x="838" y="496" class="desc">nama lewat validate_index_name</text>
  <text x="838" y="512" class="desc">lalu kode persen RFC 3986 di URL.</text>
  <text x="838" y="540" class="api">percent_encode(index)</text>

  <!-- catatan kaki -->
  <text x="550" y="584" text-anchor="middle" class="desc">Delapan driver berbagi satu kontrak — ganti backend cukup ubah ScoutConfig, kode bisnis tak berubah.</text>
</svg>
