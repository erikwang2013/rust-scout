<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 13px; fill: #64748b; }
      .card  { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 10; }
      .num   { font-size: 20px; font-weight: 700; fill: #2563eb; }
      .name  { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .desc  { font-size: 12px; fill: #475569; }
      .code  { font-size: 11px; fill: #334155; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .rule  { fill: #dbeafe; }
    </style>
  </defs>

  <text x="550" y="42" text-anchor="middle" class="title">Filosofi Desain</text>
  <text x="550" y="66" text-anchor="middle" class="sub">Lima prinsip desain — masing-masing mewujud pada satu keputusan konkret di kode</text>

  <!-- 1 -->
  <rect x="40" y="90" width="1020" height="92" class="card"/>
  <rect x="60" y="106" width="40" height="40" rx="20" class="rule"/>
  <text x="80" y="132" text-anchor="middle" class="num">1</text>
  <text x="118" y="122" class="name">API berantai gaya Scout</text>
  <text x="118" y="142" class="desc">Mengikuti model mental Laravel Scout: bangun kueri dulu, lalu jalankan dalam satu panggilan. Kueri dan eksekusi terpisah, memudahkan pemakaian ulang dan pengujian.</text>
  <text x="118" y="162" class="code">let b = SearchBuilder::new(q).within(i).where_field(f, v).order_by(k, true).take(10);</text>

  <!-- 2 -->
  <rect x="40" y="194" width="1020" height="92" class="card"/>
  <rect x="60" y="210" width="40" height="40" rx="20" class="rule"/>
  <text x="80" y="236" text-anchor="middle" class="num">2</text>
  <text x="118" y="226" class="name">Abstraksi driver — trait Engine satu-satunya sambungan</text>
  <text x="118" y="246" class="desc">8 metode wajib + 5 dengan implementasi bawaan (13 total), asinkron lewat EngineFuture. Delapan backend berbagi satu kontrak: ganti backend = ubah konfigurasi.</text>
  <text x="118" y="266" class="code">EngineManager::new(ScoutConfig::meilisearch(host, key)).engine()?;  // atau collection() / database() / ..</text>

  <!-- 3 -->
  <rect x="40" y="298" width="1020" height="92" class="card"/>
  <rect x="60" y="314" width="40" height="40" rx="20" class="rule"/>
  <text x="80" y="340" text-anchor="middle" class="num">3</text>
  <text x="118" y="330" class="name">Kontrak data lebih dulu — serde JSON</text>
  <text x="118" y="350" class="desc">Penulisan, kueri, dan hasil semuanya data JSON terstruktur, agnostik driver. Searchable menjembatani model bisnis dengan dokumen.</text>
  <text x="118" y="370" class="code">SearchDocument { id, index?, fields(flatten) } ⇄ SearchBuilder ⇄ SearchResult { hits, total, facets? }</text>

  <!-- 4 -->
  <rect x="40" y="402" width="1020" height="92" class="card"/>
  <rect x="60" y="418" width="40" height="40" rx="20" class="rule"/>
  <text x="80" y="444" text-anchor="middle" class="num">4</text>
  <text x="118" y="434" class="name">Sederhana lebih dulu — bawaan tanpa dependensi</text>
  <text x="118" y="454" class="desc">Driver in-memory bawaan langsung bisa dipakai, inti hanya bergantung pada serde / thiserror. Delapan backend di balik feature masing-masing: yang tak dipakai tidak dikompilasi.</text>
  <text x="118" y="474" class="code">[features] default = [] · elasticsearch = ["dep:reqwest"] · database = ["dep:sqlx"] · xunsearch = ["dep:tokio"]</text>

  <!-- 5 -->
  <rect x="40" y="506" width="1020" height="92" class="card"/>
  <rect x="60" y="522" width="40" height="40" rx="20" class="rule"/>
  <text x="80" y="548" text-anchor="middle" class="num">5</text>
  <text x="118" y="538" class="name">Batas keamanan — validasi input + escape output</text>
  <text x="118" y="558" class="desc">Nama indeks divalidasi lewat validate_index_name (menolak spasi / garis miring / titik di awal), lalu index dan id di semua mesin HTTP dikodekan persen per RFC 3986.</text>
  <text x="118" y="578" class="code">validate_index_name(index)?;  →  percent_encode(index) + percent_encode(id)</text>
</svg>
