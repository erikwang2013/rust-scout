<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="lifeTitle">
  <title id="lifeTitle">색인과 문서 라이프사이클: 생성 / 쓰기 / 갱신 / 검색 / 삭제 / 재구축 / 파괴</title>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 13px; fill: #64748b; }
      .node  { fill: #ffffff; stroke: #2563eb; stroke-width: 1.6; }
      .node-alt { stroke: #f59e0b; }
      .step  { font-size: 11.5px; font-weight: 600; fill: #2563eb; }
      .name  { font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .desc  { font-size: 10px; fill: #475569; }
      .hdr   { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
      .cell  { font-size: 10.5px; fill: #334155; }
      .rowlb { font-size: 11px; font-weight: 600; fill: #0f172a; }
      .lbl   { font-size: 12px; fill: #64748b; font-weight: 600; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <text x="590" y="42" text-anchor="middle" class="title">색인과 문서 라이프사이클</text>
  <text x="590" y="66" text-anchor="middle" class="sub">7단계가 색인의 생성부터 파괴까지의 여정을 다룬다 —— 드라이버 비의존, 의미론은 통일</text>

  <!-- ==================== 라이프사이클 흐름 ==================== -->
  <rect x="38" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="110" y="124" text-anchor="middle" class="step">① 생성</text>
  <text x="110" y="148" text-anchor="middle" class="name">create_index</text>
  <text x="110" y="172" text-anchor="middle" class="desc">색인을 미리 생성</text>
  <text x="110" y="188" text-anchor="middle" class="desc">settings(ES 매핑 등)</text>
  <text x="110" y="204" text-anchor="middle" class="desc">색인명 검증 + 이스케이프</text>
  <line x1="183" y1="166" x2="198" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="198" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="270" y="124" text-anchor="middle" class="step">② 쓰기</text>
  <text x="270" y="148" text-anchor="middle" class="name">update</text>
  <text x="270" y="172" text-anchor="middle" class="desc">doc.index 로 라우팅</text>
  <text x="270" y="188" text-anchor="middle" class="desc">(기본 "default")</text>
  <text x="270" y="204" text-anchor="middle" class="desc">같은 id 는 덮어씀,</text>
  <text x="270" y="220" text-anchor="middle" class="desc mono">update_bulk</text>
  <line x1="343" y1="166" x2="358" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="358" y="100" width="145" height="132" rx="10" class="node node-alt"/>
  <text x="430" y="124" text-anchor="middle" class="step">③ 플러시</text>
  <text x="430" y="148" text-anchor="middle" class="name">flush</text>
  <text x="430" y="172" text-anchor="middle" class="desc">메모리 / SQLite: no-op</text>
  <text x="430" y="188" text-anchor="middle" class="desc">HTTP 백엔드: _refresh</text>
  <text x="430" y="204" text-anchor="middle" class="desc">쓰기 가시성 보장</text>
  <line x1="503" y1="166" x2="518" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="518" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="590" y="124" text-anchor="middle" class="step">④ 검색</text>
  <text x="590" y="148" text-anchor="middle" class="name">search / paginate</text>
  <text x="590" y="172" text-anchor="middle" class="desc">쿼리 + 필터 + 정렬</text>
  <text x="590" y="188" text-anchor="middle" class="desc">+ 페이징 반환</text>
  <text x="590" y="204" text-anchor="middle" class="desc">SearchResult</text>
  <line x1="663" y1="166" x2="678" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="678" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="750" y="124" text-anchor="middle" class="step">⑤ 문서 삭제</text>
  <text x="750" y="148" text-anchor="middle" class="name">delete · delete_in</text>
  <text x="750" y="172" text-anchor="middle" class="desc">id 로 제거; delete_in</text>
  <text x="750" y="188" text-anchor="middle" class="desc">단일 색인으로 한정.</text>
  <text x="750" y="204" text-anchor="middle" class="desc mono">soft_delete 는 아래 표</text>
  <line x1="823" y1="166" x2="838" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="838" y="100" width="145" height="132" rx="10" class="node node-alt"/>
  <text x="910" y="124" text-anchor="middle" class="step">⑥ 재구축</text>
  <text x="910" y="148" text-anchor="middle" class="name">reindex</text>
  <text x="910" y="172" text-anchor="middle" class="desc">from 에서 to 로 복사.</text>
  <text x="910" y="188" text-anchor="middle" class="desc">메모리: 대상 교체</text>
  <text x="910" y="204" text-anchor="middle" class="desc">ES: _reindex 로 병합</text>
  <line x1="983" y1="166" x2="998" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="998" y="100" width="145" height="132" rx="10" class="node node-alt"/>
  <text x="1070" y="124" text-anchor="middle" class="step">⑦ 파괴</text>
  <text x="1070" y="148" text-anchor="middle" class="name">delete_index</text>
  <text x="1070" y="172" text-anchor="middle" class="desc">색인을 완전히 삭제</text>
  <text x="1070" y="188" text-anchor="middle" class="desc">그리고 모든 데이터</text>

  <!-- ==================== 드라이버 계열 대조표 ==================== -->
  <text x="590" y="278" text-anchor="middle" class="lbl">네 가지 드라이버의 단계별 동작 차이</text>

  <rect x="60" y="292" width="130" height="32" rx="6" fill="#f1f5f9"/>
  <rect x="195" y="292" width="218" height="32" rx="6" fill="#10b981"/>
  <rect x="413" y="292" width="218" height="32" rx="6" fill="#2563eb"/>
  <rect x="631" y="292" width="218" height="32" rx="6" fill="#d97706"/>
  <rect x="849" y="292" width="218" height="32" rx="6" fill="#94a3b8"/>
  <text x="74" y="313" class="lbl">단계 / 동작</text>
  <text x="304" y="313" text-anchor="middle" class="hdr">CollectionEngine</text>
  <text x="522" y="313" text-anchor="middle" class="hdr">HTTP 백엔드(ES 등)</text>
  <text x="740" y="313" text-anchor="middle" class="hdr">DatabaseEngine</text>
  <text x="958" y="313" text-anchor="middle" class="hdr">NullEngine</text>

  <!-- 1행 저장소 -->
  <rect x="60" y="328" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="347" class="rowlb">저장 매체</text>
  <text x="207" y="347" class="cell">프로세스 내 HashMap</text>
  <text x="425" y="347" class="cell">원격 클러스터 / 관리형 클라우드</text>
  <text x="643" y="347" class="cell">SQLite 파일</text>
  <text x="861" y="347" class="cell">어떤 저장소에도 남기지 않음</text>

  <!-- 2행 전체 텍스트 -->
  <rect x="60" y="358" width="1007" height="30" rx="4" fill="#f8fafc"/>
  <text x="74" y="377" class="rowlb">전체 텍스트 매칭</text>
  <text x="207" y="377" class="cell">필드를 직렬화해 부분 일치</text>
  <text x="425" y="377" class="cell">백엔드 네이티브 문법</text>
  <text x="643" y="377" class="cell">LIKE 1차 필터 + 메모리 정제</text>
  <text x="861" y="377" class="cell">항상 빈 결과 반환</text>

  <!-- 3행 필터/정렬 -->
  <rect x="60" y="388" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="407" class="rowlb">필터 / 정렬</text>
  <text x="207" y="407" class="cell">메모리 내 matches + sort_hits</text>
  <text x="425" y="407" class="cell">term / terms / sort 푸시다운</text>
  <text x="643" y="407" class="cell">메모리 필터(total 은 SQL 집계)</text>
  <text x="861" y="407" class="cell">없음</text>

  <!-- 4행 flush -->
  <rect x="60" y="418" width="1007" height="30" rx="4" fill="#f8fafc"/>
  <text x="74" y="437" class="rowlb">flush</text>
  <text x="207" y="437" class="cell">no-op(쓰기는 즉시 반영)</text>
  <text x="425" y="437" class="cell">_refresh(검색 가능하게)</text>
  <text x="643" y="437" class="cell">no-op</text>
  <text x="861" y="437" class="cell">no-op</text>

  <!-- 5행 페이징 기본 -->
  <rect x="60" y="448" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="467" class="rowlb">페이징 기본</text>
  <text x="207" y="467" class="cell">전체 조회, id 순 정렬</text>
  <text x="425" y="467" class="cell">size 10, _score 순</text>
  <text x="643" y="467" class="cell">hits 기준</text>
  <text x="861" y="467" class="cell">비어 있음</text>

  <!-- 6행 delete 의미 -->
  <rect x="60" y="478" width="1007" height="30" rx="4" fill="#f8fafc"/>
  <text x="74" y="497" class="rowlb">delete 의미</text>
  <text x="207" y="497" class="cell">색인을 넘어 삭제</text>
  <text x="425" y="497" class="cell">default 만(delete_in 로 정확히)</text>
  <text x="643" y="497" class="cell">id 기준, 색인 넘나듦</text>
  <text x="861" y="497" class="cell">no-op</text>

  <!-- 7행 소프트 삭제 -->
  <rect x="60" y="508" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="527" class="rowlb">soft_delete</text>
  <text x="207" y="527" class="cell">지원(플래그 표시)</text>
  <text x="425" y="527" class="cell">지원(플래그 표시)</text>
  <text x="643" y="527" class="cell">지원(3상태 필터)</text>
  <text x="861" y="527" class="cell">미지원</text>

  <!-- ==================== 에러 경로 ==================== -->
  <rect x="60" y="562" width="1007" height="58" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="74" y="584" class="lbl">에러 경로 —— 모두 crate::Result&lt;T&gt; 로 수렴</text>
  <text x="74" y="606" class="cell mono">InvalidIndexName · InvalidResult · Unsupported · Json · Http · Sqlx · Backend · XunSearch · XunSearchIo</text>
</svg>
