<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 13px; fill: #64748b; }
      .node  { fill: #ffffff; stroke: #2563eb; stroke-width: 1.6; rx: 10; }
      .node-alt { stroke: #f59e0b; }
      .step  { font-size: 12px; font-weight: 600; fill: #2563eb; }
      .name  { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .desc  { font-size: 10.5px; fill: #475569; }
      .hdr   { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .hdr-a { fill: #2563eb; }
      .hdr-b { fill: #10b981; }
      .cell  { font-size: 11.5px; fill: #334155; }
      .lbl   { font-size: 12px; fill: #64748b; font-weight: 600; }
    </style>
  </defs>

  <text x="550" y="42" text-anchor="middle" class="title">인덱스와 문서 라이프사이클</text>
  <text x="550" y="66" text-anchor="middle" class="sub">인덱스 생성부터 폐기까지의 전체 여정을 6단계로 다룹니다 — 드라이버 무관, 의미는 통일</text>

  <!-- 节点 1 -->
  <rect x="30" y="100" width="160" height="120" class="node"/>
  <text x="110" y="124" text-anchor="middle" class="step">① 생성</text>
  <text x="110" y="148" text-anchor="middle" class="name">create_index</text>
  <text x="110" y="170" text-anchor="middle" class="desc">인덱스를 미리 생성하고</text>
  <text x="110" y="186" text-anchor="middle" class="desc">settings 전달 (ES 매핑 등)</text>
  <text x="110" y="202" text-anchor="middle" class="desc">인덱스 이름 검증 + 이스케이프</text>
  <line x1="190" y1="160" x2="220" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 节点 2 -->
  <rect x="220" y="100" width="160" height="120" class="node"/>
  <text x="300" y="124" text-anchor="middle" class="step">② 쓰기</text>
  <text x="300" y="148" text-anchor="middle" class="name">update</text>
  <text x="300" y="170" text-anchor="middle" class="desc">문서를 일괄 인덱싱하고</text>
  <text x="300" y="186" text-anchor="middle" class="desc">doc.index로 라우팅 (기본</text>
  <text x="300" y="202" text-anchor="middle" class="desc">"default"), 같은 id는 덮어씀</text>
  <line x1="380" y1="160" x2="410" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 节点 3 -->
  <rect x="410" y="100" width="160" height="120" class="node node-alt"/>
  <text x="490" y="124" text-anchor="middle" class="step">③ 새로고침</text>
  <text x="490" y="148" text-anchor="middle" class="name">flush</text>
  <text x="490" y="170" text-anchor="middle" class="desc">인메모리 드라이버는 no-op;</text>
  <text x="490" y="186" text-anchor="middle" class="desc">ES 드라이버는 _refresh</text>
  <text x="490" y="202" text-anchor="middle" class="desc">(가시성 보장)</text>
  <line x1="570" y1="160" x2="600" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 节点 4 -->
  <rect x="600" y="100" width="160" height="120" class="node"/>
  <text x="680" y="124" text-anchor="middle" class="step">④ 검색</text>
  <text x="680" y="148" text-anchor="middle" class="name">search / paginate</text>
  <text x="680" y="170" text-anchor="middle" class="desc">query + 필터링 + 정렬</text>
  <text x="680" y="186" text-anchor="middle" class="desc">+ 페이지네이션, 반환</text>
  <text x="680" y="202" text-anchor="middle" class="desc">SearchResult</text>
  <line x1="760" y1="160" x2="790" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 节点 5 -->
  <rect x="790" y="100" width="160" height="120" class="node"/>
  <text x="870" y="124" text-anchor="middle" class="step">⑤ 삭제</text>
  <text x="870" y="148" text-anchor="middle" class="name">delete</text>
  <text x="870" y="170" text-anchor="middle" class="desc">id로 문서를 제거하고,</text>
  <text x="870" y="186" text-anchor="middle" class="desc">인메모리 드라이버는 인덱스에</text>
  <text x="870" y="202" text-anchor="middle" class="desc">걸쳐 정리, ES는 id로 삭제</text>
  <line x1="950" y1="160" x2="980" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 节点 6 -->
  <rect x="980" y="100" width="100" height="120" class="node node-alt"/>
  <text x="1030" y="124" text-anchor="middle" class="step">⑥ 폐기</text>
  <text x="1030" y="148" text-anchor="middle" class="name">delete_index</text>
  <text x="1030" y="170" text-anchor="middle" class="desc">인덱스와 데이터를</text>
  <text x="1030" y="186" text-anchor="middle" class="desc">완전히 삭제</text>

  <!-- 对照表 -->
  <text x="550" y="260" text-anchor="middle" class="lbl">두 드라이버 동작 비교</text>
  <rect x="60" y="272" width="490" height="30" rx="6" class="hdr hdr-a"/>
  <rect x="550" y="272" width="490" height="30" rx="6" class="hdr hdr-b"/>
  <text x="305" y="292" text-anchor="middle" class="hdr">CollectionEngine (기본 · 메모리)</text>
  <text x="795" y="292" text-anchor="middle" class="hdr">ElasticsearchEngine (feature)</text>

  <rect x="60" y="302" width="490" height="26" rx="4" fill="#eff6ff"/>
  <rect x="550" y="302" width="490" height="26" rx="4" fill="#ecfdf5"/>
  <text x="75" y="320" class="cell">저장소: 프로세스 내 HashMap&lt;index, docs&gt;, Mutex 보호</text>
  <text x="565" y="320" class="cell">저장소: ES / OpenSearch 클러스터, REST + JSON</text>

  <rect x="60" y="328" width="490" height="26" rx="4" fill="#ffffff"/>
  <rect x="550" y="328" width="490" height="26" rx="4" fill="#ffffff"/>
  <text x="75" y="346" class="cell">전체 텍스트: 필드 직렬화 부분 문자열 매칭 (대소문자 구분 안 함)</text>
  <text x="565" y="346" class="cell">전체 텍스트: query_string 문법 (필드명:값 등)</text>

  <rect x="60" y="354" width="490" height="26" rx="4" fill="#eff6ff"/>
  <rect x="550" y="354" width="490" height="26" rx="4" fill="#ecfdf5"/>
  <text x="75" y="372" class="cell">필터/정렬: 메모리에서 matches() + sort_hits() 실행</text>
  <text x="565" y="372" class="cell">필터/정렬: term/terms/must_not + sort 배열</text>

  <rect x="60" y="380" width="490" height="26" rx="4" fill="#ffffff"/>
  <rect x="550" y="380" width="490" height="26" rx="4" fill="#ffffff"/>
  <text x="75" y="398" class="cell">flush: no-op (쓰기 즉시 반영)</text>
  <text x="565" y="398" class="cell">flush: POST _refresh (쓰기를 검색 가능하게 새로고침)</text>

  <rect x="60" y="406" width="490" height="26" rx="4" fill="#eff6ff"/>
  <rect x="550" y="406" width="490" height="26" rx="4" fill="#ecfdf5"/>
  <text x="75" y="424" class="cell">페이지네이션: 기본 전체, 정렬: 기본 id 순</text>
  <text x="565" y="424" class="cell">페이지네이션: 기본 size 10, 정렬: 기본 _score</text>

  <rect x="60" y="432" width="490" height="26" rx="4" fill="#ffffff"/>
  <rect x="550" y="432" width="490" height="26" rx="4" fill="#ffffff"/>
  <text x="75" y="450" class="cell">오류: 메모리/JSON 계층만 (poison 방지)</text>
  <text x="565" y="450" class="cell">오류: HTTP / 백엔드 오류를 그대로 전달</text>

  <!-- 错误路径 -->
  <text x="550" y="500" text-anchor="middle" class="lbl">오류 경로 (통합 ScoutError)</text>
  <text x="550" y="522" text-anchor="middle" class="cell">InvalidIndexName · InvalidResult · Unsupported · Json · Http · Backend — 모두 crate::Result&lt;T&gt;로 수렴</text>
</svg>
