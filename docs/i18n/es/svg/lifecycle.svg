<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="lifeTitle">
  <title id="lifeTitle">Ciclo de vida de índices y documentos: crear / escribir / refrescar / buscar / borrar / reindexar / destruir</title>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 13px; fill: #64748b; }
      .node  { fill: #ffffff; stroke: #2563eb; stroke-width: 1.6; }
      .node-alt { stroke: #f59e0b; }
      .step  { font-size: 11.5px; font-weight: 600; fill: #2563eb; }
      .name  { font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .desc  { font-size: 10px; fill: #475569; }
      .hdr   { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
      .cell  { font-size: 10.5px; fill: #334155; }
      .rowlb { font-size: 11px; font-weight: 600; fill: #0f172a; }
      .lbl   { font-size: 12px; fill: #64748b; font-weight: 600; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <text x="590" y="42" text-anchor="middle" class="title">Ciclo de Vida de Índices y Documentos</text>
  <text x="590" y="66" text-anchor="middle" class="sub">Siete etapas cubren el viaje del índice desde su creación hasta su destrucción — sin depender del driver</text>

  <!-- ==================== flujo del ciclo de vida ==================== -->
  <rect x="38" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="110" y="124" text-anchor="middle" class="step">① Crear</text>
  <text x="110" y="148" text-anchor="middle" class="name">create_index</text>
  <text x="110" y="172" text-anchor="middle" class="desc">Precrea el índice y</text>
  <text x="110" y="188" text-anchor="middle" class="desc">pasa settings (mapeos ES)</text>
  <text x="110" y="204" text-anchor="middle" class="desc">validar y escapar nombre</text>
  <line x1="183" y1="166" x2="198" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="198" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="270" y="124" text-anchor="middle" class="step">② Escribir</text>
  <text x="270" y="148" text-anchor="middle" class="name">update</text>
  <text x="270" y="172" text-anchor="middle" class="desc">enrutado por doc.index</text>
  <text x="270" y="188" text-anchor="middle" class="desc">(por defecto "default")</text>
  <text x="270" y="204" text-anchor="middle" class="desc">mismo id sobrescribe;</text>
  <text x="270" y="220" text-anchor="middle" class="desc mono">update_bulk</text>
  <line x1="343" y1="166" x2="358" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="358" y="100" width="145" height="132" rx="10" class="node node-alt"/>
  <text x="430" y="124" text-anchor="middle" class="step">③ Refrescar</text>
  <text x="430" y="148" text-anchor="middle" class="name">flush</text>
  <text x="430" y="172" text-anchor="middle" class="desc">no-op: collection/SQLite</text>
  <text x="430" y="188" text-anchor="middle" class="desc">no-op: Meili/TS/Algolia</text>
  <text x="430" y="204" text-anchor="middle" class="desc">_refresh: ES</text>
  <text x="430" y="220" text-anchor="middle" class="desc">CMD_INDEX_COMMIT: XunSearch</text>
  <line x1="503" y1="166" x2="518" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="518" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="590" y="124" text-anchor="middle" class="step">④ Buscar</text>
  <text x="590" y="148" text-anchor="middle" class="name">search / paginate</text>
  <text x="590" y="172" text-anchor="middle" class="desc">query + filtro + orden</text>
  <text x="590" y="188" text-anchor="middle" class="desc">+ paginación, devuelve</text>
  <text x="590" y="204" text-anchor="middle" class="desc">SearchResult</text>
  <line x1="663" y1="166" x2="678" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="678" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="750" y="124" text-anchor="middle" class="step">⑤ Borrar docs</text>
  <text x="750" y="148" text-anchor="middle" class="name">delete · delete_in</text>
  <text x="750" y="172" text-anchor="middle" class="desc">borra por id; delete_in</text>
  <text x="750" y="188" text-anchor="middle" class="desc">limitado a un índice.</text>
  <text x="750" y="204" text-anchor="middle" class="desc mono">soft_delete_in</text>
  <line x1="823" y1="166" x2="838" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="838" y="100" width="145" height="132" rx="10" class="node node-alt"/>
  <text x="910" y="124" text-anchor="middle" class="step">⑥ Reindexar</text>
  <text x="910" y="148" text-anchor="middle" class="name">reindex</text>
  <text x="910" y="172" text-anchor="middle" class="desc">copia el índice de → a.</text>
  <text x="910" y="188" text-anchor="middle" class="desc">memoria: cambia destino</text>
  <text x="910" y="204" text-anchor="middle" class="desc">ES: fusiona con _reindex</text>
  <line x1="983" y1="166" x2="998" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="998" y="100" width="145" height="132" rx="10" class="node node-alt"/>
  <text x="1070" y="124" text-anchor="middle" class="step">⑦ Destruir</text>
  <text x="1070" y="148" text-anchor="middle" class="name">delete_index</text>
  <text x="1070" y="172" text-anchor="middle" class="desc">elimina el índice y</text>
  <text x="1070" y="188" text-anchor="middle" class="desc">todos sus datos</text>

  <!-- ==================== tabla comparativa de familias de drivers ==================== -->
  <text x="590" y="278" text-anchor="middle" class="lbl">Cómo difieren las cuatro familias de drivers en cada etapa</text>

  <rect x="60" y="292" width="130" height="32" rx="6" fill="#f1f5f9"/>
  <rect x="195" y="292" width="218" height="32" rx="6" fill="#10b981"/>
  <rect x="413" y="292" width="218" height="32" rx="6" fill="#2563eb"/>
  <rect x="631" y="292" width="218" height="32" rx="6" fill="#d97706"/>
  <rect x="849" y="292" width="218" height="32" rx="6" fill="#94a3b8"/>
  <text x="74" y="313" class="lbl">Etapa / Conducta</text>
  <text x="304" y="313" text-anchor="middle" class="hdr">CollectionEngine</text>
  <text x="522" y="313" text-anchor="middle" class="hdr">Drivers HTTP (ES, Meili, …)</text>
  <text x="740" y="313" text-anchor="middle" class="hdr">DatabaseEngine</text>
  <text x="958" y="313" text-anchor="middle" class="hdr">NullEngine</text>

  <!-- fila 1 almacenamiento -->
  <rect x="60" y="328" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="347" class="rowlb">Almacenaje</text>
  <text x="207" y="347" class="cell">HashMap en proceso</text>
  <text x="425" y="347" class="cell">clúster remoto / nube</text>
  <text x="643" y="347" class="cell">archivo SQLite</text>
  <text x="861" y="347" class="cell">sin almacenamiento</text>

  <!-- fila 2 texto completo -->
  <rect x="60" y="358" width="1007" height="30" rx="4" fill="#f8fafc"/>
  <text x="74" y="377" class="rowlb">Texto completo</text>
  <text x="207" y="377" class="cell">subcadenas serializadas</text>
  <text x="425" y="377" class="cell">sintaxis nativa</text>
  <text x="643" y="377" class="cell">prefiltro LIKE + refinado</text>
  <text x="861" y="377" class="cell">siempre vacío</text>

  <!-- fila 3 filtro / orden -->
  <rect x="60" y="388" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="407" class="rowlb">Filtro / Orden</text>
  <text x="207" y="407" class="cell">matches + sort_hits en RAM</text>
  <text x="425" y="407" class="cell">push de term / terms / sort</text>
  <text x="643" y="407" class="cell">total = hits.len()</text>
  <text x="861" y="407" class="cell">ninguno</text>

  <!-- fila 4 flush -->
  <rect x="60" y="418" width="1007" height="30" rx="4" fill="#f8fafc"/>
  <text x="74" y="437" class="rowlb">flush</text>
  <text x="207" y="437" class="cell">no-op (escritura visible)</text>
  <text x="425" y="437" class="cell">ES: _refresh / others: no-op</text>
  <text x="643" y="437" class="cell">no-op</text>
  <text x="861" y="437" class="cell">no-op</text>

  <!-- fila 5 paginación por defecto -->
  <rect x="60" y="448" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="467" class="rowlb">Paginación por def.</text>
  <text x="207" y="467" class="cell">todo, ordenado por id</text>
  <text x="425" y="467" class="cell">size 10, orden _score</text>
  <text x="643" y="467" class="cell">todo, ordenado por id</text>
  <text x="861" y="467" class="cell">ninguno</text>

  <!-- fila 6 semántica de delete -->
  <rect x="60" y="478" width="1007" height="30" rx="4" fill="#f8fafc"/>
  <text x="74" y="497" class="rowlb">semántica delete</text>
  <text x="207" y="497" class="cell">borra en todos</text>
  <text x="425" y="497" class="cell">solo índice default (delete_in)</text>
  <text x="643" y="497" class="cell">por id, todos los índices</text>
  <text x="861" y="497" class="cell">no-op</text>

  <!-- fila 7 borrado lógico -->
  <rect x="60" y="508" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="527" class="rowlb">soft_delete</text>
  <text x="207" y="527" class="cell">sí (marca flag)</text>
  <text x="425" y="527" class="cell">sí (soft_delete_in)</text>
  <text x="643" y="527" class="cell">sí (filtro 3 estados)</text>
  <text x="861" y="527" class="cell">no</text>

  <!-- ==================== ruta de error ==================== -->
  <text x="60" y="554" class="desc">XunSearch no pertenece a las cuatro familias: su flush es CMD_INDEX_COMMIT (commit a disco), no un no-op.</text>
  <rect x="60" y="562" width="1007" height="58" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="74" y="584" class="lbl">Ruta de error — todo converge a crate::Result&lt;T&gt;</text>
  <text x="74" y="606" class="cell mono">InvalidIndexName · InvalidResult · Unsupported · Json · Http · Sqlx · Backend · XunSearch · XunSearchIo</text>
</svg>
