<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 13px; fill: #64748b; }
      .node  { fill: #ffffff; stroke: #2563eb; stroke-width: 1.6; rx: 10; }
      .node-alt { stroke: #f59e0b; }
      .step  { font-size: 12px; font-weight: 600; fill: #2563eb; }
      .name  { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .desc  { font-size: 10.5px; fill: #475569; }
      .hdr   { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .hdr-a { fill: #2563eb; }
      .hdr-b { fill: #10b981; }
      .cell  { font-size: 11.5px; fill: #334155; }
      .lbl   { font-size: 12px; fill: #64748b; font-weight: 600; }
    </style>
  </defs>

  <text x="550" y="42" text-anchor="middle" class="title">Ciclo de vida del índice y los documentos</text>
  <text x="550" y="66" text-anchor="middle" class="sub">Seis etapas cubren todo el recorrido del índice — independiente del motor, semántica unificada</text>

  <!-- 节点 1 -->
  <rect x="30" y="100" width="160" height="120" class="node"/>
  <text x="110" y="124" text-anchor="middle" class="step">① Creación</text>
  <text x="110" y="148" text-anchor="middle" class="name">create_index</text>
  <text x="110" y="170" text-anchor="middle" class="desc">Precrear el índice con</text>
  <text x="110" y="186" text-anchor="middle" class="desc">settings (mapping de ES, etc.)</text>
  <text x="110" y="202" text-anchor="middle" class="desc">Validación del nombre de índice + escape</text>
  <line x1="190" y1="160" x2="220" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 节点 2 -->
  <rect x="220" y="100" width="160" height="120" class="node"/>
  <text x="300" y="124" text-anchor="middle" class="step">② Escritura</text>
  <text x="300" y="148" text-anchor="middle" class="name">update</text>
  <text x="300" y="170" text-anchor="middle" class="desc">Indexación por lotes,</text>
  <text x="300" y="186" text-anchor="middle" class="desc">enrutamiento según doc.index (por defecto</text>
  <text x="300" y="202" text-anchor="middle" class="desc">"default"), misma id sobrescribe</text>
  <line x1="380" y1="160" x2="410" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 节点 3 -->
  <rect x="410" y="100" width="160" height="120" class="node node-alt"/>
  <text x="490" y="124" text-anchor="middle" class="step">③ Actualización</text>
  <text x="490" y="148" text-anchor="middle" class="name">flush</text>
  <text x="490" y="170" text-anchor="middle" class="desc">Motor en memoria: no-op;</text>
  <text x="490" y="186" text-anchor="middle" class="desc">motor ES: _refresh</text>
  <text x="490" y="202" text-anchor="middle" class="desc">(garantiza la visibilidad)</text>
  <line x1="570" y1="160" x2="600" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 节点 4 -->
  <rect x="600" y="100" width="160" height="120" class="node"/>
  <text x="680" y="124" text-anchor="middle" class="step">④ Búsqueda</text>
  <text x="680" y="148" text-anchor="middle" class="name">search / paginate</text>
  <text x="680" y="170" text-anchor="middle" class="desc">query + filtros + ordenación</text>
  <text x="680" y="186" text-anchor="middle" class="desc">+ paginación, devuelve</text>
  <text x="680" y="202" text-anchor="middle" class="desc">SearchResult</text>
  <line x1="760" y1="160" x2="790" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 节点 5 -->
  <rect x="790" y="100" width="160" height="120" class="node"/>
  <text x="870" y="124" text-anchor="middle" class="step">⑤ Eliminación</text>
  <text x="870" y="148" text-anchor="middle" class="name">delete</text>
  <text x="870" y="170" text-anchor="middle" class="desc">Elimina documentos por id,</text>
  <text x="870" y="186" text-anchor="middle" class="desc">el motor en memoria limpia en todos los índices,</text>
  <text x="870" y="202" text-anchor="middle" class="desc">el motor ES elimina por id</text>
  <line x1="950" y1="160" x2="980" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- 节点 6 -->
  <rect x="980" y="100" width="100" height="120" class="node node-alt"/>
  <text x="1030" y="124" text-anchor="middle" class="step">⑥ Destrucción</text>
  <text x="1030" y="148" text-anchor="middle" class="name">delete_index</text>
  <text x="1030" y="170" text-anchor="middle" class="desc">Eliminación definitiva</text>
  <text x="1030" y="186" text-anchor="middle" class="desc">del índice y sus datos</text>

  <!-- 对照表 -->
  <text x="550" y="260" text-anchor="middle" class="lbl">Comparativa de comportamiento de los dos motores</text>
  <rect x="60" y="272" width="490" height="30" rx="6" class="hdr hdr-a"/>
  <rect x="550" y="272" width="490" height="30" rx="6" class="hdr hdr-b"/>
  <text x="305" y="292" text-anchor="middle" class="hdr">CollectionEngine (predeterminado · memoria)</text>
  <text x="795" y="292" text-anchor="middle" class="hdr">ElasticsearchEngine (feature)</text>

  <rect x="60" y="302" width="490" height="26" rx="4" fill="#eff6ff"/>
  <rect x="550" y="302" width="490" height="26" rx="4" fill="#ecfdf5"/>
  <text x="75" y="320" class="cell">Almacenamiento: HashMap&lt;index, docs&gt; en el proceso, protegido con Mutex</text>
  <text x="565" y="320" class="cell">Almacenamiento: clúster ES / OpenSearch, REST + JSON</text>

  <rect x="60" y="328" width="490" height="26" rx="4" fill="#ffffff"/>
  <rect x="550" y="328" width="490" height="26" rx="4" fill="#ffffff"/>
  <text x="75" y="346" class="cell">Texto completo: subcadenas de campos serializados (sin distinguir mayúsculas)</text>
  <text x="565" y="346" class="cell">Texto completo: sintaxis query_string (campo:valor, etc.)</text>

  <rect x="60" y="354" width="490" height="26" rx="4" fill="#eff6ff"/>
  <rect x="550" y="354" width="490" height="26" rx="4" fill="#ecfdf5"/>
  <text x="75" y="372" class="cell">Filtrado/ordenación: matches() + sort_hits() en memoria</text>
  <text x="565" y="372" class="cell">Filtrado/ordenación: term/terms/must_not + array sort</text>

  <rect x="60" y="380" width="490" height="26" rx="4" fill="#ffffff"/>
  <rect x="550" y="380" width="490" height="26" rx="4" fill="#ffffff"/>
  <text x="75" y="398" class="cell">flush: no-op (las escrituras son visibles al instante)</text>
  <text x="565" y="398" class="cell">flush: POST _refresh (las escrituras quedan buscables)</text>

  <rect x="60" y="406" width="490" height="26" rx="4" fill="#eff6ff"/>
  <rect x="550" y="406" width="490" height="26" rx="4" fill="#ecfdf5"/>
  <text x="75" y="424" class="cell">Paginación por defecto: todos los resultados; ordenación por defecto: por id</text>
  <text x="565" y="424" class="cell">Paginación por defecto: size 10; ordenación por defecto: _score</text>

  <rect x="60" y="432" width="490" height="26" rx="4" fill="#ffffff"/>
  <rect x="550" y="432" width="490" height="26" rx="4" fill="#ffffff"/>
  <text x="75" y="450" class="cell">Errores: solo capa de memoria/JSON (protección anti-poison)</text>
  <text x="565" y="450" class="cell">Errores: errores HTTP / de backend se transmiten tal cual</text>

  <!-- 错误路径 -->
  <text x="550" y="500" text-anchor="middle" class="lbl">Rutas de error (ScoutError unificado)</text>
  <text x="550" y="522" text-anchor="middle" class="cell">InvalidIndexName · InvalidResult · Unsupported · Json · Http · Backend — todo converge en crate::Result&lt;T&gt;</text>
</svg>
