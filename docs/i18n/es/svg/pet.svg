<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="petTitle petDesc">
  <title id="petTitle">Mascota del proyecto rust-scout: Scout el Robot de Búsqueda</title>
  <desc id="petDesc">Un pequeño robot de búsqueda. Cabeza cuadrada de esquinas redondeadas, visera oscura con dos ojos redondos azules y un arco de sonrisa debajo; una antena en lo alto con una lámpara indicadora ámbar, y un remache redondo en cada mejilla. Torso blanco de esquinas redondeadas, dos piernas gruesas, dos pies redondos, de pie sobre una sombra en el suelo. Todo el pecho es la bahía de módulos: ocho zócalos oscuros en una cuadrícula 4×2, el de arriba a la derecha vacío —con un contorno ámbar discontinuo de colocación dentro— y los otros siete con un módulo de distinto color cada uno: azul oscuro, verde, azul claro, azul medio, gris, ámbar pálido, azul. Un módulo ámbar flota justo fuera del zócalo vacío, ligeramente inclinado, con dos líneas de velocidad detrás y un arco discontinuo que se curva desde él hacia el zócalo: está entrando ahora mismo. El zócalo verde a la izquierda del vacío lleva un anillo luminoso verde: es el driver que coincidió con esta consulta. El brazo izquierdo cuelga sosteniendo una tarjeta de consulta cuyas cuatro líneas son el SearchBuilder encadenado, con la segunda línea marcada en azul de marca; el brazo derecho cuelga al costado, con la palma abierta hacia el panel de resultados. A la derecha del cuadro, un panel de resultados enumera cuatro aciertos, uno resaltado en verde, con una insignia de marca de verificación verde en su esquina superior derecha. Abajo, la placa con el nombre: Scout · Robot de Búsqueda.</desc>

  <defs>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 12.5px; fill: #64748b; }

      /* 机器人配色：白色/浅灰外壳 + 石板灰描边，与架构图同一套灰阶，不引入第二套色板 */
      .body  { fill: #ffffff; stroke: #64748b; stroke-width: 3; }
      .plate { fill: #e2e8f0; stroke: #64748b; stroke-width: 2.6; stroke-linejoin: round; }
      .part  { fill: #cbd5e1; stroke: #64748b; stroke-width: 2.4; }
      .visor { fill: #0f172a; }
      .eye   { fill: #60a5fa; }
      .lamp  { fill: #f59e0b; stroke: #64748b; stroke-width: 2.2; }

      /* 手臂：两笔描边套出「浅灰管 + 石板灰轮廓」的效果 */
      .limb-o { fill: none; stroke: #64748b; stroke-width: 17; stroke-linecap: round; }
      .limb-i { fill: none; stroke: #cbd5e1; stroke-width: 12; stroke-linecap: round; }

      /* 模块舱：浅色舱板 + 深色插槽，槽里嵌一枚彩色模块 */
      .bay    { fill: #e2e8f0; stroke: #64748b; stroke-width: 2.4; }
      .socket { fill: #0f172a; }
      .glow   { fill: #10b981; opacity: 0.16; }
      .ring   { fill: none; stroke: #10b981; stroke-width: 2.4; opacity: 0.6; }
      .chip-mark { fill: #ffffff; opacity: 0.75; }

      /* 正在插入的那一枚：空槽里的落位虚线框 + 飞行虚线弧 + 速度线，同色 */
      .slot-empty { fill: none; stroke: #f59e0b; stroke-width: 1.8; stroke-dasharray: 3.5 3; opacity: 0.85; }
      .arc  { fill: none; stroke: #f59e0b; stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 5 4.5; }
      .tick { fill: none; stroke: #f59e0b; stroke-width: 2.4; stroke-linecap: round; }
      .wire { fill: none; stroke: #64748b; stroke-width: 3; stroke-linecap: round; }

      /* 查询卡片 / 结果面板 */
      .card   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .card-h { fill: #cbd5e1; }
      .cl     { fill: #e2e8f0; }
      .cl-hi  { fill: #2563eb; }
      .cl-ok  { fill: #10b981; }
      .badge  { fill: #10b981; }

      .name  { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .role  { font-size: 11.5px; fill: #64748b; }
    </style>

    <!-- 一枚模块：一个形状复用九次，颜色由 <use> 自己的 fill 决定 -->
    <g id="chip">
      <rect x="-12" y="-12" width="24" height="24" rx="5"/>
      <rect class="chip-mark" x="-7" y="-7.5" width="14" height="4" rx="2"/>
    </g>
  </defs>

  <text x="280" y="38" text-anchor="middle" class="title">rust-scout: el Robot de Búsqueda</text>
  <text x="280" y="60" text-anchor="middle" class="sub">Robot de búsqueda Scout · ocho ranuras, la que conectes, código sin cambios</text>

  <!-- ============ 地面投影 ============ -->
  <ellipse cx="250" cy="374" rx="120" ry="8" fill="#64748b" opacity="0.10"/>

  <!-- ============ 机器人（局部坐标即画布坐标，脚底 y≈372） ============ -->

  <!-- 两条腿与脚掌：先画，再被躯干压住上沿 -->
  <g class="plate">
    <rect x="202" y="320" width="32" height="40" rx="14"/>
    <rect x="266" y="320" width="32" height="40" rx="14"/>
  </g>
  <g class="part">
    <rect x="194" y="352" width="48" height="20" rx="10"/>
    <rect x="258" y="352" width="48" height="20" rx="10"/>
  </g>

  <!-- 脖子：藏在躯干与脑袋之间 -->
  <rect x="232" y="194" width="36" height="26" rx="9" class="part"/>

  <!-- 躯干 -->
  <rect x="158" y="214" width="184" height="120" rx="30" class="body"/>

  <!-- 模块舱：整块胸膛就是一排插槽 —— 全图的重点 -->
  <rect x="169" y="229" width="162" height="92" rx="15" class="bay"/>

  <!-- 亮着的那个槽（进程内驱动命中）：先铺光晕，再把插槽压在光晕上 -->
  <rect x="210" y="235" width="42" height="42" rx="13" class="glow"/>
  <rect x="210" y="235" width="42" height="42" rx="13" class="ring"/>

  <!-- 八个插槽：4×2。右上角那个（292,241）空着，等着飞进来的那一枚 -->
  <g class="socket">
    <rect x="178" y="241" width="30" height="30" rx="7"/>
    <rect x="216" y="241" width="30" height="30" rx="7"/>
    <rect x="254" y="241" width="30" height="30" rx="7"/>
    <rect x="292" y="241" width="30" height="30" rx="7"/>
    <rect x="178" y="279" width="30" height="30" rx="7"/>
    <rect x="216" y="279" width="30" height="30" rx="7"/>
    <rect x="254" y="279" width="30" height="30" rx="7"/>
    <rect x="292" y="279" width="30" height="30" rx="7"/>
  </g>

  <!-- 右上角空槽里的落位虚线框：飞行中的那一枚就是落进这里 -->
  <rect x="295" y="244" width="24" height="24" rx="5" class="slot-empty"/>

  <!-- 七个已插入的模块 -->
  <use href="#chip" transform="translate(193,256)" fill="#2563eb"/>
  <use href="#chip" transform="translate(231,256)" fill="#10b981"/>
  <use href="#chip" transform="translate(269,256)" fill="#93c5fd"/>
  <use href="#chip" transform="translate(193,294)" fill="#60a5fa"/>
  <use href="#chip" transform="translate(231,294)" fill="#94a3b8"/>
  <use href="#chip" transform="translate(269,294)" fill="#fde68a"/>
  <use href="#chip" transform="translate(307,294)" fill="#3b82f6"/>

  <!-- ============ 脑袋 ============ -->
  <!-- 天线 -->
  <path class="wire" d="M 250,118 L 250,96"/>
  <circle cx="250" cy="90" r="7" class="lamp"/>

  <rect x="186" y="118" width="128" height="84" rx="30" class="body"/>

  <!-- 两颊的耳栓 -->
  <circle cx="183" cy="152" r="9" class="part"/>
  <circle cx="317" cy="152" r="9" class="part"/>

  <!-- 面罩 + 两只眼 + 微笑 -->
  <rect x="200" y="142" width="100" height="34" rx="17" class="visor"/>
  <circle cx="226" cy="159" r="7.5" class="eye"/>
  <circle cx="274" cy="159" r="7.5" class="eye"/>
  <circle cx="223.5" cy="156.5" r="2.4" fill="#ffffff" opacity="0.85"/>
  <circle cx="271.5" cy="156.5" r="2.4" fill="#ffffff" opacity="0.85"/>
  <path d="M 238,186 Q 250,195 262,186" fill="none" stroke="#64748b" stroke-width="2.6" stroke-linecap="round"/>

  <!-- ============ 手臂与手 ============ -->
  <!-- 左臂：垂下去托查询卡片 -->
  <path class="limb-o" d="M 170,246 L 146,296"/>
  <path class="limb-i" d="M 170,246 L 146,296"/>
  <!-- 右臂：垂在体侧，手掌摊向结果面板 —— 别挡住那条飞行弧线 -->
  <path class="limb-o" d="M 332,246 L 370,300"/>
  <path class="limb-i" d="M 332,246 L 370,300"/>

  <!-- ============ 查询卡片：链式 SearchBuilder，第二行是当前那一步 ============ -->
  <rect x="22" y="284" width="120" height="76" rx="9" class="card"/>
  <rect x="32" y="296" width="46" height="6" rx="3" class="card-h"/>
  <rect x="32" y="310" width="88" height="4.5" rx="2.25" class="cl"/>
  <rect x="32" y="320" width="76" height="4.5" rx="2.25" class="cl-hi"/>
  <rect x="32" y="330" width="94" height="4.5" rx="2.25" class="cl"/>
  <rect x="32" y="340" width="62" height="4.5" rx="2.25" class="cl"/>

  <circle cx="143" cy="300" r="11" class="part"/>
  <circle cx="372" cy="304" r="11" class="part"/>

  <!-- ============ 正在插入的那一枚琥珀色模块 ============
       悬在右上角空槽的外侧、带一点倾角：身后两道速度线，左下拖出一条
       虚线弧直接弯进空槽，槽里留着它的落位虚线框 —— 这一枚正在插入。 -->
  <path class="tick" d="M 366,182 L 374,171" opacity="0.55"/>
  <path class="tick" d="M 371,190 L 379,179" opacity="0.35"/>

  <use href="#chip" transform="translate(350,202) rotate(-14)" fill="#f59e0b"/>

  <path class="arc" d="M 342,220 Q 316,222 310,240"/>

  <!-- ============ 结果面板 ============ -->
  <rect x="384" y="254" width="150" height="88" rx="11" class="card"/>
  <rect x="396" y="270" width="54" height="6" rx="3" class="card-h"/>
  <rect x="396" y="285" width="112" height="5" rx="2.5" class="cl"/>
  <rect x="396" y="297" width="104" height="5" rx="2.5" class="cl-ok"/>
  <rect x="396" y="309" width="118" height="5" rx="2.5" class="cl"/>
  <rect x="396" y="321" width="82" height="5" rx="2.5" class="cl"/>

  <circle cx="528" cy="258" r="13" class="badge"/>
  <path d="M 521.5,258 L 526.4,264 L 535.6,252" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ============ 名牌：八个小方格，右上角那个空着，和胸前一样 ============ -->
  <rect x="136" y="402" width="228" height="44" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <g>
    <rect x="149" y="416" width="7" height="7" rx="2" fill="#2563eb"/>
    <rect x="158" y="416" width="7" height="7" rx="2" fill="#10b981"/>
    <rect x="167" y="416" width="7" height="7" rx="2" fill="#93c5fd"/>
    <rect x="176" y="416" width="7" height="7" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
    <rect x="149" y="425" width="7" height="7" rx="2" fill="#60a5fa"/>
    <rect x="158" y="425" width="7" height="7" rx="2" fill="#94a3b8"/>
    <rect x="167" y="425" width="7" height="7" rx="2" fill="#fde68a"/>
    <rect x="176" y="425" width="7" height="7" rx="2" fill="#3b82f6"/>
  </g>
  <text x="198" y="420" class="name">Scout</text>
  <text x="198" y="437" class="role">Robot de búsqueda</text>
</svg>
