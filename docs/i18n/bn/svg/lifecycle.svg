<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 13px; fill: #64748b; }
      .node  { fill: #ffffff; stroke: #2563eb; stroke-width: 1.6; rx: 10; }
      .node-alt { stroke: #f59e0b; }
      .step  { font-size: 12px; font-weight: 600; fill: #2563eb; }
      .name  { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .desc  { font-size: 10.5px; fill: #475569; }
      .hdr   { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .hdr-a { fill: #2563eb; }
      .hdr-b { fill: #10b981; }
      .cell  { font-size: 11.5px; fill: #334155; }
      .lbl   { font-size: 12px; fill: #64748b; font-weight: 600; }
    </style>
  </defs>

  <text x="550" y="42" text-anchor="middle" class="title">ইনডেক্স ও ডকুমেন্ট লাইফসাইকেল</text>
  <text x="550" y="66" text-anchor="middle" class="sub">ছয়টি ধাপ ইনডেক্সের তৈরি থেকে ধ্বংস পর্যন্ত পুরো যাত্রা কভার করে — ড্রাইভার-নির্ভর নয়, ইউনিফাইড সেমান্টিক্স</text>

  <!-- নোড 1 -->
  <rect x="30" y="100" width="160" height="120" class="node"/>
  <text x="110" y="124" text-anchor="middle" class="step">① তৈরি</text>
  <text x="110" y="148" text-anchor="middle" class="name">create_index</text>
  <text x="110" y="170" text-anchor="middle" class="desc">আগে থেকে ইনডেক্স তৈরি</text>
  <text x="110" y="186" text-anchor="middle" class="desc">করে settings দেয় (ES mapping ইত্যাদি)</text>
  <text x="110" y="202" text-anchor="middle" class="desc">নাম যাচাই + এস্কেপিং</text>
  <line x1="190" y1="160" x2="220" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- নোড 2 -->
  <rect x="220" y="100" width="160" height="120" class="node"/>
  <text x="300" y="124" text-anchor="middle" class="step">② লেখা</text>
  <text x="300" y="148" text-anchor="middle" class="name">update</text>
  <text x="300" y="170" text-anchor="middle" class="desc">ব্যাচে ডকুমেন্ট ইনডেক্স,</text>
  <text x="300" y="186" text-anchor="middle" class="desc">doc.index দিয়ে রাউট (ডিফল্ট</text>
  <text x="300" y="202" text-anchor="middle" class="desc">"default"), একই id ওভাররাইট</text>
  <line x1="380" y1="160" x2="410" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- নোড 3 -->
  <rect x="410" y="100" width="160" height="120" class="node node-alt"/>
  <text x="490" y="124" text-anchor="middle" class="step">③ রিফ্রেশ</text>
  <text x="490" y="148" text-anchor="middle" class="name">flush</text>
  <text x="490" y="170" text-anchor="middle" class="desc">ইন-মেমোরি: no-op;</text>
  <text x="490" y="186" text-anchor="middle" class="desc">ES ড্রাইভার: _refresh</text>
  <text x="490" y="202" text-anchor="middle" class="desc">(দৃশ্যমানতা নিশ্চিত করে)</text>
  <line x1="570" y1="160" x2="600" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- নোড 4 -->
  <rect x="600" y="100" width="160" height="120" class="node"/>
  <text x="680" y="124" text-anchor="middle" class="step">④ কোয়েরি</text>
  <text x="680" y="148" text-anchor="middle" class="name">search / paginate</text>
  <text x="680" y="170" text-anchor="middle" class="desc">কোয়েরি + ফিল্টার + সর্ট</text>
  <text x="680" y="186" text-anchor="middle" class="desc">+ পেজিনেশন, রিটার্ন করে</text>
  <text x="680" y="202" text-anchor="middle" class="desc">SearchResult</text>
  <line x1="760" y1="160" x2="790" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- নোড 5 -->
  <rect x="790" y="100" width="160" height="120" class="node"/>
  <text x="870" y="124" text-anchor="middle" class="step">⑤ মুছুন</text>
  <text x="870" y="148" text-anchor="middle" class="name">delete</text>
  <text x="870" y="170" text-anchor="middle" class="desc">id দিয়ে ডকুমেন্ট মুছে;</text>
  <text x="870" y="186" text-anchor="middle" class="desc">ইন-মেমোরি সব ইনডেক্সে ক্লিন,</text>
  <text x="870" y="202" text-anchor="middle" class="desc">ES id দিয়ে মুছে</text>
  <line x1="950" y1="160" x2="980" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- নোড 6 -->
  <rect x="980" y="100" width="100" height="120" class="node node-alt"/>
  <text x="1030" y="124" text-anchor="middle" class="step">⑥ ধ্বংস</text>
  <text x="1030" y="148" text-anchor="middle" class="name">delete_index</text>
  <text x="1030" y="170" text-anchor="middle" class="desc">ইনডেক্স ও ডেটা</text>
  <text x="1030" y="186" text-anchor="middle" class="desc">সম্পূর্ণ মুছে ফেলে</text>

  <!-- তুলনা টেবিল -->
  <text x="550" y="260" text-anchor="middle" class="lbl">দুই ড্রাইভারের আচরণের তুলনা</text>
  <rect x="60" y="272" width="490" height="30" rx="6" class="hdr hdr-a"/>
  <rect x="550" y="272" width="490" height="30" rx="6" class="hdr hdr-b"/>
  <text x="305" y="292" text-anchor="middle" class="hdr">CollectionEngine (ডিফল্ট · মেমোরি)</text>
  <text x="795" y="292" text-anchor="middle" class="hdr">ElasticsearchEngine (feature)</text>

  <rect x="60" y="302" width="490" height="26" rx="4" fill="#eff6ff"/>
  <rect x="550" y="302" width="490" height="26" rx="4" fill="#ecfdf5"/>
  <text x="75" y="320" class="cell">স্টোরেজ: ইন-প্রসেস HashMap&lt;index, docs&gt;, Mutex-সুরক্ষিত</text>
  <text x="565" y="320" class="cell">স্টোরেজ: ES / OpenSearch ক্লাস্টার, REST + JSON</text>

  <rect x="60" y="328" width="490" height="26" rx="4" fill="#ffffff"/>
  <rect x="550" y="328" width="490" height="26" rx="4" fill="#ffffff"/>
  <text x="75" y="346" class="cell">পূর্ণ-পাঠ্য: ফিল্ড সিরিয়ালাইজড সাবস্ট্রিং ম্যাচিং (কেস-ইনসেনসিটিভ)</text>
  <text x="565" y="346" class="cell">পূর্ণ-পাঠ্য: query_string সিনট্যাক্স (ফিল্ড_নাম:ভ্যালু ইত্যাদি)</text>

  <rect x="60" y="354" width="490" height="26" rx="4" fill="#eff6ff"/>
  <rect x="550" y="354" width="490" height="26" rx="4" fill="#ecfdf5"/>
  <text x="75" y="372" class="cell">ফিল্টার/সর্ট: মেমোরিতে matches() + sort_hits()</text>
  <text x="565" y="372" class="cell">ফিল্টার/সর্ট: term/terms/must_not + sort অ্যারে</text>

  <rect x="60" y="380" width="490" height="26" rx="4" fill="#ffffff"/>
  <rect x="550" y="380" width="490" height="26" rx="4" fill="#ffffff"/>
  <text x="75" y="398" class="cell">flush: no-op (লেখা সাথে সাথে দৃশ্যমান)</text>
  <text x="565" y="398" class="cell">flush: POST _refresh (লেখা অনুসন্ধানযোগ্য করে)</text>

  <rect x="60" y="406" width="490" height="26" rx="4" fill="#eff6ff"/>
  <rect x="550" y="406" width="490" height="26" rx="4" fill="#ecfdf5"/>
  <text x="75" y="424" class="cell">ডিফল্ট পেজিনেশন: সব; ডিফল্ট সর্ট: id দিয়ে</text>
  <text x="565" y="424" class="cell">ডিফল্ট পেজিনেশন: size 10; ডিফল্ট সর্ট: _score</text>

  <rect x="60" y="432" width="490" height="26" rx="4" fill="#ffffff"/>
  <rect x="550" y="432" width="490" height="26" rx="4" fill="#ffffff"/>
  <text x="75" y="450" class="cell">এরর: শুধু মেমোরি/JSON স্তর (poison সুরক্ষা)</text>
  <text x="565" y="450" class="cell">এরর: HTTP / ব্যাকএন্ড এরর যেমন আছে তেমন পাস</text>

  <!-- এরর পাথ -->
  <text x="550" y="500" text-anchor="middle" class="lbl">এরর পাথ (ইউনিফাইড ScoutError)</text>
  <text x="550" y="522" text-anchor="middle" class="cell">InvalidIndexName · InvalidResult · Unsupported · Json · Http · Backend — সবগুলো crate::Result&lt;T&gt;-এ মিলিত হয়</text>
</svg>
