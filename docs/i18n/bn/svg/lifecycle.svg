<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="lifeTitle">
  <title id="lifeTitle">ইনডেক্স ও নথির জীবনচক্র: তৈরি / লেখা / রিফ্রেশ / কোয়েরি / মোছা / পুনর্নির্মাণ / ধ্বংস</title>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 13px; fill: #64748b; }
      .node  { fill: #ffffff; stroke: #2563eb; stroke-width: 1.6; }
      .node-alt { stroke: #f59e0b; }
      .step  { font-size: 11.5px; font-weight: 600; fill: #2563eb; }
      .name  { font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .desc  { font-size: 10px; fill: #475569; }
      .hdr   { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
      .cell  { font-size: 10.5px; fill: #334155; }
      .rowlb { font-size: 11px; font-weight: 600; fill: #0f172a; }
      .lbl   { font-size: 12px; fill: #64748b; font-weight: 600; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <text x="590" y="42" text-anchor="middle" class="title">ইনডেক্স ও নথির জীবনচক্র</text>
  <text x="590" y="66" text-anchor="middle" class="sub">সাত পর্যায়: ইনডেক্সের জন্ম থেকে ধ্বংস পর্যন্ত পুরো যাত্রা — ড্রাইভার-নিরপেক্ষ, একই অর্থ</text>

  <!-- ==================== জীবনচক্র প্রবাহ ==================== -->
  <rect x="38" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="110" y="124" text-anchor="middle" class="step">① তৈরি</text>
  <text x="110" y="148" text-anchor="middle" class="name">create_index</text>
  <text x="110" y="172" text-anchor="middle" class="desc">আগে ইনডেক্স গড়ুন,</text>
  <text x="110" y="188" text-anchor="middle" class="desc">settings দিন (ES mapping)</text>
  <text x="110" y="204" text-anchor="middle" class="desc">নাম যাচাই + এস্কেপ</text>
  <line x1="183" y1="166" x2="198" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="198" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="270" y="124" text-anchor="middle" class="step">② লেখা</text>
  <text x="270" y="148" text-anchor="middle" class="name">update</text>
  <text x="270" y="172" text-anchor="middle" class="desc">doc.index থেকে রাউটিং</text>
  <text x="270" y="188" text-anchor="middle" class="desc">(ডিফল্ট "default")</text>
  <text x="270" y="204" text-anchor="middle" class="desc">একই id ওভাররাইট;</text>
  <text x="270" y="220" text-anchor="middle" class="desc mono">update_bulk</text>
  <line x1="343" y1="166" x2="358" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="358" y="100" width="145" height="132" rx="10" class="node node-alt"/>
  <text x="430" y="124" text-anchor="middle" class="step">③ রিফ্রেশ</text>
  <text x="430" y="148" text-anchor="middle" class="name">flush</text>
  <text x="430" y="172" text-anchor="middle" class="desc">মেমোরি / SQLite: no-op</text>
  <text x="430" y="188" text-anchor="middle" class="desc">HTTP ব্যাকএন্ড: _refresh</text>
  <text x="430" y="204" text-anchor="middle" class="desc">লেখার পরে দৃশ্যমান</text>
  <line x1="503" y1="166" x2="518" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="518" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="590" y="124" text-anchor="middle" class="step">④ কোয়েরি</text>
  <text x="590" y="148" text-anchor="middle" class="name">search / paginate</text>
  <text x="590" y="172" text-anchor="middle" class="desc">query + ফিল্টার + সাজানো</text>
  <text x="590" y="188" text-anchor="middle" class="desc">+ পেজিনেশন, ফেরে</text>
  <text x="590" y="204" text-anchor="middle" class="desc">SearchResult</text>
  <line x1="663" y1="166" x2="678" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="678" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="750" y="124" text-anchor="middle" class="step">⑤ নথি মোছা</text>
  <text x="750" y="148" text-anchor="middle" class="name">delete · delete_in</text>
  <text x="750" y="172" text-anchor="middle" class="desc">id দিয়ে মোছা; delete_in</text>
  <text x="750" y="188" text-anchor="middle" class="desc">এক ইনডেক্সে। সফট</text>
  <text x="750" y="204" text-anchor="middle" class="desc mono">soft_delete: নিচে দেখুন</text>
  <line x1="823" y1="166" x2="838" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="838" y="100" width="145" height="132" rx="10" class="node node-alt"/>
  <text x="910" y="124" text-anchor="middle" class="step">⑥ পুনর্নির্মাণ</text>
  <text x="910" y="148" text-anchor="middle" class="name">reindex</text>
  <text x="910" y="172" text-anchor="middle" class="desc">from ইনডেক্স → to কপি।</text>
  <text x="910" y="188" text-anchor="middle" class="desc">মেমোরি: লক্ষ্য বদলায়</text>
  <text x="910" y="204" text-anchor="middle" class="desc">ES: _reindex দিয়ে মার্জ</text>
  <line x1="983" y1="166" x2="998" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="998" y="100" width="145" height="132" rx="10" class="node node-alt"/>
  <text x="1070" y="124" text-anchor="middle" class="step">⑦ ধ্বংস</text>
  <text x="1070" y="148" text-anchor="middle" class="name">delete_index</text>
  <text x="1070" y="172" text-anchor="middle" class="desc">ইনডেক্স পুরোপুরি</text>
  <text x="1070" y="188" text-anchor="middle" class="desc">ও তার সব ডেটা</text>

  <!-- ==================== ড্রাইভার দল তুলনা ==================== -->
  <text x="590" y="278" text-anchor="middle" class="lbl">চার ড্রাইভার দল প্রতিটি পর্যায়ে কেমন আলাদা</text>

  <rect x="60" y="292" width="130" height="32" rx="6" fill="#f1f5f9"/>
  <rect x="195" y="292" width="218" height="32" rx="6" fill="#10b981"/>
  <rect x="413" y="292" width="218" height="32" rx="6" fill="#2563eb"/>
  <rect x="631" y="292" width="218" height="32" rx="6" fill="#d97706"/>
  <rect x="849" y="292" width="218" height="32" rx="6" fill="#94a3b8"/>
  <text x="74" y="313" class="lbl">পর্যায় / আচরণ</text>
  <text x="304" y="313" text-anchor="middle" class="hdr">CollectionEngine</text>
  <text x="522" y="313" text-anchor="middle" class="hdr">HTTP ব্যাকএন্ড (ES, Meili, …)</text>
  <text x="740" y="313" text-anchor="middle" class="hdr">DatabaseEngine</text>
  <text x="958" y="313" text-anchor="middle" class="hdr">NullEngine</text>

  <!-- সারি ১: স্টোরেজ -->
  <rect x="60" y="328" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="347" class="rowlb">স্টোরেজ</text>
  <text x="207" y="347" class="cell">প্রসেসের ভিতরে HashMap</text>
  <text x="425" y="347" class="cell">দূরের ক্লাস্টার / ক্লাউড</text>
  <text x="643" y="347" class="cell">SQLite ফাইল</text>
  <text x="861" y="347" class="cell">কোনো স্টোরেজ নেই</text>

  <!-- সারি ২: পূর্ণ-পাঠ্য -->
  <rect x="60" y="358" width="1007" height="30" rx="4" fill="#f8fafc"/>
  <text x="74" y="377" class="rowlb">পূর্ণ-পাঠ্য</text>
  <text x="207" y="377" class="cell">সিরিয়ালাইজড সাবস্ট্রিং মিল</text>
  <text x="425" y="377" class="cell">ব্যাকএন্ডের নিজস্ব সিনট্যাক্স</text>
  <text x="643" y="377" class="cell">LIKE মোটা + ইন-মেমোরি সূক্ষ্ম</text>
  <text x="861" y="377" class="cell">সর্বদা খালি ফলাফল</text>

  <!-- সারি ৩: ফিল্টার ও সাজানো -->
  <rect x="60" y="388" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="407" class="rowlb">ফিল্টার / সাজানো</text>
  <text x="207" y="407" class="cell">ইন-মেমোরি matches + sort_hits</text>
  <text x="425" y="407" class="cell">term / terms / sort পাঠায়</text>
  <text x="643" y="407" class="cell">ইন-মেমোরি ফিল্টার (total SQL থেকে)</text>
  <text x="861" y="407" class="cell">নেই</text>

  <!-- সারি ৪: flush -->
  <rect x="60" y="418" width="1007" height="30" rx="4" fill="#f8fafc"/>
  <text x="74" y="437" class="rowlb">flush</text>
  <text x="207" y="437" class="cell">no-op (লেখা সঙ্গে সঙ্গে দৃশ্যমান)</text>
  <text x="425" y="437" class="cell">_refresh (অনুসন্ধানযোগ্য করুন)</text>
  <text x="643" y="437" class="cell">no-op</text>
  <text x="861" y="437" class="cell">no-op</text>

  <!-- সারি ৫: ডিফল্ট পেজিনেশন -->
  <rect x="60" y="448" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="467" class="rowlb">ডিফল্ট পৃষ্ঠা</text>
  <text x="207" y="467" class="cell">সব, id দিয়ে সাজানো</text>
  <text x="425" y="467" class="cell">size 10, _score দিয়ে</text>
  <text x="643" y="467" class="cell">hits-ই মানদণ্ড</text>
  <text x="861" y="467" class="cell">খালি</text>

  <!-- সারি ৬: delete অর্থ -->
  <rect x="60" y="478" width="1007" height="30" rx="4" fill="#f8fafc"/>
  <text x="74" y="497" class="rowlb">delete অর্থ</text>
  <text x="207" y="497" class="cell">সব ইনডেক্সে মোছে</text>
  <text x="425" y="497" class="cell">শুধু default (delete_in দিয়ে)</text>
  <text x="643" y="497" class="cell">id দিয়ে, সব ইনডেক্সে</text>
  <text x="861" y="497" class="cell">no-op</text>

  <!-- সারি ৭: সফট ডিলিট -->
  <rect x="60" y="508" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="527" class="rowlb">soft_delete</text>
  <text x="207" y="527" class="cell">হ্যাঁ (চিহ্ন বসায়)</text>
  <text x="425" y="527" class="cell">হ্যাঁ (চিহ্ন বসায়)</text>
  <text x="643" y="527" class="cell">হ্যাঁ (ত্রি-অবস্থা ফিল্টার)</text>
  <text x="861" y="527" class="cell">না</text>

  <!-- ==================== ত্রুটির পথ ==================== -->
  <rect x="60" y="562" width="1007" height="58" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="74" y="584" class="lbl">ত্রুটির পথ — সব crate::Result&lt;T&gt;-এ মেশে</text>
  <text x="74" y="606" class="cell mono">InvalidIndexName · InvalidResult · Unsupported · Json · Http · Sqlx · Backend · XunSearch · XunSearchIo</text>
</svg>
