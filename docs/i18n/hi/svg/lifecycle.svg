<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 13px; fill: #64748b; }
      .node  { fill: #ffffff; stroke: #2563eb; stroke-width: 1.6; rx: 10; }
      .node-alt { stroke: #f59e0b; }
      .step  { font-size: 12px; font-weight: 600; fill: #2563eb; }
      .name  { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .desc  { font-size: 10.5px; fill: #475569; }
      .hdr   { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .hdr-a { fill: #2563eb; }
      .hdr-b { fill: #10b981; }
      .cell  { font-size: 11.5px; fill: #334155; }
      .lbl   { font-size: 12px; fill: #64748b; font-weight: 600; }
    </style>
  </defs>

  <text x="550" y="42" text-anchor="middle" class="title">इंडेक्स और दस्तावेज़ जीवनचक्र</text>
  <text x="550" y="66" text-anchor="middle" class="sub">छह चरण इंडेक्स के निर्माण से विनाश तक की पूरी यात्रा को कवर करते हैं — ड्राइवर-स्वतंत्र, एकीकृत सिमेंटिक्स</text>

  <!-- नोड 1 -->
  <rect x="30" y="100" width="160" height="120" class="node"/>
  <text x="110" y="124" text-anchor="middle" class="step">① बनाएं</text>
  <text x="110" y="148" text-anchor="middle" class="name">create_index</text>
  <text x="110" y="170" text-anchor="middle" class="desc">इंडेक्स पहले से बनाएं,</text>
  <text x="110" y="186" text-anchor="middle" class="desc">settings दें (ES mapping आदि)</text>
  <text x="110" y="202" text-anchor="middle" class="desc">नाम सत्यापन + एस्केपिंग</text>
  <line x1="190" y1="160" x2="220" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- नोड 2 -->
  <rect x="220" y="100" width="160" height="120" class="node"/>
  <text x="300" y="124" text-anchor="middle" class="step">② लिखें</text>
  <text x="300" y="148" text-anchor="middle" class="name">update</text>
  <text x="300" y="170" text-anchor="middle" class="desc">बैच में दस्तावेज़ इंडेक्स,</text>
  <text x="300" y="186" text-anchor="middle" class="desc">doc.index से रूट (डिफ़ॉल्ट</text>
  <text x="300" y="202" text-anchor="middle" class="desc">"default"), समान id ओवरराइट</text>
  <line x1="380" y1="160" x2="410" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- नोड 3 -->
  <rect x="410" y="100" width="160" height="120" class="node node-alt"/>
  <text x="490" y="124" text-anchor="middle" class="step">③ रीफ़्रेश</text>
  <text x="490" y="148" text-anchor="middle" class="name">flush</text>
  <text x="490" y="170" text-anchor="middle" class="desc">इन-मेमोरी: no-op;</text>
  <text x="490" y="186" text-anchor="middle" class="desc">ES ड्राइवर: _refresh</text>
  <text x="490" y="202" text-anchor="middle" class="desc">(दृश्यता सुनिश्चित करता है)</text>
  <line x1="570" y1="160" x2="600" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- नोड 4 -->
  <rect x="600" y="100" width="160" height="120" class="node"/>
  <text x="680" y="124" text-anchor="middle" class="step">④ खोजें</text>
  <text x="680" y="148" text-anchor="middle" class="name">search / paginate</text>
  <text x="680" y="170" text-anchor="middle" class="desc">क्वेरी + फ़िल्टर + सॉर्ट</text>
  <text x="680" y="186" text-anchor="middle" class="desc">+ पेजिनेशन, लौटाता है</text>
  <text x="680" y="202" text-anchor="middle" class="desc">SearchResult</text>
  <line x1="760" y1="160" x2="790" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- नोड 5 -->
  <rect x="790" y="100" width="160" height="120" class="node"/>
  <text x="870" y="124" text-anchor="middle" class="step">⑤ हटाएं</text>
  <text x="870" y="148" text-anchor="middle" class="name">delete</text>
  <text x="870" y="170" text-anchor="middle" class="desc">id से दस्तावेज़ हटाता है;</text>
  <text x="870" y="186" text-anchor="middle" class="desc">इन-मेमोरी सभी इंडेक्स में साफ़,</text>
  <text x="870" y="202" text-anchor="middle" class="desc">ES id से हटाता है</text>
  <line x1="950" y1="160" x2="980" y2="160" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- नोड 6 -->
  <rect x="980" y="100" width="100" height="120" class="node node-alt"/>
  <text x="1030" y="124" text-anchor="middle" class="step">⑥ नष्ट करें</text>
  <text x="1030" y="148" text-anchor="middle" class="name">delete_index</text>
  <text x="1030" y="170" text-anchor="middle" class="desc">इंडेक्स और डेटा</text>
  <text x="1030" y="186" text-anchor="middle" class="desc">पूरी तरह हटाता है</text>

  <!-- तुलना तालिका -->
  <text x="550" y="260" text-anchor="middle" class="lbl">दो ड्राइवरों के व्यवहार की तुलना</text>
  <rect x="60" y="272" width="490" height="30" rx="6" class="hdr hdr-a"/>
  <rect x="550" y="272" width="490" height="30" rx="6" class="hdr hdr-b"/>
  <text x="305" y="292" text-anchor="middle" class="hdr">CollectionEngine (डिफ़ॉल्ट · मेमोरी)</text>
  <text x="795" y="292" text-anchor="middle" class="hdr">ElasticsearchEngine (feature)</text>

  <rect x="60" y="302" width="490" height="26" rx="4" fill="#eff6ff"/>
  <rect x="550" y="302" width="490" height="26" rx="4" fill="#ecfdf5"/>
  <text x="75" y="320" class="cell">भंडारण: इन-प्रोसेस HashMap&lt;index, docs&gt;, Mutex सुरक्षित</text>
  <text x="565" y="320" class="cell">भंडारण: ES / OpenSearch क्लस्टर, REST + JSON</text>

  <rect x="60" y="328" width="490" height="26" rx="4" fill="#ffffff"/>
  <rect x="550" y="328" width="490" height="26" rx="4" fill="#ffffff"/>
  <text x="75" y="346" class="cell">पूर्ण-पाठ: फ़ील्ड सीरियलाइज़्ड सबस्ट्रिंग मिलान (केस-असंवेदनशील)</text>
  <text x="565" y="346" class="cell">पूर्ण-पाठ: query_string सिंटैक्स (फ़ील्ड_नाम:मान आदि)</text>

  <rect x="60" y="354" width="490" height="26" rx="4" fill="#eff6ff"/>
  <rect x="550" y="354" width="490" height="26" rx="4" fill="#ecfdf5"/>
  <text x="75" y="372" class="cell">फ़िल्टर/सॉर्ट: मेमोरी में matches() + sort_hits()</text>
  <text x="565" y="372" class="cell">फ़िल्टर/सॉर्ट: term/terms/must_not + sort ऐरे</text>

  <rect x="60" y="380" width="490" height="26" rx="4" fill="#ffffff"/>
  <rect x="550" y="380" width="490" height="26" rx="4" fill="#ffffff"/>
  <text x="75" y="398" class="cell">flush: no-op (लिखना तुरंत दृश्य)</text>
  <text x="565" y="398" class="cell">flush: POST _refresh (लिखना खोजने योग्य बनाता है)</text>

  <rect x="60" y="406" width="490" height="26" rx="4" fill="#eff6ff"/>
  <rect x="550" y="406" width="490" height="26" rx="4" fill="#ecfdf5"/>
  <text x="75" y="424" class="cell">डिफ़ॉल्ट पेजिनेशन: सभी; डिफ़ॉल्ट सॉर्ट: id से</text>
  <text x="565" y="424" class="cell">डिफ़ॉल्ट पेजिनेशन: size 10; डिफ़ॉल्ट सॉर्ट: _score</text>

  <rect x="60" y="432" width="490" height="26" rx="4" fill="#ffffff"/>
  <rect x="550" y="432" width="490" height="26" rx="4" fill="#ffffff"/>
  <text x="75" y="450" class="cell">त्रुटियाँ: केवल मेमोरी/JSON परत (poison सुरक्षा)</text>
  <text x="565" y="450" class="cell">त्रुटियाँ: HTTP / बैकएंड त्रुटियाँ जैसे की हैं वैसे ही पास</text>

  <!-- त्रुटि पथ -->
  <text x="550" y="500" text-anchor="middle" class="lbl">त्रुटि पथ (एकीकृत ScoutError)</text>
  <text x="550" y="522" text-anchor="middle" class="cell">InvalidIndexName · InvalidResult · Unsupported · Json · Http · Backend — सभी crate::Result&lt;T&gt; में समाहित</text>
</svg>
