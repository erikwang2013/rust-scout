<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="lifeTitle">
  <title id="lifeTitle">इंडेक्स और दस्तावेज़ जीवनचक्र: बनाना / लेखन / फ़्लश / क्वेरी / हटाना / पुनर्निर्माण / विनाश</title>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 13px; fill: #64748b; }
      .node  { fill: #ffffff; stroke: #2563eb; stroke-width: 1.6; }
      .node-alt { stroke: #f59e0b; }
      .step  { font-size: 11.5px; font-weight: 600; fill: #2563eb; }
      .name  { font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .desc  { font-size: 10px; fill: #475569; }
      .hdr   { font-size: 11.5px; font-weight: 700; fill: #ffffff; }
      .cell  { font-size: 10.5px; fill: #334155; }
      .rowlb { font-size: 11px; font-weight: 600; fill: #0f172a; }
      .lbl   { font-size: 12px; fill: #64748b; font-weight: 600; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <text x="590" y="42" text-anchor="middle" class="title">इंडेक्स और दस्तावेज़ जीवनचक्र</text>
  <text x="590" y="66" text-anchor="middle" class="sub">सात चरण: इंडेक्स की रचना से विनाश तक की पूरी यात्रा — ड्राइवर-अज्ञेय, एक समान अर्थ</text>

  <!-- ==================== जीवनचक्र प्रवाह ==================== -->
  <rect x="38" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="110" y="124" text-anchor="middle" class="step">① बनाना</text>
  <text x="110" y="148" text-anchor="middle" class="name">create_index</text>
  <text x="110" y="172" text-anchor="middle" class="desc">इंडेक्स पहले बनाएँ,</text>
  <text x="110" y="188" text-anchor="middle" class="desc">settings दें (ES mapping)</text>
  <text x="110" y="204" text-anchor="middle" class="desc">नाम सत्यापन + एस्केप</text>
  <line x1="183" y1="166" x2="198" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="198" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="270" y="124" text-anchor="middle" class="step">② लेखन</text>
  <text x="270" y="148" text-anchor="middle" class="name">update</text>
  <text x="270" y="172" text-anchor="middle" class="desc">doc.index से रूटिंग</text>
  <text x="270" y="188" text-anchor="middle" class="desc">(डिफ़ॉल्ट "default")</text>
  <text x="270" y="204" text-anchor="middle" class="desc">समान id ओवरराइट;</text>
  <text x="270" y="220" text-anchor="middle" class="desc mono">update_bulk</text>
  <line x1="343" y1="166" x2="358" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="358" y="100" width="145" height="132" rx="10" class="node node-alt"/>
  <text x="430" y="124" text-anchor="middle" class="step">③ फ़्लश</text>
  <text x="430" y="148" text-anchor="middle" class="name">flush</text>
  <text x="430" y="172" text-anchor="middle" class="desc">no-op: collection/SQLite</text>
  <text x="430" y="188" text-anchor="middle" class="desc">no-op: Meili/TS/Algolia</text>
  <text x="430" y="204" text-anchor="middle" class="desc">_refresh: ES</text>
  <text x="430" y="220" text-anchor="middle" class="desc">CMD_INDEX_COMMIT: XunSearch</text>
  <line x1="503" y1="166" x2="518" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="518" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="590" y="124" text-anchor="middle" class="step">④ क्वेरी</text>
  <text x="590" y="148" text-anchor="middle" class="name">search / paginate</text>
  <text x="590" y="172" text-anchor="middle" class="desc">query + फ़िल्टर + सॉर्ट</text>
  <text x="590" y="188" text-anchor="middle" class="desc">+ पेजिनेशन, लौटाता है</text>
  <text x="590" y="204" text-anchor="middle" class="desc">SearchResult</text>
  <line x1="663" y1="166" x2="678" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="678" y="100" width="145" height="132" rx="10" class="node"/>
  <text x="750" y="124" text-anchor="middle" class="step">⑤ दस्तावेज़ हटाना</text>
  <text x="750" y="148" text-anchor="middle" class="name">delete · delete_in</text>
  <text x="750" y="172" text-anchor="middle" class="desc">id से हटाएँ; delete_in</text>
  <text x="750" y="188" text-anchor="middle" class="desc">एक इंडेक्स तक। सॉफ़्ट</text>
  <text x="750" y="204" text-anchor="middle" class="desc mono">soft_delete_in</text>
  <line x1="823" y1="166" x2="838" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="838" y="100" width="145" height="132" rx="10" class="node node-alt"/>
  <text x="910" y="124" text-anchor="middle" class="step">⑥ पुनर्निर्माण</text>
  <text x="910" y="148" text-anchor="middle" class="name">reindex</text>
  <text x="910" y="172" text-anchor="middle" class="desc">from इंडेक्स → to कॉपी।</text>
  <text x="910" y="188" text-anchor="middle" class="desc">मेमोरी: लक्ष्य बदलें</text>
  <text x="910" y="204" text-anchor="middle" class="desc">ES: _reindex से मर्ज</text>
  <line x1="983" y1="166" x2="998" y2="166" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="998" y="100" width="145" height="132" rx="10" class="node node-alt"/>
  <text x="1070" y="124" text-anchor="middle" class="step">⑦ विनाश</text>
  <text x="1070" y="148" text-anchor="middle" class="name">delete_index</text>
  <text x="1070" y="172" text-anchor="middle" class="desc">इंडेक्स पूरी तरह</text>
  <text x="1070" y="188" text-anchor="middle" class="desc">और उसका सारा डेटा</text>

  <!-- ==================== ड्राइवर परिवार तुलना ==================== -->
  <text x="590" y="278" text-anchor="middle" class="lbl">चारों ड्राइवर परिवार हर चरण में कैसे भिन्न हैं</text>

  <rect x="60" y="292" width="130" height="32" rx="6" fill="#f1f5f9"/>
  <rect x="195" y="292" width="218" height="32" rx="6" fill="#10b981"/>
  <rect x="413" y="292" width="218" height="32" rx="6" fill="#2563eb"/>
  <rect x="631" y="292" width="218" height="32" rx="6" fill="#d97706"/>
  <rect x="849" y="292" width="218" height="32" rx="6" fill="#94a3b8"/>
  <text x="74" y="313" class="lbl">चरण / व्यवहार</text>
  <text x="304" y="313" text-anchor="middle" class="hdr">CollectionEngine</text>
  <text x="522" y="313" text-anchor="middle" class="hdr">HTTP बैकएंड (ES, Meili, …)</text>
  <text x="740" y="313" text-anchor="middle" class="hdr">DatabaseEngine</text>
  <text x="958" y="313" text-anchor="middle" class="hdr">NullEngine</text>

  <!-- पंक्ति 1: स्टोरेज -->
  <rect x="60" y="328" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="347" class="rowlb">स्टोरेज</text>
  <text x="207" y="347" class="cell">इन-प्रोसेस HashMap</text>
  <text x="425" y="347" class="cell">रिमोट क्लस्टर / क्लाउड</text>
  <text x="643" y="347" class="cell">SQLite फ़ाइल</text>
  <text x="861" y="347" class="cell">कोई स्टोरेज नहीं</text>

  <!-- पंक्ति 2: पूर्ण-पाठ -->
  <rect x="60" y="358" width="1007" height="30" rx="4" fill="#f8fafc"/>
  <text x="74" y="377" class="rowlb">पूर्ण-पाठ</text>
  <text x="207" y="377" class="cell">सीरियलाइज़्ड सबस्ट्रिंग मिलान</text>
  <text x="425" y="377" class="cell">बैकएंड का मूल सिंटैक्स</text>
  <text x="643" y="377" class="cell">LIKE रूखा + इन-मेमोरी सूक्ष्म</text>
  <text x="861" y="377" class="cell">हमेशा खाली परिणाम</text>

  <!-- पंक्ति 3: फ़िल्टर और सॉर्ट -->
  <rect x="60" y="388" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="407" class="rowlb">फ़िल्टर / सॉर्ट</text>
  <text x="207" y="407" class="cell">इन-मेमोरी matches + sort_hits</text>
  <text x="425" y="407" class="cell">term / terms / sort पुशडाउन</text>
  <text x="643" y="407" class="cell">total = hits.len()</text>
  <text x="861" y="407" class="cell">कोई नहीं</text>

  <!-- पंक्ति 4: flush -->
  <rect x="60" y="418" width="1007" height="30" rx="4" fill="#f8fafc"/>
  <text x="74" y="437" class="rowlb">flush</text>
  <text x="207" y="437" class="cell">no-op (लेखन तुरंत दृश्य)</text>
  <text x="425" y="437" class="cell">ES: _refresh / others: no-op</text>
  <text x="643" y="437" class="cell">no-op</text>
  <text x="861" y="437" class="cell">no-op</text>

  <!-- पंक्ति 5: डिफ़ॉल्ट पेजिनेशन -->
  <rect x="60" y="448" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="467" class="rowlb">डिफ़ॉल्ट पेज</text>
  <text x="207" y="467" class="cell">सभी, id से क्रमबद्ध</text>
  <text x="425" y="467" class="cell">size 10, _score से</text>
  <text x="643" y="467" class="cell">सभी, id से क्रमबद्ध</text>
  <text x="861" y="467" class="cell">खाली</text>

  <!-- पंक्ति 6: delete अर्थ -->
  <rect x="60" y="478" width="1007" height="30" rx="4" fill="#f8fafc"/>
  <text x="74" y="497" class="rowlb">delete अर्थ</text>
  <text x="207" y="497" class="cell">सभी इंडेक्स में हटाता है</text>
  <text x="425" y="497" class="cell">केवल default (delete_in से)</text>
  <text x="643" y="497" class="cell">id से, सभी इंडेक्स में</text>
  <text x="861" y="497" class="cell">no-op</text>

  <!-- पंक्ति 7: सॉफ़्ट डिलीट -->
  <rect x="60" y="508" width="1007" height="30" rx="4" fill="#ffffff"/>
  <text x="74" y="527" class="rowlb">soft_delete</text>
  <text x="207" y="527" class="cell">हाँ (चिह्न लगाता है)</text>
  <text x="425" y="527" class="cell">हाँ (soft_delete_in)</text>
  <text x="643" y="527" class="cell">हाँ (तीन-अवस्था फ़िल्टर)</text>
  <text x="861" y="527" class="cell">नहीं</text>

  <!-- ==================== त्रुटि पथ ==================== -->
  <text x="60" y="554" class="desc">XunSearch इन चार श्रेणियों में नहीं आता: इसका flush CMD_INDEX_COMMIT है (डिस्क पर कमिट), no-op नहीं।</text>
  <rect x="60" y="562" width="1007" height="58" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="74" y="584" class="lbl">त्रुटि पथ — सब crate::Result&lt;T&gt; में समाहित</text>
  <text x="74" y="606" class="cell mono">InvalidIndexName · InvalidResult · Unsupported · Json · Http · Sqlx · Backend · XunSearch · XunSearchIo</text>
</svg>
