<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 840" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="archTitle">
  <title id="archTitle">rust-scout वास्तुकला: एप्लिकेशन / डेटा कॉन्ट्रैक्ट / कोर / ड्राइवर / स्टोरेज</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 13px; fill: #64748b; }
      .layer { fill: #e2e8f0; opacity: 0.35; }
      .box   { fill: #ffffff; stroke: #2563eb; stroke-width: 1.5; }
      .box-core { stroke: #2563eb; }
      .box-mem  { stroke: #10b981; }
      .box-http { stroke: #2563eb; }
      .box-db   { stroke: #d97706; }
      .box-tcp  { stroke: #8b5cf6; }
      .box-null { stroke: #94a3b8; }
      .box-data { stroke: #f59e0b; }
      .name  { font-size: 14px; font-weight: 600; fill: #0f172a; }
      .name-s{ font-size: 12.5px; font-weight: 600; fill: #0f172a; }
      .desc  { font-size: 11px; fill: #475569; }
      .desc-s{ font-size: 10.5px; fill: #64748b; }
      .lbl   { font-size: 12px; fill: #64748b; font-weight: 600; }
      .ctag  { font-size: 10.5px; font-weight: 700; }
      .mem   { fill: #10b981; }
      .http  { fill: #2563eb; }
      .db    { fill: #d97706; }
      .tcp   { fill: #8b5cf6; }
      .null  { fill: #64748b; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <text x="550" y="42" text-anchor="middle" class="title">rust-scout वास्तुकला</text>
  <text x="550" y="66" text-anchor="middle" class="sub">Scout शैली का पूर्ण-पाठ खोज एब्स्ट्रैक्शन — एक Engine trait, आठ ड्राइवर, बिज़नेस कोड बैकएंड से अनजान</text>

  <!-- ==================== एप्लिकेशन परत ==================== -->
  <rect x="40" y="95" width="1020" height="70" rx="10" class="layer"/>
  <text x="60" y="118" class="lbl">एप्लिकेशन परत (Application)</text>
  <rect x="60" y="126" width="470" height="26" rx="6" class="box"/>
  <text x="295" y="143" text-anchor="middle" class="name">कॉलर कोड (async / await)</text>
  <rect x="560" y="126" width="480" height="26" rx="6" class="box"/>
  <text x="800" y="143" text-anchor="middle" class="name">बिज़नेस मॉडल Searchable / SearchableStore लागू करते हैं</text>

  <!-- ==================== डेटा कॉन्ट्रैक्ट परत ==================== -->
  <rect x="40" y="185" width="1020" height="70" rx="10" class="layer"/>
  <text x="60" y="208" class="lbl">डेटा कॉन्ट्रैक्ट परत (serde JSON) — ड्राइवर-अज्ञेय</text>
  <rect x="60" y="216" width="300" height="26" rx="6" class="box"/>
  <text x="210" y="233" text-anchor="middle" class="name">SearchBuilder (चेन-आधारित क्वेरी)</text>
  <rect x="390" y="216" width="300" height="26" rx="6" class="box"/>
  <text x="540" y="233" text-anchor="middle" class="name">SearchDocument (लेखन)</text>
  <rect x="720" y="216" width="300" height="26" rx="6" class="box"/>
  <text x="870" y="233" text-anchor="middle" class="name">SearchResult / SearchHit (पठन)</text>

  <!-- ==================== कोर परत ==================== -->
  <rect x="40" y="275" width="1020" height="150" rx="10" class="layer"/>
  <text x="60" y="298" class="lbl">कोर परत (Core)</text>
  <rect x="60" y="306" width="300" height="104" rx="8" class="box box-core"/>
  <text x="210" y="330" text-anchor="middle" class="name">EngineManager (फ़साड)</text>
  <text x="210" y="350" text-anchor="middle" class="desc">ScoutConfig.driver के अनुसार वितरण और कैश</text>
  <text x="210" y="368" text-anchor="middle" class="desc">कोल्ड स्टार्ट पर केवल एक बार निर्माण (Mutex)</text>
  <text x="210" y="390" text-anchor="middle" class="desc mono">engine() -&gt; Arc&lt;dyn Engine&gt;</text>

  <rect x="390" y="306" width="650" height="104" rx="8" class="box box-core"/>
  <text x="715" y="328" text-anchor="middle" class="name">Engine trait — एकमात्र सीम</text>
  <text x="715" y="346" text-anchor="middle" class="desc">6 अनिवार्य: update · delete · search · paginate · create_index · delete_index</text>
  <text x="715" y="364" text-anchor="middle" class="desc">8 डिफ़ॉल्ट सहित: delete_in · map_ids · flush · update_bulk</text>
  <text x="715" y="382" text-anchor="middle" class="desc">delete_bulk · soft_delete · soft_delete_in · reindex</text>
  <text x="715" y="400" text-anchor="middle" class="desc mono">async EngineFuture&lt;T&gt; से लौटता है, Send + Sync</text>

  <line x1="210" y1="306" x2="210" y2="275" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="358" x2="390" y2="358" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="715" y1="410" x2="715" y2="440" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ==================== ड्राइवर परत (ट्रांसपोर्ट के अनुसार चार समूह) ==================== -->
  <rect x="40" y="440" width="1020" height="210" rx="10" class="layer"/>
  <text x="60" y="462" class="lbl">ड्राइवर परत (Drivers) — ट्रांसपोर्ट के अनुसार, feature गेटेड</text>

  <!-- समूह A: इन-प्रोसेस -->
  <text x="60" y="484" class="ctag mem">A · इन-प्रोसेस (डिफ़ॉल्ट, शून्य-निर्भरता)</text>
  <rect x="60" y="492" width="230" height="150" rx="8" class="box box-mem"/>
  <text x="76" y="516" class="name">CollectionEngine</text>
  <text x="76" y="538" class="desc">HashMap&lt;index, docs&gt;</text>
  <text x="76" y="556" class="desc">सीरियलाइज़्ड सबस्ट्रिंग मिलान</text>
  <text x="76" y="574" class="desc">matches() / sort_hits() इन-मेमोरी</text>
  <text x="76" y="592" class="desc">flush no-op, लेखन तुरंत दृश्य</text>
  <text x="76" y="616" class="desc-s mono">ScoutConfig::collection()</text>
  <text x="76" y="634" class="desc-s">feature: अंतर्निहित</text>

  <!-- समूह B: HTTP REST -->
  <text x="310" y="484" class="ctag http">B · HTTP REST (reqwest)</text>
  <rect x="310" y="492" width="230" height="33" rx="7" class="box box-http"/>
  <text x="324" y="513" class="name-s">ElasticsearchEngine</text>
  <text x="528" y="513" text-anchor="end" class="desc-s">ES / OS</text>
  <rect x="310" y="531" width="230" height="33" rx="7" class="box box-http"/>
  <text x="324" y="552" class="name-s">MeilisearchEngine</text>
  <text x="528" y="552" text-anchor="end" class="desc-s">:7700</text>
  <rect x="310" y="570" width="230" height="33" rx="7" class="box box-http"/>
  <text x="324" y="591" class="name-s">TypesenseEngine</text>
  <text x="528" y="591" text-anchor="end" class="desc-s">:8108</text>
  <rect x="310" y="609" width="230" height="33" rx="7" class="box box-http"/>
  <text x="324" y="630" class="name-s">AlgoliaEngine</text>
  <text x="528" y="630" text-anchor="end" class="desc-s">होस्टेड क्लाउड</text>

  <!-- समूह C: स्थानीय फ़ाइल -->
  <text x="560" y="484" class="ctag db">C · स्थानीय फ़ाइल</text>
  <rect x="560" y="492" width="230" height="150" rx="8" class="box box-db"/>
  <text x="576" y="516" class="name">DatabaseEngine</text>
  <text x="576" y="538" class="desc">SQLite तालिका scout_documents</text>
  <text x="576" y="556" class="desc">LIKE रूखा + इन-मेमोरी सूक्ष्म फ़िल्टर</text>
  <text x="576" y="574" class="desc">total = फ़िल्टर के बाद hits</text>
  <text x="576" y="592" class="desc">पेजिनेशन फ़िल्टर के बाद</text>
  <text x="576" y="616" class="desc-s mono">ScoutConfig::database(..)</text>
  <text x="576" y="634" class="desc-s">feature: database</text>

  <!-- समूह D: मूल TCP / नो-ऑप -->
  <text x="810" y="484" class="ctag tcp">D · मूल TCP / नो-ऑप</text>
  <rect x="810" y="492" width="230" height="72" rx="8" class="box box-tcp"/>
  <text x="826" y="516" class="name">XunSearchEngine</text>
  <text x="826" y="536" class="desc">xunsearchd बाइनरी प्रोटोकॉल</text>
  <text x="826" y="553" class="desc">हर ऑपरेशन पर एक शॉर्ट कनेक्शन</text>
  <rect x="810" y="572" width="230" height="70" rx="8" class="box box-null"/>
  <text x="826" y="596" class="name">NullEngine</text>
  <text x="826" y="616" class="desc">लेखन छोड़ता है, हमेशा खाली</text>
  <text x="826" y="633" class="desc">परीक्षण / खोज बंद करना</text>

  <!-- ==================== स्टोरेज परत ==================== -->
  <rect x="40" y="672" width="1020" height="140" rx="10" class="layer"/>
  <text x="60" y="694" class="lbl">स्टोरेज और ट्रांसपोर्ट (Storage / Transport)</text>

  <rect x="60" y="706" width="230" height="88" rx="8" class="box box-data"/>
  <text x="175" y="732" text-anchor="middle" class="name">इन-प्रोसेस</text>
  <text x="175" y="754" text-anchor="middle" class="desc">HashMap&lt;index, HashMap&lt;id, doc&gt;&gt;</text>
  <text x="175" y="772" text-anchor="middle" class="desc">Mutex सुरक्षित, एग्ज़िट पर खो जाता है</text>

  <rect x="310" y="706" width="230" height="88" rx="8" class="box box-data"/>
  <text x="425" y="732" text-anchor="middle" class="name">खोज सर्वर क्लस्टर</text>
  <text x="425" y="754" text-anchor="middle" class="desc">ES / OpenSearch · Meilisearch</text>
  <text x="425" y="772" text-anchor="middle" class="desc">Typesense · Algolia क्लाउड</text>

  <rect x="560" y="706" width="230" height="88" rx="8" class="box box-data"/>
  <text x="675" y="732" text-anchor="middle" class="name">SQLite फ़ाइल</text>
  <text x="675" y="754" text-anchor="middle" class="desc">स्थानीय .db, आपके डेटाबेस के पास</text>
  <text x="675" y="772" text-anchor="middle" class="desc">sqlx + runtime-tokio</text>

  <rect x="810" y="706" width="230" height="88" rx="8" class="box box-data"/>
  <text x="925" y="732" text-anchor="middle" class="name">xunsearchd प्रोसेस</text>
  <text x="925" y="754" text-anchor="middle" class="desc">8383 इंडेक्स / 8384 खोज</text>
  <text x="925" y="772" text-anchor="middle" class="desc">NullEngine: कोई स्टोरेज नहीं</text>

  <!-- समूह → स्टोरेज कनेक्शन -->
  <line x1="175" y1="642" x2="175" y2="706" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="425" y1="642" x2="425" y2="706" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="675" y1="642" x2="675" y2="706" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="925" y1="642" x2="925" y2="706" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- एप्लिकेशन → कॉन्ट्रैक्ट -->
  <line x1="295" y1="152" x2="295" y2="185" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
