<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 13px; fill: #64748b; }
      .layer { fill: #e2e8f0; opacity: 0.35; }
      .box   { fill: #ffffff; stroke: #2563eb; stroke-width: 1.5; rx: 8; }
      .box-core { stroke: #2563eb; }
      .box-drv  { stroke: #10b981; }
      .box-data { stroke: #f59e0b; }
      .name  { font-size: 14px; font-weight: 600; fill: #0f172a; }
      .desc  { font-size: 11.5px; fill: #475569; }
      .tag   { font-size: 11px; fill: #ffffff; font-weight: 600; }
      .tag-core { fill: #2563eb; }
      .tag-drv  { fill: #10b981; }
      .tag-data { fill: #f59e0b; }
      .lbl   { font-size: 12px; fill: #64748b; font-weight: 600; }
    </style>
  </defs>

  <text x="550" y="42" text-anchor="middle" class="title">rust-scout आर्किटेक्चर</text>
  <text x="550" y="66" text-anchor="middle" class="sub">Scout-शैली पूर्ण-पाठ खोज लाइब्रेरी एब्स्ट्रैक्शन — ड्राइवर प्लग करने योग्य, अनुबंध एकीकृत</text>

  <!-- एप्लिकेशन परत -->
  <rect x="40" y="95" width="1020" height="70" rx="10" class="layer"/>
  <text x="60" y="118" class="lbl">एप्लिकेशन कोड (Application)</text>
  <rect x="60" y="126" width="470" height="26" rx="6" class="box"/>
  <text x="295" y="143" text-anchor="middle" class="name">कॉलर कोड (async / await)</text>
  <rect x="560" y="126" width="480" height="26" rx="6" class="box"/>
  <text x="800" y="143" text-anchor="middle" class="name">आपके व्यावसायिक मॉडल Searchable / SearchableStore लागू करते हैं</text>

  <!-- डेटा अनुबंध परत -->
  <rect x="40" y="195" width="1020" height="70" rx="10" class="layer"/>
  <text x="60" y="218" class="lbl">डेटा अनुबंध (serde JSON)</text>
  <rect x="60" y="226" width="300" height="26" rx="6" class="box"/>
  <text x="210" y="243" text-anchor="middle" class="name">SearchBuilder (चेन-आधारित क्वेरी)</text>
  <rect x="390" y="226" width="300" height="26" rx="6" class="box"/>
  <text x="540" y="243" text-anchor="middle" class="name">SearchDocument (लिखना)</text>
  <rect x="720" y="226" width="300" height="26" rx="6" class="box"/>
  <text x="870" y="243" text-anchor="middle" class="name">SearchResult / SearchHit (पढ़ना)</text>

  <!-- मुख्य परत -->
  <rect x="40" y="295" width="1020" height="150" rx="10" class="layer"/>
  <text x="60" y="318" class="lbl">मुख्य परत (Core)</text>
  <rect x="60" y="326" width="300" height="100" rx="8" class="box box-core"/>
  <text x="210" y="352" text-anchor="middle" class="name">EngineManager</text>
  <text x="210" y="372" text-anchor="middle" class="desc">फ़ेसाडे — ScoutConfig.driver के अनुसार रूट करता है</text>
  <text x="210" y="390" text-anchor="middle" class="desc">collection (डिफ़ॉल्ट) / elasticsearch</text>
  <text x="210" y="408" text-anchor="middle" class="desc">/ opensearch</text>
  <rect x="390" y="326" width="650" height="100" rx="8" class="box box-core"/>
  <text x="715" y="352" text-anchor="middle" class="name">Engine ट्रेट — ड्राइवरों का एकीकृत इंटरफ़ेस</text>
  <text x="715" y="376" text-anchor="middle" class="desc">update · delete · search · paginate · map_ids</text>
  <text x="715" y="394" text-anchor="middle" class="desc">flush · create_index · delete_index</text>
  <text x="715" y="412" text-anchor="middle" class="desc">async EngineFuture&lt;T&gt; लौटाता है, Send + Sync</text>

  <line x1="210" y1="326" x2="210" y2="295" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="376" x2="390" y2="376" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ड्राइवर परत -->
  <rect x="40" y="475" width="1020" height="70" rx="10" class="layer"/>
  <text x="60" y="498" class="lbl">ड्राइवर परत (Drivers)</text>
  <rect x="60" y="506" width="470" height="26" rx="6" class="box box-drv"/>
  <text x="110" y="523" class="tag tag-drv">डिफ़ॉल्ट · शून्य निर्भरता</text>
  <text x="250" y="523" class="name">CollectionEngine (इन-मेमोरी HashMap)</text>
  <rect x="560" y="506" width="480" height="26" rx="6" class="box box-drv"/>
  <text x="610" y="523" class="tag tag-drv">feature: elasticsearch</text>
  <text x="770" y="523" class="name">ElasticsearchEngine (ES / OpenSearch)</text>
  <line x1="715" y1="426" x2="715" y2="475" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- भंडारण परत -->
  <rect x="40" y="575" width="1020" height="65" rx="10" class="layer"/>
  <text x="60" y="598" class="lbl">भंडारण (Storage)</text>
  <rect x="60" y="606" width="470" height="26" rx="6" class="box box-data"/>
  <text x="295" y="623" text-anchor="middle" class="name">इन-प्रोसेस HashMap&lt;index, docs&gt;</text>
  <rect x="560" y="606" width="480" height="26" rx="6" class="box box-data"/>
  <text x="800" y="623" text-anchor="middle" class="name">Elasticsearch / OpenSearch क्लस्टर (REST + JSON)</text>
  <line x1="295" y1="532" x2="295" y2="575" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="800" y1="532" x2="800" y2="575" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
