<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 13px; fill: #64748b; }
      .card  { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 10; }
      .num   { font-size: 20px; font-weight: 700; fill: #2563eb; }
      .name  { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .desc  { font-size: 12px; fill: #475569; }
      .code  { font-size: 11px; fill: #334155; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .rule  { fill: #dbeafe; }
    </style>
  </defs>

  <text x="550" y="42" text-anchor="middle" class="title">डिज़ाइन दर्शन</text>
  <text x="550" y="66" text-anchor="middle" class="sub">पाँच डिज़ाइन सिद्धांत — प्रत्येक कोड में एक ठोस निर्णय से मेल खाता है</text>

  <!-- 1 -->
  <rect x="40" y="90" width="1020" height="92" class="card"/>
  <rect x="60" y="106" width="40" height="40" rx="20" class="rule"/>
  <text x="80" y="132" text-anchor="middle" class="num">1</text>
  <text x="118" y="122" class="name">Scout-शैली चेन API</text>
  <text x="118" y="142" class="desc">Laravel Scout की मानसिकता: पहले क्वेरी बनाएं, फिर एक कॉल में निष्पादित करें। क्वेरी और निष्पादन अलग होने से पुन: उपयोग और परीक्षण आसान होता है।</text>
  <text x="118" y="162" class="code">let b = SearchBuilder::new(q).within(i).where_field(f, v).order_by(k, true).take(10);</text>

  <!-- 2 -->
  <rect x="40" y="194" width="1020" height="92" class="card"/>
  <rect x="60" y="210" width="40" height="40" rx="20" class="rule"/>
  <text x="80" y="236" text-anchor="middle" class="num">2</text>
  <text x="118" y="226" class="name">ड्राइवर एब्स्ट्रैक्शन — Engine ट्रेट ही एकमात्र सीम है</text>
  <text x="118" y="246" class="desc">8 ऑपरेशन एकीकृत अनुबंध परिभाषित करते हैं, async EngineFuture रिटर्न होता है। बैकएंड बदलना = कॉन्फ़िग बदलना, व्यावसायिक कोड में शून्य बदलाव।</text>
  <text x="118" y="266" class="code">EngineManager::new(ScoutConfig::elasticsearch(host, key)).engine()?;  // या collection()</text>

  <!-- 3 -->
  <rect x="40" y="298" width="1020" height="92" class="card"/>
  <rect x="60" y="314" width="40" height="40" rx="20" class="rule"/>
  <text x="80" y="340" text-anchor="middle" class="num">3</text>
  <text x="118" y="330" class="name">डेटा अनुबंध पहले — serde JSON</text>
  <text x="118" y="350" class="desc">लिखना, क्वेरी और परिणाम सभी JSON संरचित डेटा हैं, ड्राइवर-स्वतंत्र। Searchable व्यावसायिक मॉडल और दस्तावेज़ों के बीच पुल बनाता है।</text>
  <text x="118" y="370" class="code">SearchDocument { id, index?, fields(flatten) } ⇄ SearchBuilder ⇄ SearchResult { hits, total }</text>

  <!-- 4 -->
  <rect x="40" y="402" width="1020" height="92" class="card"/>
  <rect x="60" y="418" width="40" height="40" rx="20" class="rule"/>
  <text x="80" y="444" text-anchor="middle" class="num">4</text>
  <text x="118" y="434" class="name">सरलता पहले — डिफ़ॉल्ट शून्य निर्भरता</text>
  <text x="118" y="454" class="desc">डिफ़ॉल्ट इन-मेमोरी ड्राइवर तुरंत काम करता है, केवल serde/thiserror पर निर्भर; Elasticsearch ड्राइवर एक वैकल्पिक feature है, आवश्यकता पर जोड़ें।</text>
  <text x="118" y="474" class="code">[features] default = [] · elasticsearch = ["dep:reqwest"]   // cargo add rust-scout --features elasticsearch</text>

  <!-- 5 -->
  <rect x="40" y="506" width="1020" height="92" class="card"/>
  <rect x="60" y="522" width="40" height="40" rx="20" class="rule"/>
  <text x="80" y="548" text-anchor="middle" class="num">5</text>
  <text x="118" y="538" class="name">सुरक्षा सीमाएँ — इनपुट सत्यापन + आउटपुट एस्केपिंग</text>
  <text x="118" y="558" class="desc">URL में जाने से पहले इंडेक्स नाम validate_index_name से सत्यापित होता है; id/index RFC 3986 प्रतिशत-एन्कोडेड होते हैं, जिससे पाथ इंजेक्शन और गलत इंडेक्स में लिखना असंभव होता है।</text>
  <text x="118" y="578" class="code">validate_index_name(index)?;  →  percent_encode(index) →  /{index}/_doc/{id}</text>
</svg>
