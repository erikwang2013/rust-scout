<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="150 80 220 300" width="220" height="300" role="img" aria-label="Scout · 沮丧 Depressed"><title>Scout · 沮丧 Depressed</title><desc>Scout 的 沮丧 表情形态 · animated expression form</desc><style>
.ex-motion { animation: ex-slump 4.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
.ex-anim-tear { animation: ex-tear 1.8s ease-in infinite; transform-box: fill-box; transform-origin: center; }
.ex-anim-sweat { animation: ex-tear 1.5s ease-in infinite; transform-box: fill-box; transform-origin: center; }
.ex-anim-heart { animation: ex-heart 2.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.ex-anim-spark { animation: ex-spark 1.9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.ex-anim-rain { animation: ex-rain 1.4s linear infinite; transform-box: fill-box; transform-origin: center; }
.ex-anim-confetti { animation: ex-confetti 2.4s linear infinite; transform-box: fill-box; transform-origin: center; }
.ex-anim-pulse { animation: ex-pulse 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.ex-anim-knock { animation: ex-knock 0.55s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.ex-anim-knockline { animation: ex-knockline 0.55s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.ex-anim-palm { animation: ex-palm 0.9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.ex-anim-steam { animation: ex-steam 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
.ex-anim-shock { animation: ex-shock 0.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.ex-anim-please { animation: ex-please 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.ex-anim-drift { animation: ex-drift 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ex-slump { 0%,100% { transform: translateY(0); } 50% { transform: translateY(2.4px); } }
@keyframes ex-tear { 0% { transform: translateY(0); opacity: 0; } 18% { opacity: 1; } 100% { transform: translateY(8.25px); opacity: 0; } }
@keyframes ex-heart { 0% { transform: translateY(0) scale(.65); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-13.5px) scale(1.15); opacity: 0; } }
@keyframes ex-spark { 0%,100% { transform: scale(.6) rotate(0deg); opacity: .3; } 50% { transform: scale(1.15) rotate(25deg); opacity: 1; } }
@keyframes ex-rain { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(9px); opacity: 0; } }
@keyframes ex-confetti { 0% { transform: translateY(-4px) rotate(0deg); opacity: 1; } 100% { transform: translateY(14px) rotate(200deg); opacity: 0; } }
@keyframes ex-pulse { 0%,100% { transform: scale(1); opacity: .35; } 50% { transform: scale(1.18); opacity: .7; } }
@keyframes ex-knock { 0%,100% { transform: translateX(3.38px); } 35% { transform: translateX(0); } }
@keyframes ex-knockline { 0%,100% { transform: scaleX(.6); opacity: .35; } 35% { transform: scaleX(1); opacity: 1; } }
@keyframes ex-palm { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-1px) rotate(-4deg); } }
@keyframes ex-steam { 0% { transform: translateY(0); opacity: .7; } 100% { transform: translateY(-7px); opacity: 0; } }
@keyframes ex-shock { 0%,100% { transform: scaleX(.7); opacity: .4; } 50% { transform: scaleX(1.25); opacity: 1; } }
@keyframes ex-please { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
@keyframes ex-drift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
@media (prefers-reduced-motion: reduce) {
  .ex-motion, [class*="ex-anim-"] { animation: none !important; }
}
</style><g class="ex-motion ex-depressed"><g class="ex-base"><defs>
    <style>.title { font-size: 24px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 12.5px; fill: #64748b; }

      /* 机器人配色：白色/浅灰外壳 + 石板灰描边，与架构图同一套灰阶，不引入第二套色板 */
      .body  { fill: #ffffff; stroke: #64748b; stroke-width: 3; }
      .plate { fill: #e2e8f0; stroke: #64748b; stroke-width: 2.6; stroke-linejoin: round; }
      .part  { fill: #cbd5e1; stroke: #64748b; stroke-width: 2.4; }
      .visor { fill: #0f172a; }
      .eye   { fill: #60a5fa; }
      .lamp  { fill: #f59e0b; stroke: #64748b; stroke-width: 2.2; }

      /* 手臂：两笔描边套出「浅灰管 + 石板灰轮廓」的效果 */
      .limb-o { fill: none; stroke: #64748b; stroke-width: 17; stroke-linecap: round; }
      .limb-i { fill: none; stroke: #cbd5e1; stroke-width: 12; stroke-linecap: round; }

      /* 模块舱：浅色舱板 + 深色插槽，槽里嵌一枚彩色模块 */
      .bay    { fill: #e2e8f0; stroke: #64748b; stroke-width: 2.4; }
      .socket { fill: #0f172a; }
      .glow   { fill: #10b981; opacity: 0.16; }
      .ring   { fill: none; stroke: #10b981; stroke-width: 2.4; opacity: 0.6; }
      .chip-mark { fill: #ffffff; opacity: 0.75; }

      /* 正在插入的那一枚：空槽里的落位虚线框 + 飞行虚线弧 + 速度线，同色 */
      .slot-empty { fill: none; stroke: #f59e0b; stroke-width: 1.8; stroke-dasharray: 3.5 3; opacity: 0.85; }
      .arc  { fill: none; stroke: #f59e0b; stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 5 4.5; }
      .tick { fill: none; stroke: #f59e0b; stroke-width: 2.4; stroke-linecap: round; }
      .wire { fill: none; stroke: #64748b; stroke-width: 3; stroke-linecap: round; }

      /* 查询卡片 / 结果面板 */
      .card   { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .card-h { fill: #cbd5e1; }
      .cl     { fill: #e2e8f0; }
      .cl-hi  { fill: #2563eb; }
      .cl-ok  { fill: #10b981; }
      .badge  { fill: #10b981; }

      .name  { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .role  { font-size: 11.5px; fill: #64748b; }</style>

    
